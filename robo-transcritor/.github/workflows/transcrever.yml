name: Transcrever aulas
on:
  schedule:
    - cron: '*/15 * * * *'      # confere a fila a cada 15 minutos
  workflow_dispatch: {}          # botão "Run workflow" para rodar na hora
concurrency:
  group: transcritor
  cancel-in-progress: false
permissions:
  contents: write
env:
  WHISPER_LOCAL: large-v3-turbo  # Whisper que roda no próprio robô quando a cota do Groq acaba ("nao" desliga)
jobs:
  fila:
    runs-on: ubuntu-latest
    outputs:
      vazia: ${{ steps.fila.outputs.vazia }}
    steps:
      - name: Tem algo na fila?
        id: fila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          r=$(curl -s "$SUPABASE_URL/rest/v1/midias?select=id&status=in.(fila,erro,processando)&tentativas=lt.3&limit=1" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          echo "resposta=$r"
          if [ "$r" = "[]" ]; then echo "vazia=1" >> "$GITHUB_OUTPUT"; else echo "vazia=0" >> "$GITHUB_OUTPUT"; fi

  transcrever:
    needs: fila
    if: needs.fila.outputs.vazia == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        robo: [1, 2, 3, 4, 5, 6]   # robôs trabalhando ao mesmo tempo, cada um numa aula diferente (repositório público: até 20)
    steps:
      - uses: actions/checkout@v4
      - name: Guardar o modelo do Whisper entre uma rodada e outra
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_LOCAL }}
      - name: Preparar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Transcrever
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ROBO: ${{ matrix.robo }}
        run: python transcritor.py

  manter-agendamento:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manter o agendamento ativo
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
            date -u > .ultimo-uso
            git config user.name "robo-transcritor"; git config user.email "robo-transcritor@users.noreply.github.com"
            git add .ultimo-uso && git commit -m "Mantém o agendamento ativo" && git push
          fi
