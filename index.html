<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EFEFEC">
<title>Acervo da Turma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens =====================
   Os valores abaixo são o padrão. A tela Aparência troca cor, fundo e letras
   pela conta de cada aluno (ver o script "Aparencia" no <head>). */
:root{
  --chrome:#EFEFEC; --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#F4F4F1;
  --ink:#1F2328; --ink-2:#59606A; --ink-3:#878D96; --line:#DADAD4;
  --accent:#1F3FBF; --accent-ink:#FFFFFF; --accent-soft:#E6EAF8;
  --mark:#FFE95C; --mark-ink:#1F2328;
  --alert:#C8312B; --ok:#1E8E4E; --card-rule:#D8504A; --card-line:#DCE3F5;
  --ui:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --t-texto:18px; --lh:1.7;
  --r-s:4px; --r-m:6px; --r-l:8px;
  --nav-h:60px; --lado:264px;
  color-scheme:light;
}
:root[data-escuro="1"]{color-scheme:dark;--mark:rgba(255,226,70,.34);--mark-ink:var(--ink)}

/* ===================== Base ===================== */
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15.5px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100%}
a{color:var(--accent);text-underline-offset:3px}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--ui);line-height:1.2;margin:0 0 .45em;letter-spacing:-.015em}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.025em}
h2{font-size:1.15rem;font-weight:700;margin-top:1.8em}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 .8em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lede{color:var(--ink-2);max-width:62ch}
.notice{color:var(--ink-2);font-size:.9rem;max-width:68ch}
.crumbs{color:var(--ink-3);font-size:.86rem;margin:0 0 6px}
.crumbs a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.scroll-x{overflow-x:auto;max-width:100%}

/* ===================== Shell ===================== */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;gap:10px;align-items:center}
.brand{font-family:var(--ui);font-weight:800;font-size:1rem;letter-spacing:-.01em;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:9px}
.brand i{width:12px;height:16px;border-radius:2px 4px 4px 2px;background:var(--accent);box-shadow:inset 3px 0 0 rgba(0,0,0,.2);flex:none}
.search{flex:1;display:flex;max-width:520px;margin-left:auto}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--paper);min-width:0}
.search input:focus{outline:none;border-color:var(--accent)}
.topo-ap{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r-m);color:var(--ink-2);flex:none}
.topo-ap svg{width:20px;height:20px}
main{max-width:900px;padding:26px 18px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px)}

/* barra de baixo (celular) */
.nav-baixo{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--chrome);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-baixo a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;font-size:.74rem;font-weight:600;color:var(--ink-2);text-decoration:none}
.nav-baixo a[aria-current="page"]{color:var(--accent)}
.nav-baixo svg{width:21px;height:21px}

/* coluna lateral (computador) */
.lado{display:none}
@media (max-width:520px){ .tabs{gap:16px;margin-left:-18px;margin-right:-18px;padding:0 18px} .tabs .count{display:none} }
@media (min-width:960px){
  .nav-baixo{display:none}
  .lado{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--lado);z-index:21;background:var(--chrome);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 10px calc(env(safe-area-inset-bottom,0px) + 12px);overflow-y:auto;font-size:14px}
  .lado .brand{padding:2px 8px 16px}
  .shell{padding-left:var(--lado)}
  .topbar .brand,.topbar .topo-ap{display:none}
  .topbar{padding-left:clamp(18px,4vw,48px);padding-right:clamp(18px,4vw,48px)}
  .search{margin-left:0}
  main{padding:30px clamp(18px,4vw,48px) 72px}
}
.nav-lado{display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border:0;background:none;border-radius:5px;color:var(--ink);text-align:left;text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.item[aria-current="page"]{background:var(--paper);box-shadow:inset 2px 0 0 var(--accent);font-weight:600}
.item svg{width:16px;height:16px;flex:none;color:var(--ink-3)}
.item .qtd{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:400}
.lado-grupo{margin-top:20px}
.lado-grupo>h2{font-size:12.5px;font-weight:600;color:var(--ink-3);padding:0 8px 4px;margin:0;letter-spacing:0}
.arvore{list-style:none;margin:0;padding:0}
.arvore .arvore{padding-left:12px;margin-left:12px;border-left:1px solid var(--line)}
.arvore .seta{width:13px;height:13px;transition:transform .12s;color:var(--ink-3)}
.arvore li.aberta>.item .seta{transform:rotate(90deg)}
.arvore .cor{width:8px;height:8px;border-radius:2px;flex:none}
.arvore .vazia{padding:5px 8px;color:var(--ink-3);font-size:13px}
.lado-rodape{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
/* ===================== Controls ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:8px;padding-right:8px}
.btn.danger{color:var(--alert)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:12px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;
  text-decoration:none;color:var(--ink);font-size:.92rem}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .count{opacity:.7}
.count{font-size:.82rem;color:var(--ink-2);margin-left:4px;font-weight:400}
.field{display:grid;gap:4px;margin:14px 0}
.field label,.field legend{font-weight:700;font-size:.95rem}
fieldset.field{border:0;padding:0}
.hint{display:block;color:var(--ink-2);font-size:.85rem;font-weight:400}
input[type=text],input[type=url],input[type=email],input[type=search],textarea,select{
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);width:100%}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:400 !important}
.opt input{margin-top:5px}
.grid3{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:640px){ .grid3{grid-template-columns:repeat(3,1fr)} }
.panel{border-top:1px solid var(--line);padding-top:8px;margin-top:28px}
pre{overflow:auto;background:var(--sunk);padding:12px;border-radius:var(--r-s);font-size:.78rem;line-height:1.45;max-height:340px}

/* ===================== Biblioteca ===================== */
.disc{margin:26px 0 8px}
.disc h3{display:flex;align-items:baseline;gap:8px;padding-left:12px;border-left:4px solid var(--accent)}
.mat-list{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.mat-list a{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mat-list a:hover{background:var(--sunk)}
.mat-list .meta{color:var(--ink-2);font-size:.88rem;white-space:nowrap}
.empty{padding:28px 0}

/* ===================== Matéria ===================== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:18px 0 20px}
.tabs a{padding:10px 10px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:700}
.doc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 0}
.doc-head h2{margin:0}
.doc-head .meta{color:var(--ink-2);font-size:.9rem}
.pg{margin:26px 0;padding-top:18px;border-top:1px solid var(--line)}
.pg-head{margin-bottom:10px}
.pg-n{display:block;font-size:.84rem;color:var(--ink-2)}
.reading{font-family:var(--read);font-size:1.04rem;line-height:1.72;max-width:68ch}
.reading img{display:block;margin:12px 0;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;cursor:zoom-in;height:auto}
.reading table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-family:var(--ui);font-size:.9rem}
.reading td,.reading th{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.pg-img{width:100%;height:auto;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;min-height:120px}
.pg-text{margin-top:10px}
.pg-text summary{cursor:pointer;color:var(--accent);font-size:.92rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.gallery img{width:100%;height:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);cursor:zoom-in}

/* Marca-texto: a assinatura visual do app */
mark{background:var(--mark);color:var(--mark-ink);padding:.04em .22em;margin:0 -.04em;
  border-radius:.35em .7em .45em .6em / .6em .35em .7em .4em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ===================== Resumo ===================== */
.points{padding-left:1.1em;margin:8px 0 0}
.points li{margin:0 0 12px;font-family:var(--read);line-height:1.65;max-width:68ch}
.points .src{font-family:var(--ui);font-size:.84rem;margin-left:4px}
.cat{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--accent);margin-right:6px}
.cat-atencao{color:var(--alert)}
.cat-h{font-family:var(--ui);font-size:1rem;margin-top:22px}
.cat-h.cat-atencao{color:var(--alert)}
details.sec{border-top:1px solid var(--line);padding:12px 0}
details.sec summary{cursor:pointer;font-weight:700}
details.sec .points{margin-top:10px}

/* ===================== Flashcards ===================== */
.fc-stage{perspective:1200px;margin:16px 0}
.fc{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:56px 28px 28px;text-align:center;border-radius:var(--r-m);border:1px solid var(--line);font-family:var(--read);font-size:1.22rem;line-height:1.45;
  background-color:var(--surface);
  background-image:linear-gradient(var(--card-rule),var(--card-rule)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--card-line) 31px 32px);
  background-size:100% 2px,100% 100%;background-position:0 40px,0 40px;background-repeat:no-repeat,no-repeat;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-tag{position:absolute;top:12px;left:16px;font-family:var(--ui);font-size:.8rem;color:var(--ink-2)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-list{list-style:none;padding:0;margin:0}
.fc-list li{border-bottom:1px solid var(--line);padding:14px 0}
.fc-list .q{font-weight:700}
.fc-list .a{font-family:var(--read);margin-top:4px}
.fc-list .row{margin-top:6px;font-size:.85rem;color:var(--ink-2)}

/* ===================== Questões ===================== */
.q-card{margin-top:8px}
.q-top{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:.88rem;margin-bottom:10px}
.q-text{font-family:var(--read);font-size:1.06rem;line-height:1.65;white-space:pre-line}
.alts{list-style:none;padding:0;margin:14px 0}
.alt{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--surface);margin:8px 0;cursor:pointer;line-height:1.45}
.alt:hover{border-color:var(--ink-2)}
.alt .l{font-weight:700;min-width:1.3em}
.alt .v{margin-left:auto;font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.alt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.alt.wrong{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 11%,var(--surface))}
.alt.top{border-color:var(--accent)}
.alt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 var(--r-m) var(--r-m) 0}
.feedback.ok{border-color:var(--ok)}
.feedback.bad{border-color:var(--alert)}
.selo{font-size:.85rem;color:var(--ink-2)}

/* ===================== Busca ===================== */
.hit-group{margin:24px 0}
.hits{list-style:none;padding:0;margin:6px 0 0}
.hits a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hits a:hover{background:var(--sunk)}
.hits .t{font-weight:700}
.hits .p{color:var(--ink-2);font-size:.85rem;margin-left:6px}
.hits .s{font-family:var(--read);margin:4px 0 0;color:var(--ink);font-size:.96rem}

/* ===================== Envio ===================== */
.plan-table{width:100%;border-collapse:collapse;font-size:.92rem}
.plan-table th,.plan-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table td.n{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.log{list-style:none;padding:0;margin:8px 0;font-size:.86rem;color:var(--ink-2);max-height:240px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px dashed var(--line)}
.log .err{color:var(--alert)}

/* ===================== Overlays ===================== */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-m);z-index:60;max-width:92vw;font-size:.95rem}
@media (min-width:960px){ .toast{bottom:24px} }
dialog{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);width:min(580px,94vw);padding:20px;max-height:90vh}
dialog::backdrop{background:rgb(0 0 0 / .5)}
dialog.lightbox{width:98vw;max-width:1400px;padding:8px;background:#111}
dialog.lightbox img{display:block;width:100%;height:auto;background:#fff}
dialog.lightbox .row{padding:4px}

/* ===================== v3: Biblioteca em 3 níveis ===================== */
.lib-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.esp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:8px}
.esp-tile{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px 20px;border:1px solid var(--line);border-radius:var(--r-l);
  background:var(--surface);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;min-height:104px}
.esp-tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--hue,var(--accent))}
.esp-tile:hover{border-color:var(--ink-2)}
.esp-tile .nome{font-family:var(--read);font-weight:700;font-size:1.12rem;line-height:1.2}
.esp-tile .meta{color:var(--ink-2);font-size:.86rem;margin-top:auto}
.area{margin:22px 0 4px}
.area h2{font-family:var(--ui);font-size:1rem;color:var(--ink);margin:0 0 8px}

/* ===================== v3: Apostila ===================== */
.apostila{font-family:var(--read);font-size:1.06rem;line-height:1.75;max-width:70ch}
.apostila h2.cap{font-size:1.45rem;margin:1.8em 0 .6em;padding-top:.6em;border-top:2px solid var(--line)}
.apostila h2.cap:first-of-type{border-top:0;margin-top:.4em}
.apostila h3{font-family:var(--ui);font-size:1em;font-weight:700;color:var(--ink);margin:1.6em 0 .4em}
.apostila h4{font-family:var(--ui);font-size:1rem;margin:1.2em 0 .3em}
.apostila p{margin:0 0 .85em}
.apostila ul{margin:.2em 0 1em;padding-left:1.2em}
.apostila li{margin:.25em 0}
.apostila .ancora{display:block;height:0;scroll-margin-top:90px}
.fig{margin:1.1em 0;padding:10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:var(--r-s);background:#fff;cursor:zoom-in}
.fig figcaption{font-family:var(--ui);font-size:.84rem;color:var(--ink-2);margin-top:6px;text-align:center}
.fig.pendente{color:var(--ink-2);font-family:var(--ui);font-size:.88rem;text-align:center;padding:22px;border-style:dashed}
.sumario{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;background:var(--surface);margin:6px 0 18px}
.sumario summary{cursor:pointer;font-weight:700}
.sumario ol{margin:8px 0 2px;padding-left:1.2em;columns:2;column-gap:24px;font-size:.92rem}
@media (max-width:640px){.sumario ol{columns:1}}
.sumario a{color:var(--ink)}
.pg-orig{margin:22px 0;padding-top:14px;border-top:1px solid var(--line)}
.pg-orig .figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.pg-orig .figs img{width:100%;height:140px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);cursor:zoom-in}

/* ===================== v3: Resumo estruturado ===================== */
.resumo-v3{max-width:70ch}
.resumo-v3 section{margin:0 0 26px}
.resumo-v3 h3{font-family:var(--ui);font-size:1rem;color:var(--ink);
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.resumo-v3 ul{list-style:none;margin:0;padding:0}
.resumo-v3 li{font-family:var(--read);line-height:1.7;margin:0 0 10px;padding-left:16px;position:relative}
.resumo-v3 li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--ink-2);opacity:.55}
.resumo-v3 .src{font-family:var(--ui);font-size:.78rem;margin-left:6px;white-space:nowrap;opacity:.8}

/* ===================== v3: Flashcards (um por vez) ===================== */
.painel-f{border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;background:var(--surface);margin-bottom:14px}
.painel-f .lbl{font-size:.82rem;color:var(--ink-2);margin:12px 0 6px;font-weight:700}
.painel-f .lbl:first-child{margin-top:0}
.painel-f .chips{margin:0;flex-wrap:wrap}
.painel-f .chip{font-size:.84rem;padding:5px 11px}
.contagem{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--ink-2);margin-top:12px}
.contagem b{color:var(--ink);font-size:1rem}
.fcv-barra{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fcv-barra i{display:block;height:100%;background:var(--accent);transition:width .25s}
.fcv-cont{font-size:.86rem;color:var(--ink-2);margin:8px 0}
.fcv-card{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;cursor:pointer;
  transition:transform .18s ease}
.fcv-card.virando{transform:rotateX(90deg)}
.fcv-topo{display:flex;flex-wrap:wrap;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tag{font-size:.78rem;padding:1px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink-2);font-weight:700}
.tag.esp{color:var(--accent);border-color:var(--accent)}
.tag.prova{color:var(--alert);border-color:var(--alert)}
.fcv-corpo{padding:22px 20px 24px;min-height:220px}
.fcv-frente{font-family:var(--read);font-size:1.22rem;line-height:1.5;font-weight:600}
.fcv-verso{font-family:var(--read);font-size:1.05rem;line-height:1.65;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);white-space:pre-line}
.fcv-dica{font-size:.84rem;color:var(--ink-2);margin-top:16px}
.fcv-ctrl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;margin-top:10px}
.fcv-ctrl2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn.bom{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.ruim{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:700}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kbd-dica{font-size:.78rem;color:var(--ink-2);margin-top:10px}

/* ===================== v3: Questões ===================== */
.q-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.q-enun p{font-family:var(--read);font-size:1.05rem;line-height:1.7;margin:0 0 .7em}
.q-figs{display:grid;gap:10px;margin:10px 0 14px}
.q-figs img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;cursor:zoom-in}
.q-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.q-coment{white-space:pre-line;font-family:var(--read);line-height:1.65}

/* ===================== v3: Painel ===================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 22px}
.kpi{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--surface)}
.kpi .v{font-family:var(--read);font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi .l{font-size:.82rem;color:var(--ink-2)}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;margin:8px 0 4px}
.semana .col{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.semana .pilha{width:70%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.semana .b{background:var(--accent)}
.semana .b.erro{background:var(--alert)}
.semana .d{font-size:.72rem;color:var(--ink-2)}
.semana .n{font-size:.72rem;color:var(--ink)}
.dom-lista{list-style:none;padding:0;margin:0}
.dom-lista li{display:grid;grid-template-columns:1fr 110px 48px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.dom-lista .bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.dom-lista .bar i{display:block;height:100%}
.dom-lista .pct{text-align:right;font-weight:700}
.dom-lista .sub{display:block;font-size:.78rem;color:var(--ink-2)}
.revisar{list-style:none;padding:0;margin:0}
.revisar li{border:1px solid var(--line);border-left:4px solid var(--alert);border-radius:var(--r-m);padding:12px 14px;margin:0 0 10px;background:var(--surface)}
.revisar .t{font-size:.8rem;color:var(--ink-2);margin-bottom:4px}
.revisar .s{font-family:var(--read);line-height:1.6;white-space:pre-line}

/* ===================== v4: IA ===================== */
.alerta{border-left:4px solid var(--alert);background:color-mix(in srgb,var(--alert) 9%,var(--surface));padding:10px 14px;border-radius:0 var(--r-m) var(--r-m) 0;margin:1em 0;font-family:var(--ui);font-size:.96rem;line-height:1.55}
.tab-md{border-collapse:collapse;font-family:var(--ui);font-size:.9rem;margin:1em 0;min-width:60%}
.tab-md th,.tab-md td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tab-md th{background:var(--sunk)}
.apostila ol{margin:.2em 0 1em;padding-left:1.4em}
.tag.ia{color:#7A4FB5;border-color:#7A4FB5}
/* ===================== v3: Voltar ===================== */
.voltar-flut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;
  background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 6px 18px rgb(0 0 0 / .3);cursor:pointer}
@media (min-width:960px){.voltar-flut{bottom:24px;left:calc(50% + 104px)}}

@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;scroll-behavior:auto !important} }
/* ===================== v4: Administração e moderação ===================== */
.tbl-wrap{overflow-x:auto;margin:10px 0 6px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
.tbl th{font-size:.8rem;color:var(--ink-2);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.quebra{white-space:normal;min-width:180px}
.tbl a{color:var(--accent)}
.adm-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.adm-resumo div{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--surface)}
.adm-resumo b{display:block;font-size:1.25rem}
.adm-resumo span{color:var(--ink-2);font-size:.82rem}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:12px 0}
.mod-grid figure{margin:0;border:1px solid var(--line);border-radius:var(--r-m);padding:8px;background:var(--surface)}
.mod-grid img{width:100%;height:140px;object-fit:contain;filter:blur(14px);transition:filter .2s;cursor:pointer}
.mod-grid img.ver{filter:none}
.mod-grid figcaption{font-size:.8rem;color:var(--ink-2);margin:6px 0}
img.mod-blur{filter:blur(16px)}
main#view{position:relative}
.notas-camada{position:absolute;left:0;top:0;width:100%;height:0;z-index:30}
.nota{position:absolute;min-width:150px;max-width:min(560px,96%);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.28);resize:horizontal;overflow:hidden;font-family:var(--ui)}
.nota .barra{display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:grab;touch-action:none;background:rgba(0,0,0,.1)}
.nota .barra:active{cursor:grabbing}
.nota .pega{opacity:.65;user-select:none}
.nota .spacer{flex:1}
.nota input[type=color]{width:24px;height:24px;border:1px solid rgba(0,0,0,.25);border-radius:6px;padding:0;background:none;cursor:pointer;vertical-align:middle}
.nota .x{border:0;background:none;color:inherit;font-size:1.3rem;cursor:pointer;line-height:1;padding:0 4px}
.nota textarea{display:block;width:100%;min-height:84px;border:0;background:transparent;color:inherit;font:inherit;font-size:.95rem;padding:8px 10px;resize:vertical;outline:none}
.nota-nova{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px);z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.prep{list-style:none;padding:0;margin:0}
.prep li{padding:3px 0 3px 22px;position:relative}
.prep li::before{position:absolute;left:0;font-weight:700}
.prep.ok li::before{content:'✓';color:var(--ok)}
.prep.pend li::before{content:'…';color:var(--ink-2)}
.prep.erro li::before{content:'✗';color:var(--alert)}
.prep .meta,.versoes .meta,.pasta-itens .meta{color:var(--ink-2);font-size:.82rem}
.versoes,.pasta-itens{list-style:none;padding:0;margin:10px 0}
.versoes li,.pasta-itens li{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin:8px 0;background:var(--surface)}
.pasta-itens .links{font-size:.86rem;margin-top:4px}
.pasta-itens li > div{min-width:0;flex:1}
li.com-botao{display:flex;align-items:center;gap:8px}
li.com-botao > a{flex:1;min-width:0}
.hit-add{flex-shrink:0}
.img-bloq{display:block;padding:18px;border:1px dashed var(--line);border-radius:var(--r-m);color:var(--ink-2);font-size:.88rem;text-align:center}

/* ===================== v5: visual novo (Acervo como ferramenta de estudo) ===================== */
.btn{border-radius:var(--r-m);padding:8px 14px;font-weight:600;font-size:.93rem;background:var(--paper)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.86rem}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{border-radius:5px;padding:5px 11px;font-size:.88rem;background:var(--paper)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=text],input[type=url],input[type=email],input[type=search],textarea,select{border-radius:var(--r-m);background:var(--paper)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.panel{margin-top:30px}
pre{background:var(--sunk)}

/* Biblioteca: especialidades em lista com lombada colorida, sem cards */
.lib-acoes{margin:4px 0 22px}
.esp-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px;border-top:1px solid var(--line)}
.esp-tile{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 12px;min-height:0;padding:12px 4px 12px 20px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.esp-tile::before{inset:15px auto auto 4px;width:8px;height:12px;border-radius:2px}
.esp-tile:hover{background:color-mix(in srgb,var(--accent) 5%,var(--paper));border-color:var(--line)}
.esp-tile .nome{font-family:var(--ui);font-size:1rem;font-weight:600}
.esp-tile .meta{margin:0 0 0 auto;font-size:.84rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.disc h3{border-left:0;padding-left:0}
.mat-list a{padding:11px 4px}
.mat-list a:hover,.hits a:hover{background:color-mix(in srgb,var(--accent) 5%,var(--paper))}
.mat-list .meta{color:var(--ink-3)}

/* Página do tema */
.tabs{gap:22px;margin:14px 0 26px}
.tabs a{padding:9px 0 10px;border-bottom-width:2px;font-weight:600;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.count{color:var(--ink-3)}
.reading,.apostila,.q-text,.q-enun p,.points li,.resumo-v3 li,.fc-list .a,.q-coment,.hits .s,.revisar .s{font-size:var(--t-texto);line-height:var(--lh)}
.reading,.apostila{max-width:38em}
.apostila h2.cap{font-family:var(--ui);font-size:1.3em;font-weight:700;letter-spacing:-.015em;border-top:1px solid var(--line)}
.apostila h4{font-size:.95em}
.apostila .ancora{scroll-margin-top:80px}
mark{border-radius:2px;padding:.04em .14em;margin:0}
.sumario{border-radius:var(--r-m);background:var(--paper)}
.fig{border-radius:var(--r-m);background:var(--paper)}
.alerta{border-radius:0;background:color-mix(in srgb,var(--alert) 7%,var(--paper))}
.feedback{border-radius:0;background:var(--sunk);font-size:.97rem}
.resumo-v3 h3{border-bottom:0;padding-bottom:0;margin-bottom:8px}
.resumo-v3 li::before{border-radius:1px;opacity:.45}

/* Flashcards: ficha pautada de verdade */
.fc-face{border-radius:3px}
.fcv-card{border-radius:3px;background:var(--paper)}
.fcv-topo{background:none;padding:10px 18px}
.fcv-corpo{padding:6px 22px 22px;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(1.75em - 1px),color-mix(in srgb,var(--accent) 16%,var(--paper)) calc(1.75em - 1px) 1.75em);
  background-position:0 calc(6px + 1.75em);border-top:1px solid var(--card-rule)}
.fcv-frente{font-size:calc(var(--t-texto) * 1.15);line-height:1.75em;font-weight:600}
.fcv-verso{font-size:var(--t-texto);line-height:1.75em;border-top:0;padding-top:0;margin-top:1.75em}
.painel-f{border-radius:var(--r-l);background:var(--paper)}
.fcv-barra,.bar,.dom-lista .bar{height:4px;border-radius:2px}
.btn.bom{background:var(--ok);border-color:var(--ok)}
.btn.ruim{background:var(--paper);border-color:var(--alert);color:var(--alert)}

/* Questões */
.alt{border-radius:0;border-width:0 0 1px;margin:0;padding:11px 8px;background:none}
.alts{border-top:1px solid var(--line)}
.alt:hover{background:color-mix(in srgb,var(--accent) 5%,var(--paper));border-color:var(--line)}
.alt .l{color:var(--ink-3)}
.alt.right{border-color:var(--line);background:color-mix(in srgb,var(--ok) 11%,var(--paper))}
.alt.right .l{color:var(--ok)}
.alt.wrong{border-color:var(--line);background:color-mix(in srgb,var(--alert) 9%,var(--paper))}
.alt.wrong .l{color:var(--alert)}
.alt.top{box-shadow:inset 3px 0 0 var(--accent)}

/* Painel: números como texto, não como cards */
.kpis{gap:0;border-top:1px solid var(--line)}
.kpi{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 4px}
.kpi .v{font-family:var(--ui);font-size:1.5rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.revisar li{border-radius:0 var(--r-m) var(--r-m) 0;background:var(--paper)}
.semana .pilha{border-radius:2px 2px 0 0}

/* Administração e listas */
.tbl-wrap{border-radius:var(--r-m);background:var(--paper)}
.adm-resumo div,.versoes li,.pasta-itens li,.mod-grid figure{border-radius:var(--r-m);background:var(--paper)}

/* Avisos */
.toast{border-radius:var(--r-m);background:var(--ink);color:var(--paper)}
dialog{border-radius:var(--r-l);background:var(--paper)}
.voltar-flut{border-radius:var(--r-m);box-shadow:0 4px 14px rgb(0 0 0 / .22)}
@media (min-width:960px){.voltar-flut{left:calc(50% + var(--lado) / 2)}}

/* ===================== v5: Aparência ===================== */
.ap-grade{display:grid;grid-template-columns:minmax(0,1fr);gap:36px;align-items:start}
@media (min-width:1180px){.ap-grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} main.largo{max-width:1180px}}
.campo{padding:18px 0;border-bottom:1px solid var(--line)}
.campo:first-child{padding-top:0}
.campo>h2{font-size:1rem;margin:0 0 3px}
.campo>p{font-size:.86rem;color:var(--ink-2);margin:0 0 12px}
.cores{display:flex;flex-wrap:wrap;gap:8px}
.cor-op{width:42px;height:54px;border-radius:3px 6px 6px 3px;border:0;padding:0;background:var(--c);box-shadow:inset 5px 0 0 rgba(0,0,0,.2);cursor:pointer}
.cor-op[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}
.cor-livre{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.88rem;color:var(--ink-2)}
.cor-livre input{width:38px;height:30px;border:1px solid var(--line);border-radius:5px;padding:2px;background:var(--paper);cursor:pointer}
.fundos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.fundo-op{border:1px solid var(--line);border-radius:var(--r-m);padding:0;overflow:hidden;background:none;text-align:left;cursor:pointer}
.fundo-op .amostra{display:block;height:42px;position:relative}
.fundo-op .amostra i{position:absolute;left:10px;right:10px;height:3px;border-radius:2px}
.fundo-op .n{display:block;padding:5px 8px;font-size:.82rem;border-top:1px solid var(--line)}
.fundo-op[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.letras{display:grid;gap:4px}
.letra-op{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;border:1px solid transparent;border-radius:var(--r-m);padding:7px 10px;background:none;text-align:left;cursor:pointer}
.letra-op:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.letra-op[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--paper))}
.letra-op .aa{font-size:26px;line-height:1}
.letra-op b{display:block;font-weight:400;font-size:1rem}
.letra-op small{color:var(--ink-3);font-size:.82rem}
.segmento{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.segmento button{border:0;border-left:1px solid var(--line);background:var(--paper);padding:6px 14px;font-size:.88rem;color:var(--ink-2);cursor:pointer}
.segmento button:first-child{border-left:0}
.segmento button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.faixa-tam{display:flex;align-items:center;gap:12px;max-width:380px}
.faixa-tam input{flex:1;accent-color:var(--accent)}
.prontos{display:flex;flex-wrap:wrap;gap:8px}
.pronto-op{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--paper);padding:6px 10px 6px 6px;font-size:.88rem;cursor:pointer}
.pronto-op i{display:flex;width:30px;height:22px;border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.12)}
.pronto-op i b{flex:1}
.previa{position:sticky;top:76px;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.previa-barra{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:.8rem;color:var(--ink-3);background:var(--chrome);border-bottom:1px solid var(--line)}
.previa-corpo{padding:22px 24px;background:var(--paper)}
.previa-corpo .apostila{max-width:none}
.previa .fcv-card{margin-top:16px;cursor:default}

/* ===================== v18: Hoje, revisão espaçada, questões erradas, índice da apostila ===================== */
.item .qtd.forte{color:var(--accent);font-weight:700}
.nav-baixo a{position:relative}
.qtd-baixo:not(:empty){position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;line-height:17px;font-weight:700}
#ladoConta .avatar{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
#ladoConta .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hoje-topo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.hoje-grade{display:grid;gap:8px 44px}
@media (min-width:980px){.hoje-grade{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.hoje-sec h2{margin:26px 0 10px;font-size:1.1rem}
.hoje-sec .meta{color:var(--ink-3);font-size:.85rem}
.tabela-wrap{overflow-x:auto}
.tab-hoje,.arquivos{width:100%;border-collapse:collapse;font-size:.95rem}
.tab-hoje th,.arquivos th{text-align:left;font-size:.8rem;color:var(--ink-2);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tab-hoje td,.arquivos td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tab-hoje .num,.arquivos .num{text-align:right;font-variant-numeric:tabular-nums}
.tab-hoje td a{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);text-decoration:none}

<script>
/* ============================ Aparência (cores e letras escolhidas pelo aluno) ============================
   Roda antes de a página aparecer, para não piscar com as cores padrão. As escolhas ficam salvas neste aparelho. */
(function () {
  const PADRAO = { acento: '#1F3FBF', fundo: 'auto', letraTexto: 'literata', letraUi: 'schibsted', tamanho: 18, linhas: 'normal' };
  const FUNDOS = {
    auto: { nome: 'Automático' },
    branco: { nome: 'Branco', chrome: '#EFEFEC', folha: '#FFFFFF', linha: '#DADAD4', tinta: '#1F2328', tinta2: '#59606A', tinta3: '#878D96' },
    reciclado: { nome: 'Reciclado', chrome: '#E6DFCF', folha: '#F4EFE3', linha: '#D2C8B3', tinta: '#2B2620', tinta2: '#5F574B', tinta3: '#8A8172' },
    cinza: { nome: 'Cinza claro', chrome: '#DDE0E4', folha: '#F4F5F7', linha: '#C9CDD3', tinta: '#1C2026', tinta2: '#4F5661', tinta3: '#79818C' },
    noite: { nome: 'Noite', chrome: '#121417', folha: '#1A1D21', linha: '#2E3238', tinta: '#E6E8EB', tinta2: '#A9AFB8', tinta3: '#757C87', escuro: true },
    lousa: { nome: 'Lousa', chrome: '#15231D', folha: '#1C2E26', linha: '#2F473C', tinta: '#E8EFE9', tinta2: '#AFC2B6', tinta3: '#7E9488', escuro: true },
    oceano: { nome: 'Oceano', chrome: '#131B26', folha: '#1A2332', linha: '#2B3749', tinta: '#F1FAEE', tinta2: '#A8C4CC', tinta3: '#7489A0', escuro: true },
  };
  const CORES = [['Azul caneta', '#1F3FBF'], ['Verde', '#2E6B4F'], ['Vermelho', '#B8322A'], ['Rosa', '#C2417A'], ['Laranja', '#C25E12'], ['Roxo', '#5B3FA8'], ['Grafite', '#3D4148']];
  const LETRAS = {
    literata: { nome: 'Literata', desc: 'De livro, feita para leitura longa na tela', css: '"Literata", Georgia, serif' },
    source: { nome: 'Source Serif', desc: 'Clássica, parecida com artigo científico', css: '"Source Serif 4", Georgia, serif' },
    atkinson: { nome: 'Atkinson Hyperlegible', desc: 'Letras parecidas ficam bem diferentes', css: '"Atkinson Hyperlegible", system-ui, sans-serif' },
    lexend: { nome: 'Lexend', desc: 'Larga e espaçada, cansa menos a vista', css: '"Lexend", system-ui, sans-serif' },
    schibsted: { nome: 'Schibsted Grotesk', desc: 'Sem serifa, a mesma do menu', css: '"Schibsted Grotesk", system-ui, sans-serif' },
    sistema: { nome: 'Do seu aparelho', desc: 'A letra padrão do celular ou computador', css: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' },
  };
  const LETRAS_UI = { schibsted: LETRAS.schibsted, atkinson: LETRAS.atkinson, lexend: LETRAS.lexend, sistema: LETRAS.sistema };
  const LINHAS = { compacto: ['Compacto', 1.5], normal: ['Normal', 1.7], arejado: ['Arejado', 1.95] };
  const PRONTOS = [
    ['Padrão', PADRAO],
    ['Ártico', { fundo: 'cinza', acento: '#4A6FA5', letraTexto: 'source' }],
    ['Jardim', { fundo: 'reciclado', acento: '#4A7C59', letraTexto: 'literata' }],
    ['Oceano', { fundo: 'oceano', acento: '#2D8B8B', letraTexto: 'atkinson' }],
    ['Pôr do sol', { fundo: 'branco', acento: '#C4553A', letraTexto: 'lexend' }],
    ['Lousa', { fundo: 'lousa', acento: '#E9C46A', letraTexto: 'atkinson' }],
  ];
  const hexRgb = h => { const n = parseInt(String(h).replace('#', ''), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const rgbHex = r => '#' + r.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  const mistura = (a, b, t) => { const x = hexRgb(a), y = hexRgb(b); return rgbHex(x.map((v, i) => v + (y[i] - v) * t)); };
  const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; };
  const contraste = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return (x + .05) / (y + .05); };
  // ajusta a cor escolhida até ficar legível sobre o fundo
  const legivel = (c, folha) => { const alvo = lum(folha) < .2 ? '#FFFFFF' : '#000000'; for (let i = 0; i < 12 && contraste(c, folha) < 4; i++) c = mistura(c, alvo, .12); return c; };
  const escuroDoAparelho = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;

  function ler() { try { return { ...PADRAO, ...JSON.parse(localStorage.getItem('aparencia') || '{}') }; } catch (e) { return { ...PADRAO }; } }
  function aplicar(p) {
    p = p || ler();
    const chave = p.fundo === 'auto' || !FUNDOS[p.fundo] ? (escuroDoAparelho() ? 'noite' : 'branco') : p.fundo;
    const f = FUNDOS[chave];
    const ac = legivel(/^#[0-9a-f]{6}$/i.test(p.acento) ? p.acento : PADRAO.acento, f.folha);
    const st = document.documentElement.style; const set = (k, v) => st.setProperty(k, v);
    set('--chrome', f.chrome); set('--paper', f.folha); set('--surface', f.folha); set('--sunk', mistura(f.folha, f.tinta, .045));
    set('--line', f.linha); set('--ink', f.tinta); set('--ink-2', f.tinta2); set('--ink-3', f.tinta3);
    set('--accent', ac); set('--accent-ink', lum(ac) > .35 ? '#14161A' : '#FFFFFF'); set('--accent-soft', mistura(f.folha, ac, .12));
    set('--card-line', mistura(f.folha, ac, .16));
    set('--read', (LETRAS[p.letraTexto] || LETRAS.literata).css); set('--ui', (LETRAS_UI[p.letraUi] || LETRAS.schibsted).css);
    set('--t-texto', (Number(p.tamanho) || 18) + 'px'); set('--lh', String((LINHAS[p.linhas] || LINHAS.normal)[1]));
    if (f.escuro) { set('--ok', '#4FC487'); set('--alert', '#FF7A72'); set('--card-rule', '#E0675F'); }
    else { set('--ok', '#1E8E4E'); set('--alert', '#C8312B'); set('--card-rule', '#D8504A'); }
    document.documentElement.dataset.escuro = f.escuro ? '1' : '0';
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', f.chrome);
  }
  function salvar(m) { const p = { ...ler(), ...m }; try { localStorage.setItem('aparencia', JSON.stringify(p)); } catch (e) { /* sem armazenamento */ } aplicar(p); if (window.Aparencia.aoSalvar) window.Aparencia.aoSalvar(p); return p; }
  window.Aparencia = { PADRAO, FUNDOS, CORES, LETRAS, LETRAS_UI, LINHAS, PRONTOS, ler, aplicar, salvar, mistura };
  aplicar();
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => aplicar());
})();
</script>

'use strict';
/* =====================================================================
   ACERVO DA TURMA
   App 100% em código (sem IA) que lê o material da turma no Google Drive,

/* Junta linhas quebradas no meio da frase (comum em PDF) */
function joinLines(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim());
  const out = []; let buf = '';
  const isBullet = l => /^([•●▪◦\-–*]|\d{1,3}[.)]|[a-eA-E][.)])\s/.test(l);
  for (const l of lines) {
    if (!l) { if (buf) { out.push(buf); buf = ''; } continue; }
    if (!buf) { buf = l; continue; }
    const endsSentence = /[.!?:;]$/.test(buf);
    const startsLower = /^[a-zà-ÿ(,]/.test(l);
    if (buf.endsWith('-') && startsLower) buf = buf.slice(0, -1) + l;
    else if (!endsSentence && startsLower && !isBullet(l)) buf += ' ' + l;
    else { out.push(buf); buf = l; }
  }
  if (buf) out.push(buf);
  return out.join('\n');
}

function splitSentences(text) {
  const out = [];
  joinLines(text).split('\n').forEach(line => {
    line = line.replace(/^\s*(?:[•●▪◦\-–*]|\d{1,2}[.)])\s+/, '').trim();
    if (!line) return;
    line.split(/(?<=[.!?;])\s+(?=[A-ZÀ-Ý0-9“"(])/).forEach(s => {
      s = s.trim();
      if (s.length >= 25 && s.length <= 420) out.push(s);
    });
  });
  return out;
}

function termKeys(text) {

    if (ok) { out.push([n, w]); if (prev) out.push([prev[0] + ' ' + n, prev[1] + ' ' + w]); prev = [n, w]; }
    else prev = null;
  }
  return out;
}

function snippet(texto, qn, len = 190) {
  const raw = String(texto || '').replace(/\s+/g, ' ');
  const i = norm(raw).indexOf(qn);
  if (i < 0) return raw.slice(0, len) + (raw.length > len ? '…' : '');
  const s = Math.max(0, i - 70);
  return (s > 0 ? '…' : '') + raw.slice(s, s + len) + (s + len < raw.length ? '…' : '');
}

/* Destaca termos com marca-texto, ignorando acentos e maiúsculas */
function highlight(text, terms) {
  const raw = String(text || ''); const n = norm(raw); const ranges = [];
  for (const t of terms || []) {
    const tn = norm(t).trim(); if (tn.length < 3) continue;
    let i = 0; while ((i = n.indexOf(tn, i)) !== -1) { ranges.push([i, i + tn.length]); i += tn.length; }
  }
  ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
  let out = '', pos = 0;
  for (const [a, b] of ranges) { if (a < pos) continue; out += esc(raw.slice(pos, a)) + '<mark>' + esc(raw.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(raw.slice(pos));

function cortarTermos(linha, termos) {
  const n = norm(linha); const ranges = [];
  for (const t of termos) {
    let i = 0;
    while ((i = n.indexOf(t, i)) !== -1) {
      const antes = n[i - 1], depois = n[i + t.length];
      if ((!antes || !/[a-z0-9]/.test(antes)) && (!depois || !/[a-z0-9]/.test(depois))) ranges.push([i, i + t.length]);
      i += t.length;

  if (!ranges.length) return linha;
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of ranges) { if (a < pos) continue; out += linha.slice(pos, a); pos = b; }

function pontuar(texto, chaves) {
  let s = 0;
  for (const c of chaves) { let i = 0, n = 0; while ((i = texto.indexOf(c, i)) !== -1 && n < 25) { n++; i += c.length; } s += n; }
  return s;
}
/* Recebe nomes (pastas + arquivo, com peso maior) e texto; devolve { especialidade, area } */
function classificarConteudo(nomes, texto) {
  const tn = ' ' + norm(nomes.join(' ')) + ' ';
  const tt = ' ' + norm(String(texto || '').slice(0, 20000)) + ' ';
  let melhor = null, melhorPts = 0;
  for (const e of ESPECIALIDADES) {
    const pts = pontuar(tn, e.chaves) * 8 + pontuar(tt, e.chaves);
    if (pts > melhorPts) { melhor = e; melhorPts = pts; }
  }
  if (!melhor || melhorPts < 3) return { especialidade: 'Outros', area: 'Geral' };
  let area = null, areaPts = 0;
  for (const a of melhor.areas) {
    const pts = pontuar(tn, a.chaves) * 8 + pontuar(tt, a.chaves);
    if (pts > areaPts) { area = a; areaPts = pts; }
  }
  return { especialidade: melhor.nome, area: area && areaPts >= 2 ? area.nome : 'Geral' };
}
/* Tema: a pasta mais específica que não seja genérica; se não houver, o nome do arquivo */
function escolherTema(caminho, nomeArquivo) {
  for (let i = caminho.length - 1; i >= 0; i--) { if (!ehGenerica(caminho[i])) { const t = limparNome(caminho[i]); if (t) return t; } }
  return limparNome(nomeArquivo) || 'Geral';
}

/* Lista oficial de temas: a de dentro do app é o ponto de partida; o administrador pode editar (fica no banco) */
function montarTaxonomia(texto) {
  const esps = []; let atual = null;
  for (const linha of String(texto || '').split('\n')) {
    const l = linha.trim(); if (!l) continue;
    if (l.startsWith('@')) { const [nome, ...ap] = l.slice(1).split('|'); atual = { nome, apelidos: [...new Set([nome, ...ap].map(normT))], areas: [] }; esps.push(atual); continue; }
    const i = l.indexOf(':'); if (i < 0 || !atual) continue;
    const area = l.slice(0, i).trim();
    const chaves = l.slice(i + 1).split(';').map(s => s.trim()).filter(Boolean)
      .map(t => ({ t, n: normT(t), sigla: /^[A-Z0-9][A-Z0-9\-/]{1,6}$/.test(t) }));
    atual.areas.push({ esp: atual.nome, area, n: normT(area), chaves });
  }
  return esps;
}
let TAXONOMIA = montarTaxonomia(LISTA_TEMAS);
const Listas = {

    try { const t = await App.store.listaTemas?.(); this.carregou = true; if (t) this.aplicar(t); } catch (e) { console.warn(e); }
  },
  aplicar(t) { const tx = montarTaxonomia(t); if (tx.length) { TAXONOMIA = tx; this.texto = t; } },
  atual() { return this.texto || LISTA_TEMAS; },
};
const contar = (txt, alvo, max) => { let n = 0, i = 0; while (n < max && (i = txt.indexOf(alvo, i)) !== -1) { n++; i += alvo.length; } return n; };
const contarSigla = (txt, sigla, max) => (txt.match(new RegExp('(^|[^A-Za-z0-9])' + escRe(sigla) + '(?![A-Za-z0-9])', 'g')) || []).slice(0, max).length;
/* Especialidade citada no nome de uma pasta ou arquivo (a mais específica, ex.: "Cirurgia Pediátrica" antes de "Cirurgia") */
function especialidadeNosNomes(nomes) {
  let achada = null;
  for (const nome of nomes) {
    const nn = normT(nome); let melhor = null, tam = 0;
    for (const e of TAXONOMIA) for (const a of e.apelidos) {
      const ok = a.trim().length < 5 ? nn === a : nn.includes(a);
      if (ok && a.length > tam) { melhor = e; tam = a.length; }
    }
    if (melhor) achada = melhor;          // a pasta mais funda que cita uma especialidade é a que vale
  }
  return achada;
}
function classificarPelaLista(nomes, texto) {
  const nNomes = normT(nomes.join(' | ')); const orig = String(texto || '').slice(0, 40000); const nTexto = normT(orig);
  const esp = especialidadeNosNomes(nomes);
  const areas = esp ? esp.areas : TAXONOMIA.flatMap(e => e.areas);
  const notas = areas.map(a => {
    let nome = 0, txt = 0;
    if (nNomes.includes(a.n)) nome += 40;
    for (const c of a.chaves) {
      if ((c.sigla || c.n.trim().length >= 4) && (c.sigla ? contarSigla(nomes.join(' | '), c.t, 1) : nNomes.includes(c.n))) nome += 12;
      txt += Math.min(3, c.sigla ? contarSigla(orig, c.t, 3) : c.n.trim().length >= 5 ? contar(nTexto, c.n, 3) : 0);
    }
    txt += 3 * contar(nTexto, a.n, 5);
    return { esp: a.esp, area: a.area, s: nome + txt, nome };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const [p, q] = notas;
  const confiante = !!p && (p.nome >= 12 && (!q || p.nome > q.nome || p.s >= q.s * 1.3) || (p.s >= 15 && (!q || p.s >= q.s * 1.4)) || (!q && p.s >= 8));
  return { esp: p?.esp || esp?.nome || null, area: p?.area || null, espDaPasta: esp?.nome || null, confiante: confiante || (!!esp && !p), candidatos: notas.slice(0, 12) };
}

}

/* ===================== Arquivo que cobre várias áreas da lista =====================
   Uma apostila ou aula pode trazer várias áreas da lista oficial num arquivo só (ex.: a Nefrologia inteira num PDF).
   Pelos títulos das páginas o app acha onde cada área começa e separa o arquivo em partes, cada uma no tema da sua
   área. Sem IA. Uma área só conta como começo se o título traz o nome dela, ou se ela aparece em 2 páginas seguidas
   (assim um assunto citado de passagem num título não corta o arquivo). */
function areaDoCabecalho(cab, areas, preferida) {
  const n = normT(cab); if (n.trim().length < 3) return null;
  const notas = [];
  for (const a of areas) {
    let s = n.includes(a.n) ? 40 : 0;
    for (const c of a.chaves) if (c.sigla ? contarSigla(cab, c.t, 1) : (c.n.trim().length >= 6 && n.includes(c.n))) s += 12;
    if (s) notas.push({ a, s: s + (a.esp === preferida ? 1 : 0) });   // empate: fica a especialidade em que o arquivo já está
  }
  notas.sort((x, y) => y.s - x.s);
  const [p, q] = notas;
  return p && p.s >= 12 && (!q || p.s > q.s) ? p : null;
}
const cabecalhoDaPagina = p => ((p.titulo || '') + ' | ' + String(p.texto || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 2).join(' | ')).slice(0, 200);
/* Página que abre uma especialidade inteira: o título é só o nome dela (ex.: "UROLOGIA", "Capítulo 5 - Oncologia").
   Título com duas especialidades (linha de sumário) ou frase longa não conta. */
function espDoCabecalho(p) {
  const t = String(p.titulo || String(p.texto || '').split('\n').map(l => l.trim()).find(Boolean) || '').slice(0, 120);
  const n = normT(t); let achados = [];
  for (const e of TAXONOMIA) for (const a of e.apelidos) if (a.trim().length >= 4 && n.includes(a)) achados.push({ e, a });
  achados = achados.filter(x => !achados.some(y => y.a !== x.a && y.a.includes(x.a)));   // "cirurgia pediátrica" vence "cirurgia"
  const esps = [...new Set(achados.map(x => x.e))];
  if (esps.length !== 1) return null;
  const w = Math.max(...achados.map(x => x.a.trim().split(' ').length));
  const palavras = n.trim().split(' ').filter(x => x && !/^\d+$/.test(x));
  return palavras.length <= w + 3 ? esps[0] : null;
}
/* paginas: [{ id, titulo, texto }] na ordem do arquivo; espNome: especialidade em que o arquivo está hoje (só desempata).
   Devolve as partes [{ esp, area, ids }] (2 ou mais) ou null. Dois níveis: o título com o nome de uma especialidade abre
   uma seção dela; dentro da seção, os títulos das áreas da lista abrem as partes. Seção sem títulos de área fica com a
   área que o conteúdo indicar. */
function dividirPorArea(paginas, espNome) {
  if (paginas.length < 2) return null;
  const todas = TAXONOMIA.flatMap(e => e.areas);
  let ctx = null; const partes = [];
  for (const p of paginas) {
    const ult = partes.at(-1); const e = espDoCabecalho(p);
    if (e) {
      if (e !== ctx) { ctx = e; partes.push({ esp: e, a: null, secao: true, ids: [p.id] }); } else if (ult) ult.ids.push(p.id); else partes.push({ esp: e, a: null, secao: true, ids: [p.id] });
      continue;
    }
    const m = areaDoCabecalho(cabecalhoDaPagina(p), ctx ? ctx.areas : todas, espNome);
    if (m && m.a !== ult?.a) partes.push({ esp: TAXONOMIA.find(x => x.nome === m.a.esp), a: m.a, forte: m.s >= 40, marcadas: 1, ids: [p.id] });
    else if (ult) { ult.ids.push(p.id); if (m) ult.marcadas = (ult.marcadas || 0) + 1; }
    else partes.push({ esp: null, a: null, ids: [p.id] });                       // capa e sumário antes de tudo
  }
  // área citada de passagem (sem o nome dela no título e em uma página só) não abre parte
  for (const pt of partes) if (pt.a && !pt.forte && pt.marcadas < 2) { pt.a = null; pt.esp = null; pt.secao = false; }
  let ok = [];
  for (const pt of partes) {
    const ant = ok.at(-1);
    if (!ant) { ok.push({ ...pt, ids: [...pt.ids] }); continue; }
    if (!pt.esp && !pt.a) { ant.ids.push(...pt.ids); continue; }                                     // continuação
    if (!ant.esp && !ant.a) { Object.assign(ant, { esp: pt.esp, a: pt.a, secao: pt.secao }); ant.ids.push(...pt.ids); continue; }   // capa
    if (pt.esp === ant.esp && pt.a === ant.a) { ant.ids.push(...pt.ids); continue; }
    if (ant.secao && !ant.a && pt.esp === ant.esp && pt.a) { ant.a = pt.a; ant.secao = false; ant.ids.push(...pt.ids); continue; }  // abertura da especialidade + 1ª área
    ok.push({ ...pt, ids: [...pt.ids] });
  }
  // abertura de uma página só seguida de outra especialidade (linha de sumário, divisória vazia): junta com a anterior
  ok = ok.filter((pt, i) => { if (i > 0 && pt.secao && !pt.a && pt.ids.length === 1) { ok[i - 1].ids.push(...pt.ids); return false; } return true; });
  if (ok.length < 2 || ok.some(x => !x.esp)) return null;
  // seção sem títulos de área: a área vem do conteúdo do trecho
  const porId = new Map(paginas.map(p => [p.id, p]));
  const out = ok.map(pt => {
    if (pt.a) return { esp: pt.esp.nome, area: pt.a.area, ids: pt.ids };
    const txt = pt.ids.slice(0, 15).map(id => { const p = porId.get(id); return (p.titulo || '') + '\n' + (p.texto || ''); }).join('\n');
    const c = classificarPelaLista([pt.esp.nome], txt);
    return { esp: pt.esp.nome, area: c.esp === pt.esp.nome && c.area ? c.area : 'Geral', ids: pt.ids };
  });

  for (const x of out) { const ant = juntas.at(-1); if (ant && ant.esp === x.esp && ant.area === x.area) ant.ids.push(...x.ids); else juntas.push({ ...x, ids: [...x.ids] }); }
  return juntas.length >= 2 ? juntas : null;
}

/* Limpa o HTML vindo de documentos antes de mostrar (segurança) */
const ALLOWED_TAGS = new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','STRONG','B','EM','I','U','TABLE','THEAD','TBODY','TR','TD','TH','BR','IMG','SUP','SUB','BLOCKQUOTE','SPAN']);
const DROP_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','LINK','META','svg','SVG','MATH','FORM','INPUT','BUTTON']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  const root = doc.body.firstElementChild;
  (function walk(node) {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 1) {
        if (DROP_TAGS.has(c.tagName)) { c.remove(); continue; }
        walk(c);
        if (!ALLOWED_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
        for (const a of [...c.attributes]) {
          const okRef = c.tagName === 'IMG' && a.name === 'data-ref' && /^(local|sb):[\w/.-]+$/.test(a.value);
          const okSpan = (c.tagName === 'TD' || c.tagName === 'TH') && /^(colspan|rowspan)$/.test(a.name) && /^\d+$/.test(a.value);
          if (!okRef && !okSpan) c.removeAttribute(a.name);
        }
        if (c.tagName === 'IMG') { if (!c.hasAttribute('data-ref')) c.remove(); else c.setAttribute('alt', 'Imagem do material'); }
      } else if (c.nodeType !== 3) c.remove();
    }
  })(root);
  return root.innerHTML;
}

        mk('materias', 'id'); mk('documentos', 'id', ['materia_id']); mk('paginas', 'id', ['materia_id', 'documento_id']);

    const out = { arquivos: 0, movidos: 0, juntados: 0, separados: 0, temas: [] };

    return pages.filter(p => (p.texto_norm || '').includes(qn)).slice(0, 80)
      .map(p => ({ id: p.id, materia_id: p.materia_id, documento_id: p.documento_id, n: p.n, titulo: p.titulo, snippet: snippet(p.texto, qn) }));
  }

  async imageUrls(refs) {
    const out = new Map();
    for (const r of refs) {
      if (this.urlCache.has(r)) { out.set(r, this.urlCache.get(r)); continue; }
      if (!r.startsWith('local:')) continue;
      const rec = await this._get('blobs', r.slice(6));
      if (rec?.blob) { const u = URL.createObjectURL(rec.blob); this.urlCache.set(r, u); out.set(r, u); }
    }
    return out;
  }

}

/* ============ Moderação de conteúdo ============
   Imagens: antes de guardar, um modelo de visão (NSFWJS, roda no próprio aparelho) avalia cada figura e foto.
   As suspeitas de conteúdo sexual não são apagadas: ficam escondidas até o administrador liberar ou remover,
   porque material de Medicina tem imagens anatômicas legítimas que o modelo pode confundir.
   Textos: flashcards, questões e denúncias com palavrões são recusados. */
const Moderacao = {
  modelo: null, indisponivel: false,
  async carregar() {
    if (this.modelo || this.indisponivel) return this.modelo;
    try {
      await loadLib('nsfwModelo'); await loadLib('nsfwPesos'); await loadLib('nsfw');
      this.modelo = await window.nsfwjs.load();
    } catch (e) { console.warn('Moderação de imagens indisponível:', e); this.indisponivel = true; }
    return this.modelo;
  },
  async verificar(blob) {
    try {
      if (!blob || !/^image\//.test(blob.type)) return null;
      const m = await this.carregar(); if (!m) return null;
      const img = await blobToImage(blob);
      const p = Object.fromEntries((await m.classify(img)).map(c => [c.className, c.probability]));
      const sexual = (p.Porn || 0) + (p.Hentai || 0);
      if (sexual >= 0.7) return { motivo: 'Possível conteúdo sexual', pontuacao: +sexual.toFixed(3) };
      if ((p.Sexy || 0) >= 0.9) return { motivo: 'Possível nudez', pontuacao: +(p.Sexy).toFixed(3) };
      return null;
    } catch (e) { console.warn(e); return null; }
  },
};
const PALAVROES = ['porra', 'caralho', 'puta', 'putaria', 'merda', 'foda', 'foder', 'fodase', 'viado', 'buceta', 'arrombado', 'arrombada',
  'cuzao', 'piroca', 'punheta', 'xoxota', 'vadia', 'vagabunda', 'babaca', 'otario', 'otaria', 'desgracado', 'desgracada'];
function conferirTexto(...textos) {
  const n = ' ' + norm(textos.join(' ')).replace(/[^a-z0-9]+/g, ' ') + ' ';
  if (PALAVROES.some(w => n.includes(' ' + w + ' '))) throw new Error('O texto tem palavras impróprias. Revise antes de salvar.');
}

  async dividirDocumento(doc, partes) {

        criado_por: doc.criado_por || this.user().id, criado_em: nowIso() };
      await comRetentativa(async () => { const r = await this.sb.from('documentos').insert(novo); if (r.error && !/duplicate/i.test(r.error.message)) throw new Error(r.error.message); });
      for (let i = 0; i < pt.pageIds.length; i += 150) {
        const ids = pt.pageIds.slice(i, i + 150);
        await comRetentativa(async () => { const r = await this.sb.from('paginas').update({ documento_id: novo.id, materia_id: pt.materia_id }).in('id', ids); if (r.error) throw new Error(r.error.message); });

    // em vários PDFs) é guardada uma vez só, mesmo que apareça em centenas de páginas.
    const ext = (blob.type.split('/')[1] || 'bin').replace('jpeg', 'jpg');
    const hash = crypto.subtle ? [...new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()))].map(b => b.toString(16).padStart(2, '0')).join('') : uuid();
    const path = `img/${hash}.${ext}`;

      if (r.error && !/duplicate/i.test(r.error.message)) console.warn(r.error.message);
      this._bloq = null;
    }
    return 'sb:' + path;
  }
  async imageUrls(refs) {
    const out = new Map(); const need = [];
    for (const r of refs) { if (this.urlCache.has(r)) out.set(r, this.urlCache.get(r)); else if (r.startsWith('sb:')) need.push(r); }
    for (let i = 0; i < need.length; i += 100) {

      d.forEach((x, j) => { if (x.signedUrl) { this.urlCache.set(chunk[j], x.signedUrl); out.set(chunk[j], x.signedUrl); } });
    }
    return out;
  }
}

/* ============================ Google Drive ============================
   O app não usa a conta Google de ninguém. Quem envia material compartilha a pasta
   com o "e-mail robô" do projeto (conta de serviço do Google). A função "drive" do
   Supabase lê a pasta com esse robô e repassa os arquivos para este aparelho, que faz
   a extração de texto, imagens e OCR. A chave do robô fica só no servidor. */
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const Drive = {
  robo: null,
  disponivel() { return App.store?.mode === 'supabase'; },
  async api(acao, params = {}, asBlob = false, retry = 2) {
    const { data } = await App.store.sb.auth.getSession();
    const token = data.session?.access_token;
    if (!token) throw new Error('Faça login de novo para enviar material.');
    const u = new URL(cfg('SUPABASE_URL').replace(/\/$/, '') + '/functions/v1/drive');
    u.searchParams.set('acao', acao);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u, { headers: { Authorization: 'Bearer ' + token, apikey: cfg('SUPABASE_ANON_KEY') } });
    if ((r.status === 429 || r.status >= 500) && retry > 0) { await new Promise(res => setTimeout(res, 1500)); return this.api(acao, params, asBlob, retry - 1); }
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error || ''; } catch { /* sem corpo */ }
      if (r.status === 404) throw new Error(`Não consegui abrir. Confira se a pasta foi compartilhada com ${this.robo || 'o e-mail do app'}.`);
      throw new Error(msg || `O servidor respondeu ${r.status}.`);
    }
    return asBlob ? r.blob() : r.json();
  },
  async quem() { if (!this.robo) this.robo = (await this.api('quem')).email; return this.robo; },
  meta(id) { return this.api('meta', { id }); },
  async children(id) {
    let out = [], pageToken = '';
    do {
      const j = await this.api('listar', pageToken ? { id, pageToken } : { id });
      out = out.concat(j.files || []); pageToken = j.nextPageToken || '';
    } while (pageToken);
    return out;
  },
  async walk(rootId, onProgress) {
    const out = []; const stack = [{ id: rootId, path: [] }];
    while (stack.length) {
      const { id, path } = stack.pop();
      for (const k of await this.children(id)) {
        if (k.mimeType === FOLDER_MIME) stack.push({ id: k.id, path: [...path, k.name] });
        else if (k.mimeType !== 'application/vnd.google-apps.shortcut') out.push({ file: k, path });
      }
      onProgress && onProgress(out.length);
    }
    return out;
  },
  async download(f) {
    const exportMap = {
      'application/vnd.google-apps.document': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.google-apps.presentation': 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'application/vnd.google-apps.spreadsheet': 'text/csv',
    };
    if (f.mimeType.startsWith('application/vnd.google-apps.')) {
      const m = exportMap[f.mimeType]; if (!m) return null;
      return { blob: await this.api('baixar', { id: f.id, exportar: m }, true), mime: m };
    }
    return { blob: await this.api('baixar', { id: f.id }, true), mime: f.mimeType };
  },
};
function parseFolderId(link) {
  const s = String(link || '').trim();
  const m = s.match(/folders\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/);
  if (m) return m[1];
  return /^[\w-]{10,}$/.test(s) ? s : null;
}

/* ============================ Extração por tipo ============================ */
function fileKind(name, mime = '') {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (mime === 'application/pdf' || ext === 'pdf') return 'PDF';
  if (mime.includes('wordprocessingml') || mime === 'application/vnd.google-apps.document' || ext === 'docx') return 'Word';
  if (mime.includes('presentationml') || mime === 'application/vnd.google-apps.presentation' || ext === 'pptx') return 'Slides';
  if (mime.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].includes(ext)) return 'Imagem';
  if (mime === 'application/vnd.google-apps.spreadsheet' || mime.startsWith('text/') || ['txt', 'md', 'csv'].includes(ext)) return 'Texto';
  if (mime.startsWith('audio/') || ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'opus', 'wma', 'flac'].includes(ext)) return 'Áudio';
  if (mime.startsWith('video/') || ['mp4', 'mov', 'mkv', 'webm', 'avi', 'm4v', 'wmv', '3gp'].includes(ext)) return 'Vídeo';
  return null;
}

let ocrWorker = null;
async function ocr(canvas) {
  try {
    await loadLib('tesseract');
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('por');
    const { data } = await ocrWorker.recognize(canvas);
    return (data.text || '').trim();
  } catch (e) { console.warn('OCR falhou', e); return ''; }
}
async function stopOcr() { if (ocrWorker) { try { await ocrWorker.terminate(); } catch { /* ignore */ } ocrWorker = null; } }

function groupPdfLines(items, vp) {
  const rows = [];
  const sorted = items.map(it => {
    const [vx, vy] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
    return { str: it.str, x: vx, y: vy, size: Math.hypot(it.transform[2], it.transform[3]) || it.height || 10 };
  }).sort((a, b) => a.y - b.y || a.x - b.x);
  for (const it of sorted) {
    const row = rows.find(r => Math.abs(r.y - it.y) < Math.max(2, it.size * 0.45));
    if (row) { row.items.push(it); row.size = Math.max(row.size, it.size); } else rows.push({ y: it.y, size: it.size, items: [it] });
  }
  return rows.sort((a, b) => a.y - b.y)
    .map(r => ({ y: r.y, size: r.size, text: r.items.sort((a, b) => a.x - b.x).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim() }))
    .filter(r => r.text);
}

/* Onde estão as imagens dentro da página (ECGs, fotos, esquemas), em coordenadas da página */
async function caixasDeFiguras(pg, vp) {
  const O = pdfjsLib.OPS, U = pdfjsLib.Util;
  const ops = await pg.getOperatorList();
  let ctm = [1, 0, 0, 1, 0, 0]; const pilha = []; const caixas = [];
  const pinta = new Set([O.paintImageXObject, O.paintInlineImageXObject, O.paintImageMaskXObject, O.paintJpegXObject].filter(v => v !== undefined));
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], a = ops.argsArray[i];
    if (fn === O.save) pilha.push(ctm.slice());
    else if (fn === O.restore) ctm = pilha.pop() || [1, 0, 0, 1, 0, 0];
    else if (fn === O.transform) ctm = U.transform(ctm, a);
    else if (fn === O.paintFormXObjectBegin) { pilha.push(ctm.slice()); if (Array.isArray(a?.[0]) && a[0].length === 6) ctm = U.transform(ctm, a[0]); }
    else if (fn === O.paintFormXObjectEnd) ctm = pilha.pop() || [1, 0, 0, 1, 0, 0];
    else if (pinta.has(fn)) {
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => vp.convertToViewportPoint(...U.applyTransform(p, ctm)));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      caixas.push({ x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
    }
  }
  const W = vp.width, H = vp.height;
  let bs = caixas.map(b => { const x = Math.max(0, b.x), y = Math.max(0, b.y); return { x, y, w: Math.min(W, b.x + b.w) - x, h: Math.min(H, b.y + b.h) - y }; })
    .filter(b => b.w >= 50 && b.h >= 40 && b.w / b.h < 8 && b.h / b.w < 8);
  const escaneada = bs.some(b => b.w * b.h >= 0.8 * W * H);
  bs = bs.filter(b => b.w * b.h < 0.8 * W * H);
  // junta pedaços da mesma figura (imagens fatiadas ou coladas lado a lado)
  let mudou = true;
  while (mudou) {
    mudou = false;
    outer: for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], b = bs[j], g = 6;
      if (a.x - g < b.x + b.w && b.x - g < a.x + a.w && a.y - g < b.y + b.h && b.y - g < a.y + a.h) {
        const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
        bs[i] = { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
        bs.splice(j, 1); mudou = true; break outer;
      }
    }
  }
  return { caixas: bs.sort((a, b) => a.y - b.y), escaneada };
}

/* Figuras que não são conteúdo: logotipos de cabeçalho e rodapé, faixas decorativas, fotos ilustrativas de banco
   de imagens ("Fonte: Shutterstock") e páginas de propaganda (QR code, "baixe o app"). */
const RE_BANCO_IMAGENS = /shutterstock|freepik|adobe\s*stock|istock|unsplash|pexels|depositphotos|dreamstime|123rf/i;
const RE_PROPAGANDA = /google play|app store|qr ?code|baixe o app|aponte a c[âa]mera|bit\.ly\//i;
function filtrarFiguras(caixas, linhas, vp) {
  const W = vp.width, H = vp.height;
  if (RE_PROPAGANDA.test(linhas.map(l => l.text).join(' '))) return [];
  return caixas.filter(c => {
    const area = c.w * c.h / (W * H);
    if ((c.y + c.h <= 0.1 * H || c.y >= 0.9 * H) && area < 0.08) return false;     // logo de cabeçalho ou rodapé
    if (c.w > 0.85 * W && c.h < 0.12 * H) return false;                            // faixa decorativa
    if (linhas.some(l => RE_BANCO_IMAGENS.test(l.text) && l.y >= c.y - 15 && l.y <= c.y + c.h + 45)) return false;  // foto ilustrativa
    return true;
  });
}
/* Depois de ler o PDF inteiro: tira figuras que se repetem na mesma posição em muitas páginas (logos, molduras)
   e as da capa e da contracapa, e renumera os marcadores [[FIG:n]] do texto. */
function podarFiguras(pages) {
  const N = pages.length; if (!N) return pages;
  const chave = b => [b.x, b.y, b.w, b.h].map(v => Math.round(v * 40)).join(':');
  const cont = new Map();
  pages.forEach(p => new Set((p.figBoxes || []).map(chave)).forEach(k => cont.set(k, (cont.get(k) || 0) + 1)));
  const lim = Math.max(3, Math.ceil(N * 0.25));
  pages.forEach((p, i) => {
    const boxes = p.figBoxes || []; if (!boxes.length) return;
    const capa = N >= 5 && (i === 0 || i === N - 1);
    const manter = boxes.map(b => !capa && (cont.get(chave(b)) || 0) < lim);
    if (manter.every(Boolean)) return;
    const novoIdx = []; let k = 0; manter.forEach((m, j) => { novoIdx[j] = m ? k++ : -1; });
    p.texto = String(p.texto || '').replace(/\[\[FIG:(\d+)\]\]/g, (_, n) => novoIdx[+n] >= 0 ? `[[FIG:${novoIdx[+n]}]]` : '');
    p.figBoxes = boxes.filter((_, j) => manter[j]);
    p.figBlobs = (p.figBlobs || []).filter((_, j) => manter[j]);
  });
  return pages;
}

/* Lê uma página. Sem imagens: só texto (rápido). Com imagens: texto com marcadores [[FIG:n]] no lugar
   de cada figura, recortes das figuras, foto da página e OCR quando a página é escaneada. */
async function lerPaginaPdf(pg, comImagens, onStep) {
  const vp1 = pg.getViewport({ scale: 1 });
  const tc = await pg.getTextContent();
  const linhas = groupPdfLines(tc.items.filter(it => it.str && it.str.trim()), vp1);
  const sizes = linhas.map(l => l.size).sort((a, b) => a - b);
  const med = sizes[Math.floor(sizes.length / 2)] || 0;
  const grandes = linhas.filter(l => med && l.size >= med * 1.25 && l.text.length > 3 && l.text.length < 100);
  const out = { titulo: grandes[0]?.text || null, destaques: grandes.slice(1, 8).map(l => l.text), figBoxes: [] };
  if (!comImagens) { out.texto = linhas.map(l => l.text).join('\n'); return out; }
  const det = await caixasDeFiguras(pg, vp1); const escaneada = det.escaneada;
  const caixas = filtrarFiguras(det.caixas, linhas, vp1);
  const entradas = linhas.map(l => ({ y: l.y, t: l.text }));
  caixas.forEach((c, i) => entradas.push({ y: c.y + 1, t: `[[FIG:${i}]]` }));
  entradas.sort((a, b) => a.y - b.y);
  out.texto = entradas.map(e => e.t).join('\n');
  out.figBoxes = caixas.map(c => ({ x: c.x / vp1.width, y: c.y / vp1.height, w: c.w / vp1.width, h: c.h / vp1.height }));

  const canvas = document.createElement('canvas'); canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    const pad = 4;
    const sx = Math.max(0, Math.floor(c.x * s) - pad), sy = Math.max(0, Math.floor(c.y * s) - pad);
    const sw = Math.min(canvas.width - sx, Math.ceil(c.w * s) + pad * 2), sh = Math.min(canvas.height - sy, Math.ceil(c.h * s) + pad * 2);

    k.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);

  if (nLetras < 40 || escaneada && linhas.length < 5) {

    const t = await ocr(canvas);
    if (t) { out.texto = t; out.ocr = true; }
  }

  // já ficam inteiras no app, e a foto delas seria a maior parte do espaço ocupado no Supabase.
  if (out.ocr || nLetras < 300) out.imagemBlob = await blobCompacto(canvas, 1200, 0.62);
