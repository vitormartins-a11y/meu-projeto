/* ============================ Enviar material ============================ */
const Prog = {
  state: null,
  start(total) { this.state = { i: 0, total, nome: '', etapa: '', fase: '', logs: [], prontos: [], esperando: [], done: false, res: null }; this.paint(); },
  fase(t) { if (this.state) { this.state.fase = t; this.paint(); } },
  step(i, total, nome, etapa) { if (!this.state) return; Object.assign(this.state, { i, total, nome, etapa }); this.paint(); },
  log(msg, err) { if (!this.state) return; this.state.logs.unshift({ msg, err }); if (this.state.logs.length > 400) this.state.logs.pop(); this.paint(); },
  pronto(mat) { if (!this.state) return; this.state.prontos.push(mat); this.paint(); },
  espera(mat) { if (!this.state) return; this.state.esperando.push(mat); this.paint(); },
  ia(tema, etapa) { if (!this.state) return; this.state.iaAtivos = this.state.iaAtivos || {}; if (etapa) this.state.iaAtivos[tema] = etapa.replace(/^IA: /, ''); else delete this.state.iaAtivos[tema]; this.paint(); },
  finish(res) { this.state.done = true; this.state.res = res; this.paint(); },
  paint() {
    const el = $('#progress'); if (!el || !this.state) return; const s = this.state;
    const logs = s.logs.length ? `<details style="margin-top:10px"><summary class="notice" style="cursor:pointer">Registro detalhado (${s.logs.length})</summary><ul class="log">${s.logs.map(l => `<li class="${l.err ? 'err' : ''}">${esc(l.msg)}</li>`).join('')}</ul></details>` : '';
    const listaTemas = (titulo, ms) => ms.length ? `<h3 style="margin-top:18px">${titulo}</h3><ul class="mat-list">${ms.map(m => `<li><a href="#/m/${m.id}"><span>${esc(m.materia)}</span><span class="meta">${esc(m.periodo)} › ${esc(m.disciplina)}</span></a></li>`).join('')}</ul>` : '';
    const prontos = listaTemas('Publicados para a turma', s.prontos) + listaTemas('Esperando a IA (ainda não publicados)', s.esperando);
    if (s.done) {
      const r = s.res; const partes = [plural(r.ok, 'arquivo lido', 'arquivos lidos')];
      if (r.midias) partes.push(`${plural(r.midias, 'áudio ou vídeo enviado', 'áudios e vídeos enviados')} para transcrição`);
      if (r.realocados) partes.push(`${plural(r.realocados, 'arquivo mudou', 'arquivos mudaram')} para ${r.realocadosPara} (sem baixar de novo)`);
      if (r.pulados - (r.realocados || 0) > 0) partes.push(`${plural(r.pulados - (r.realocados || 0), 'arquivo já estava', 'arquivos já estavam')} no acervo`); if (r.ignorados) partes.push(`${r.ignorados} sem texto legível`); if (r.erros.length) partes.push(`${r.erros.length} com erro`);
      el.innerHTML = `<section class="panel"><h2>Envio concluído</h2><p>${partes.join(', ')}.</p>
        ${r.erroRealocar ? `<p class="notice" style="color:var(--alert)"><strong>Os arquivos que já estavam no acervo não mudaram de lugar:</strong> ${esc(r.erroRealocar)}</p>` : ''}

async function runImport(items) {

  let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch { /* sem suporte */ }
  const onUnload = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', onUnload);
  try {
    const r = await processarItens(items, Prog); Prog.finish(r);
    App.store.registrarEnvio?.({ origem: items.some(i => i.driveId) ? 'Google Drive' : 'Arquivos do aparelho', arquivos: items.length, ok: r.ok,
      pulados: r.pulados, erros: r.erros.length, midias: r.midias || 0, temas: (r.materias || []).map(m => m.materia).slice(0, 60) });
  }
  catch (e) { Prog.finish({ ok: 0, pulados: 0, ignorados: 0, erros: [{ nome: 'Envio', msg: e.message }], materias: [] }); }
  finally { App.processing = false; App.matsCache = null; window.removeEventListener('beforeunload', onUnload); try { await lock?.release(); } catch { /* ignore */ } }
}

  if (!id) throw new Error('Não encontrei o ID da pasta neste link. Copie o link da barra de endereço do Drive.');

  const dest = { periodo: (fd.get('periodo') || '').trim(), disciplina: (fd.get('disciplina') || '').trim(), materia: (fd.get('materia') || '').trim() };
  if (modo === 'unica' && (!dest.periodo || !dest.disciplina || !dest.materia)) throw new Error('Preencha especialidade, área e tema.');

create or replace function eh_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from admins where lower(email) = lower(coalesce(auth.jwt() ->> 'email', '')));
$$;
revoke all on function eh_admin() from public, anon;
grant execute on function eh_admin() to authenticated;

-- Temas: só o administrador apaga (apagar um tema levaria junto os arquivos de outras pessoas)
drop policy if exists apagar on materias;
create policy apagar on materias for delete to authenticated using (eh_admin());
-- Arquivos: quem enviou ou o administrador
drop policy if exists apagar on documentos;
create policy apagar on documentos for delete to authenticated using (criado_por = auth.uid() or eh_admin());
-- Páginas: cada um só altera as páginas dos próprios arquivos
drop policy if exists atualizar on paginas;
create policy atualizar on paginas for update to authenticated
  using (eh_admin() or exists (select 1 from documentos d where d.id = documento_id and d.criado_por = auth.uid()))
  with check (eh_admin() or exists (select 1 from documentos d where d.id = documento_id and d.criado_por = auth.uid()));
-- Flashcards e questões: os criados à mão só por quem criou (ou o administrador)
drop policy if exists apagar on flashcards;
create policy apagar on flashcards for delete to authenticated using (eh_admin() or (eh_membro() and (criado_por = auth.uid() or origem <> 'ALUNO')));
drop policy if exists apagar on questoes;
create policy apagar on questoes for delete to authenticated using (eh_admin() or (eh_membro() and (criado_por = auth.uid() or origem <> 'ALUNO')));
-- Imagens: ninguém sobrescreve imagem de outra pessoa; só o administrador apaga
drop policy if exists "acervo atualizar imagens" on storage.objects;
drop policy if exists "acervo apagar imagens" on storage.objects;
create policy "acervo apagar imagens" on storage.objects for delete to authenticated using (bucket_id = 'paginas' and eh_admin());

-- Painel do administrador: um resumo por pessoa
create or replace function admin_resumo(dias int default 30) returns json
language plpgsql stable security definer set search_path = public as $$
declare desde timestamptz := now() - make_interval(days => dias); r json;
begin
  if not eh_admin() then raise exception 'Apenas o administrador pode ver este painel.'; end if;
  select coalesce(json_agg(x order by x.ultimo_login desc nulls last), '[]') into r from (
    select u.id, u.email::text as email, u.created_at as criado_em, u.last_sign_in_at as ultimo_login,
      exists (select 1 from membros m where lower(m.email) = lower(u.email)) as membro,
      (select coalesce(sum(a.segundos), 0) from acessos a where a.user_id = u.id and a.inicio >= desde) as segundos,
      (select count(distinct (a.inicio at time zone 'America/Sao_Paulo')::date) from acessos a where a.user_id = u.id and a.inicio >= desde) as dias_ativos,
      (select max(a.inicio + make_interval(secs => a.segundos)) from acessos a where a.user_id = u.id) as ultimo_acesso,
      (select count(*) from documentos d where d.criado_por = u.id) as arquivos,
      (select count(*) from envios e where e.user_id = u.id) as envios,
      (select count(*) from progresso p where p.user_id = u.id and p.tipo = 'q') as questoes,
      (select round(100.0 * avg(case when p.acertou then 1 else 0 end)) from progresso p where p.user_id = u.id and p.tipo = 'q' and p.acertou is not null) as acerto,
      (select count(*) from progresso p where p.user_id = u.id and p.tipo = 'fc') as flashcards,
      (select count(*) from flashcards f where f.criado_por = u.id and f.origem = 'ALUNO')
        + (select count(*) from questoes q where q.criado_por = u.id and q.origem = 'ALUNO') as criados
    from auth.users u) x;
  return r;
end $$;
revoke all on function admin_resumo(int) from public, anon;
grant execute on function admin_resumo(int) to authenticated;

-- Painel do administrador: detalhes de uma pessoa
create or replace function admin_usuario(uid uuid, dias int default 30) returns json
language plpgsql stable security definer set search_path = public as $$
declare desde timestamptz := now() - make_interval(days => dias); r json;
begin
  if not eh_admin() then raise exception 'Apenas o administrador pode ver este painel.'; end if;
  select json_build_object(
    'temas', (select coalesce(json_agg(t), '[]') from (
        select a.materia_id, m.materia, m.periodo, sum(a.segundos) as segundos, count(*) as visitas, max(a.inicio) as ultima
        from acessos a left join materias m on m.id = a.materia_id
        where a.user_id = uid and a.inicio >= desde and a.materia_id is not null
        group by a.materia_id, m.materia, m.periodo order by sum(a.segundos) desc limit 40) t),
    'secoes', (select coalesce(json_agg(s), '[]') from (
        select a.aba, sum(a.segundos) as segundos, count(*) as visitas from acessos a
        where a.user_id = uid and a.inicio >= desde group by a.aba order by sum(a.segundos) desc) s),
    'por_dia', (select coalesce(json_agg(d), '[]') from (
        select (a.inicio at time zone 'America/Sao_Paulo')::date as dia, sum(a.segundos) as segundos from acessos a
        where a.user_id = uid and a.inicio >= desde group by 1 order by 1) d),
    'recentes', (select coalesce(json_agg(v), '[]') from (
        select a.inicio, a.segundos, a.aba, a.rota, m.materia from acessos a left join materias m on m.id = a.materia_id
        where a.user_id = uid order by a.inicio desc limit 80) v),
    'envios', (select coalesce(json_agg(e), '[]') from (select * from envios e where e.user_id = uid order by e.em desc limit 40) e),
    'aparelhos', (select coalesce(json_agg(distinct a.aparelho), '[]') from acessos a where a.user_id = uid and a.aparelho is not null)
  ) into r;
  return r;
end $$;
revoke all on function admin_usuario(uuid, int) from public, anon;
grant execute on function admin_usuario(uuid, int) to authenticated;

alter table falhas_envio enable row level security;
drop policy if exists ler on falhas_envio;
create policy ler on falhas_envio for select to authenticated using (eh_membro());

drop policy if exists limpar on falhas_envio;
create policy limpar on falhas_envio for delete to authenticated using (eh_membro());

-- Versões: a oficial é a da IA (tabela resumos); cada ajuste pedido na aba Ajustes vira uma versão nova
create table if not exists versoes (
  id uuid primary key default gen_random_uuid(), materia_id uuid not null references materias on delete cascade,
  nome text, alvo text, instrucao text, dados jsonb not null,
  autor uuid not null default auth.uid(), autor_email text default (auth.jwt() ->> 'email'), criado_em timestamptz default now());
create index if not exists versoes_tema on versoes (materia_id, criado_em);
alter table versoes enable row level security;
drop policy if exists ler on versoes;
create policy ler on versoes for select to authenticated using (eh_membro());
drop policy if exists criar on versoes;
create policy criar on versoes for insert to authenticated with check (
  eh_membro() and autor = auth.uid() and (autor_email is null or autor_email = auth.jwt() ->> 'email')
  and (eh_admin() or (select count(*) from versoes v where v.autor = auth.uid() and v.criado_em > now() - interval '1 day') < 5));
drop policy if exists apagar on versoes;
create policy apagar on versoes for delete to authenticated using (autor = auth.uid() or eh_admin());

/* Uso de IA da própria pessoa (Minha conta): quanto da cota grátis da chave dela já foi usado hoje, quando recarrega
   e os últimos 7 dias. Cada pessoa vê só o próprio uso. */
async function montarMeuUso() {
  const box = $('#meuUsoIA'); if (!box || App.store?.mode !== 'supabase') return;
  const agora = Date.now(); const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);
  const iniG = inicioDiaPT(agora), proxG = iniG + DIA_MS;
  const desde = new Date(Math.min(hoje0.getTime() - 13 * DIA_MS, iniG - 14 * DIA_MS));
  let rows; try { rows = await App.store.usoIAMeu(desde.toISOString()); } catch (e) { return; }
  if (!box.isConnected) return;
  const H = (rows || []).map(h => ({ t: Date.parse(h.hora), propria: !!h.propria, aceitos: +h.aceitos, recusados: +h.recusados, dia: +h.cota_dia, tin: +h.tokens_in, tout: +h.tokens_out }));
  const prop = H.filter(h => h.propria), turma = H.filter(h => !h.propria);
  const soma = (rs, f) => rs.filter(f).reduce((a, h) => ({ aceitos: a.aceitos + h.aceitos, recusados: a.recusados + h.recusados, tin: a.tin + h.tin, tout: a.tout + h.tout }), { aceitos: 0, recusados: 0, tin: 0, tout: 0 });
  const hojeP = soma(prop, h => h.t >= iniG); const esgot = prop.some(h => h.t >= iniG && h.dia > 0 && h.recusados > 0);
  const diasP = [...Array(14)].map((_, i) => { const a = iniG - (i + 1) * DIA_MS; return { n: soma(prop, h => h.t >= a && h.t < a + DIA_MS).aceitos, acabou: prop.some(h => h.t >= a && h.t < a + DIA_MS && h.dia > 0) }; });
  const lim = Math.max(0, ...diasP.filter(d => d.acabou).map(d => d.n), esgot ? hojeP.aceitos : 0) || null;
  const pct = esgot ? 0 : lim ? Math.max(0, Math.round((1 - hojeP.aceitos / lim) * 100)) : null;
  const tem = !!Chaves.get();
  const turmaHoje = soma(turma, h => h.t >= hoje0.getTime()).aceitos;
  const d7 = [...Array(7)].map((_, i) => { const a = hoje0.getTime() - (6 - i) * DIA_MS; const dd = new Date(a); const f = h => h.t >= a && h.t < a + DIA_MS;
    return { rotulo: dd.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' }), curto: i === 6 ? 'hoje' : dd.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''), meu: soma(prop, f) }; });
  const semana = d7.reduce((t, d) => t + d.meu.aceitos, 0);
  const linha = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  const recarga = `${new Date(proxG).toDateString() === new Date().toDateString() ? 'hoje' : 'amanhã'} às ${horaCurta(proxG)}, daqui a ${plural(Math.max(1, Math.round((proxG - agora) / HORA_MS)), 'hora', 'horas')}`;
  box.innerHTML = `<section class="panel" style="border-top:0;margin-top:0"><h2>Seu uso da IA</h2><div class="cotas" style="grid-template-columns:1fr">
    <details class="cota" ${tem ? 'open' : ''}><summary>${anelCota(tem ? pct : null, esgot ? '0%' : tem && pct != null ? pct + '%' : fmtNum(hojeP.aceitos), esgot ? 'esgotada' : '')}
      <span><b>${tem ? 'Sua chave do Gemini' : 'Você ainda não colocou uma chave própria'}</b><small>${!tem ? 'Coloque a sua chave abaixo para ajudar a turma e acompanhar a sua cota aqui.' : esgot ? 'Cota de hoje esgotada; volta ' + recarga : pct == null ? 'pedidos hoje com a sua chave' : 'da cota de hoje ainda livre'}</small></span></summary>
      <dl>${linha('Hoje com a sua chave', `${fmtNum(hojeP.aceitos)} pedidos${hojeP.recusados ? `, ${fmtNum(hojeP.recusados)} recusados` : ''}`)}
        ${linha('Limite de um dia', lim ? `cerca de ${fmtNum(lim)} pedidos (aprendido no dia em que a sua cota acabou)` : 'o Google não informa; aparece aqui no primeiro dia em que a sua cota acabar')}
        ${linha('Recarrega', recarga + ' (meia-noite na Califórnia)')}
        ${linha('Últimos 7 dias', `${fmtNum(semana)} pedidos com a sua chave`)}
        ${linha('Com a cota da turma', `${fmtNum(turmaHoje)} pedidos hoje (pastas, versões e testes feitos sem a sua chave)`)}</dl>
      ${tem ? `<p class="notice" style="margin:4px 0 2px">Pedidos por dia com a sua chave (vermelho: recusados por limite):</p>${barras7(d7, 'meu')}` : ''}
    </details></div></section>`;
}

const Notas = {
  timers: new Map(), avisou: false,
  async montar(view, mid, aba) {
    if (!App.store?.notasDe) return;
    const camada = document.createElement('div'); camada.className = 'notas-camada'; view.appendChild(camada);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn nota-nova'; btn.textContent = '+ Anotação';
    btn.title = 'Anotação pessoal: só você vê'; btn.onclick = () => this.criar(camada, mid, aba); view.appendChild(btn);
    let notas = []; try { notas = await App.store.notasDe(mid, aba); } catch (e) { console.warn(e); }
    if (camada.isConnected) notas.forEach(n => this.desenhar(camada, n));
  },
  criar(camada, mid, aba) {
    const topo = camada.getBoundingClientRect().top;
    const n = { id: uuid(), materia_id: mid, aba, x: 0.08, y: Math.max(0, Math.round(window.innerHeight * 0.25 - topo)), largura: 230, texto: '', cor_fundo: '#FFF1A8', cor_texto: '#2A2A2A' };
    this.desenhar(camada, n).querySelector('textarea').focus(); this.salvar(n);
  },
  desenhar(camada, n) {
    const el = document.createElement('div'); el.className = 'nota';
    const pos = () => { el.style.left = (n.x * 100).toFixed(2) + '%'; el.style.top = n.y + 'px'; el.style.width = (n.largura || 230) + 'px'; el.style.background = n.cor_fundo; el.style.color = n.cor_texto; };
    el.innerHTML = `<div class="barra" title="Arraste para mover"><span class="pega" aria-hidden="true">⠿</span>
      <label title="Cor do quadro"><span class="sr-only">Cor do quadro</span><input type="color" data-k="cor_fundo" value="${esc(n.cor_fundo || '#FFF1A8')}"></label>
      <label title="Cor da letra"><span class="sr-only">Cor da letra</span><input type="color" data-k="cor_texto" value="${esc(n.cor_texto || '#2A2A2A')}"></label>
      <span class="spacer"></span><button type="button" class="x" aria-label="Apagar anotação" title="Apagar anotação">×</button></div>
      <textarea aria-label="Anotação pessoal" placeholder="Sua anotação. Só você vê."></textarea>`;
    const ta = el.querySelector('textarea'); ta.value = n.texto || '';
    pos(); camada.appendChild(el);
    ta.addEventListener('input', () => { n.texto = ta.value; this.salvarDepois(n); });
    el.querySelectorAll('input[type=color]').forEach(i => i.addEventListener('input', () => { n[i.dataset.k] = i.value; pos(); this.salvarDepois(n); }));
    el.querySelector('.x').onclick = async () => {
      if (n.texto && !confirm('Apagar esta anotação?')) return;
      el.remove(); clearTimeout(this.timers.get(n.id));
      try { await App.store.apagarNota(n.id); } catch (e) { toast(e.message); }
    };
    const barra = el.querySelector('.barra');
    barra.addEventListener('pointerdown', ev => {
      if (ev.target.closest('input,button,label')) return;
      ev.preventDefault(); barra.setPointerCapture(ev.pointerId);
      const W = camada.getBoundingClientRect().width || 1; const sx = ev.clientX, sy = ev.clientY, x0 = n.x * W, y0 = n.y;
      const maxX = Math.max(0, (W - el.offsetWidth) / W);
      const mover = e2 => { n.x = Math.min(Math.max(0, (x0 + e2.clientX - sx) / W), maxX); n.y = Math.max(0, Math.round(y0 + e2.clientY - sy)); pos(); };
      const soltar = () => { barra.removeEventListener('pointermove', mover); barra.removeEventListener('pointerup', soltar); barra.removeEventListener('pointercancel', soltar); this.salvar(n); };
      barra.addEventListener('pointermove', mover); barra.addEventListener('pointerup', soltar); barra.addEventListener('pointercancel', soltar);
    });
    if (window.ResizeObserver) new ResizeObserver(() => { const w = Math.round(el.offsetWidth); if (w && Math.abs(w - (n.largura || 0)) > 4) { n.largura = w; this.salvarDepois(n); } }).observe(el);
    return el;
  },
  salvarDepois(n) { clearTimeout(this.timers.get(n.id)); this.timers.set(n.id, setTimeout(() => this.salvar(n), 700)); },
  async salvar(n) {
    try { await App.store.salvarNota({ id: n.id, materia_id: n.materia_id, aba: n.aba, x: n.x, y: n.y, largura: n.largura, texto: n.texto, cor_fundo: n.cor_fundo, cor_texto: n.cor_texto }); }
    catch (e) { console.warn(e); if (!this.avisou) { this.avisou = true; toast('Não consegui salvar a anotação agora: ' + e.message); } }
  },
};

async function onPastaSubmit(form) {
  const fd = new FormData(form); let nome = (fd.get('nome') || '').trim(); const pedido = (fd.get('pedido') || '').trim();

/* A IA lê o pedido livre do aluno ("o que vai cair na prova") e escolhe os temas publicados que cobrem cada assunto,
   com palavras para achar o trecho exato; a busca do app acha os trechos. */
async function montarPastaComIA(pedido, aviso = () => {}) {
  aviso('A IA está lendo o seu pedido…');
  const [mats, prontos] = await Promise.all([materiasCache(), App.store.temasProntos()]);
  const lista = mats.filter(m => prontos.has(m.id)).sort((a, b) => cmpNatural(a.periodo + a.disciplina + a.materia, b.periodo + b.disciplina + b.materia));
  if (!lista.length) throw new Error('Ainda não há temas publicados no acervo para montar a pasta.');
  const r = await IA.chamar(`Um estudante de Medicina vai fazer uma prova. Abaixo está o que ele disse que vai cair (pode ser a ementa, uma lista de assuntos ou um texto livre) e a lista de temas do acervo da turma.

Para cada assunto que ele citou:
- escolha o tema ou os temas do acervo que cobrem esse assunto, pelo número "i" (prefira os mais específicos; no máximo 3 por assunto);
- em "busca", dê 1 a 3 palavras que certamente aparecem no texto do material sobre esse assunto, para achar o trecho exato (ex.: "lítio", "M-CHAT", "síndrome neuroléptica maligna");
- se nenhum tema do acervo cobrir o assunto, coloque o assunto em "faltando".
Não invente temas nem números. Sugira também um nome curto para a pasta.

Responda somente com JSON: {"nome":"...","assuntos":[{"assunto":"...","temas":[0,3],"busca":"..."}],"faltando":["..."]}

PEDIDO DO ESTUDANTE
${pedido.slice(0, 6000)}

TEMAS DO ACERVO (i | especialidade › área › tema)
${lista.map((m, i) => `${i} | ${m.periodo} › ${m.disciplina} › ${m.materia}`).join('\n').slice(0, 60000)}`, { maxTokens: 6000, tarefa: 'curta' });
  const itens = []; const vistos = new Set();
  const add = it => { const k = it.tipo + ':' + it.id; if (!vistos.has(k)) { vistos.add(k); itens.push(it); } };
  const assuntos = (r.assuntos || []).filter(a => a && Array.isArray(a.temas)).slice(0, 30);
  for (let k = 0; k < assuntos.length; k++) {
    const a = assuntos[k];
    const temas = a.temas.map(Number).filter(i => Number.isInteger(i) && lista[i]).slice(0, 3).map(i => lista[i]);
    temas.forEach(m => add({ tipo: 'tema', id: m.id, materia_id: m.id, titulo: m.materia }));
    const busca = String(a.busca || '').trim();
    if (busca && temas.length) {
      aviso(`Procurando os trechos (${k + 1} de ${assuntos.length}): ${a.assunto || busca}`);
      const ids = new Set(temas.map(m => m.id));
      const hits = (await App.store.search(busca).catch(() => [])).filter(h => ids.has(h.materia_id)).slice(0, 2);
      hits.forEach(h => add({ tipo: 'trecho', id: h.id, materia_id: h.materia_id,
        titulo: `${String(a.assunto || busca).slice(0, 60)}: ${limparLinha(h.titulo || '') || limparRuido(h.snippet || '').slice(0, 60)} (${temas.find(m => m.id === h.materia_id)?.materia || ''}, p. ${h.n})` }));
    }
  }
  const faltando = (r.faltando || []).map(String).filter(Boolean).slice(0, 40);
  faltando.forEach(f => add({ tipo: 'faltando', id: norm(f).slice(0, 80), titulo: f.slice(0, 140) }));
  return { itens, faltando: faltando.length, nome: String(r.nome || '').slice(0, 80) };
}

/* ============================ Fila da IA ============================
   Temas com material que ainda não têm a versão oficial (ou que receberam material novo). Um tema só entra
   na fila quando nada dele está carregando (transcrições), para ser publicado completo. */
async function temasParaIA() {
  const [mats, st, docsT, prep] = await Promise.all([materiasCache(true).catch(() => []), App.store.statusIA(), App.store.docsTodos(), App.store.preparo().catch(() => new Map())]);
  const porTema = groupBy(docsT, d => d.materia_id);
  return mats.filter(m => (porTema.get(m.id) || []).length).map(m => {
    const r = st.get(m.id); const ds = porTema.get(m.id);
    return { m, pronto: iaPronto(r), novos: docsSemIA(r, ds), semQuestoes: iaPronto(r) && Number(r.qversao || 0) < QVERSAO, comecou: !!r?.rascunho, ndocs: ds.length, carregando: prep.get(m.id)?.pend || 0,
      ocupado: temaOcupado(r) };
  }).filter(x => !x.pronto || x.novos.length || x.semQuestoes);
}
/* Com o administrador com o app aberto, a fila anda sozinha: a cada 10 minutos organiza e publica o próximo tema */
const FilaIA = {
  ativo: false, pausaAte: 0,
  iniciar() { if (this.ativo || ROBO) return; this.ativo = true; setTimeout(() => this.rodar(), 90000); setInterval(() => this.rodar(), 10 * 60000); },
  async rodar() {
    const ajuda = Chaves.ajudando();   // aluno com chave própria: ajuda usando só a cota dele
    if (!(App.store?.ehAdmin?.() || ajuda) || !IA.disponivel() || App.processing || IA_RODANDO.size || Date.now() < this.pausaAte) return;
    IA.modoAjuda = ajuda;
    try {
      for (const x of (await temasParaIA()).filter(x => !x.carregando && !x.ocupado)) {
        if (App.processing || (ajuda && !Chaves.ajudando())) return;
        try { await melhorarComIA(x.m.id); } catch (e) { if (e.ocupado) continue; throw e; }
        if (ajuda) Chaves.contar('gemini_temas');
        toast(ajuda ? `Sua chave ajudou a publicar: ${x.m.materia}` : `Publicado para a turma: ${x.m.materia}`); App.matsCache = null;
      }
    } catch (e) { console.warn(e); if (e.cota || e.chavePropria) this.pausaAte = Date.now() + 3600000; }
    finally { IA.modoAjuda = false; }
  },
};

/* Robô da IA: o GitHub abre o app num navegador sem tela (endereço com ?robo=1), entra com a conta do robô e
   organiza a fila sozinho, de dia e de noite, sem ninguém com o app aberto. Usa o mesmo código do botão
   "Organizar ... temas agora", então o resultado é o mesmo. */
const RoboIA = {
  estado: { rodando: false, feitos: [], erros: [], fim: null, msg: '' },
  async entrar(email, senha) {
    const { error } = await App.store.sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('O robô não conseguiu entrar: ' + error.message);
    App.store.session = (await App.store.sb.auth.getSession()).data.session; App.store._membro = undefined; App.store._admin = undefined;
    if (!(await App.store.membro())) throw new Error('A conta do robô não está na lista da turma (membros).');
    return true;
  },
  /* Quando a IA pede calma ("limite atingido"), quase sempre é o limite por minuto: o robô faz uma pausa de 10 minutos
     e continua. Só encerra a rodada depois de 4 pausas seguidas sem nenhum pedido aceito (aí é a cota do dia; a próxima
     rodada, de hora em hora, tenta de novo). O que já ficou pronto em cada tema fica salvo e não é refeito. */
  async rodar(minutos = 300, simultaneos = 2) {
    const st = this.estado; Object.assign(st, { rodando: true, fim: null }); const ate = Date.now() + minutos * 60000;
    const log = m => { st.msg = m; console.log('[robo] ' + m); };
    const tentados = new Set(); let pausas = 0, fim = null;
    try {
      while (Date.now() < ate) {
        const fila = (await temasParaIA()).filter(x => !x.carregando && !x.ocupado && !tentados.has(x.m.id));
        if (!fila.length) { fim = 'fila vazia'; break; }
        log(`${plural(fila.length, 'tema', 'temas')} na fila`);
        let semCota = false; const aceitosAntes = IA.aceitos;
        await emParalelo(fila, simultaneos, async x => {
          if (semCota || Date.now() > ate) return;
          tentados.add(x.m.id);
          try { await melhorarComIA(x.m.id, m => log(`${x.m.materia}: ${m}`)); st.feitos.push(x.m.materia); log(`Publicado para a turma: ${x.m.materia}`); }
          catch (e) {
            if (e.ocupado) return log(e.message);
            if (e.cota) { semCota = true; tentados.delete(x.m.id); return log(`${x.m.materia}: a IA pediu calma; o que já ficou pronto está salvo.`); }
            st.erros.push(`${x.m.materia}: ${e.message}`); log(`Erro em ${x.m.materia}: ${e.message}`);
          }
        });
        if (!semCota) continue;
        pausas = IA.aceitos > aceitosAntes ? 1 : pausas + 1;
        if (pausas > 4 || Date.now() + 10 * 60000 > ate) { fim = 'cota'; log('A cota gratuita do dia parece ter acabado. A próxima rodada continua de onde parou.'); break; }
        log(`Pausa de 10 minutos para a cota da IA respirar (pausa ${pausas} de 4).`);
        await esperar(10 * 60000);
        for (const r of Object.values(IA.ritmo)) r.intervalo = Math.max(r.min, r.intervalo * 0.7);
      }
    } finally { st.rodando = false; st.fim = fim || (Date.now() >= ate ? 'tempo' : 'fila vazia'); }
    return st;
  },
};

/* ============================ Painel de cotas das IAs (Administração) ============================
   Cada pedido à IA fica anotado no servidor (tabela uso_ia). Aqui o administrador vê, para cada IA, quanto já usou
   hoje, quanto resta, quando recarrega, o uso dos últimos 7 dias e a previsão de quando a fila inteira fica pronta.

  const off = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(t / 1000) * 1000;
  return Date.UTC(+p.year, +p.month - 1, +p.day) - off;
}
const horaCurta = t => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtNum = n => Number(n || 0).toLocaleString('pt-BR');

  const r = 26, c = 2 * Math.PI * r, v = pct == null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = estado === 'esgotada' ? 'var(--alert)' : 'var(--accent)';
  return `<svg class="anel" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
    ${pct == null ? '' : `<circle cx="32" cy="32" r="${r}" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 32 32)"/>`}
    <text x="32" y="36" text-anchor="middle" class="anel-txt">${esc(rotulo)}</text></svg>`;
}
// Barras dos últimos 7 dias (uma IA por gráfico; passar o mouse mostra os números do dia)
function barras7(dias, chave) {
  const max = Math.max(1, ...dias.map(d => d[chave].aceitos + d[chave].recusados));
  const W = 7 * 34, H = 70;
  return `<svg class="barras7" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Pedidos por dia nos últimos 7 dias">${dias.map((d, i) => {
    const x = d[chave]; const h = Math.round(x.aceitos / max * H); const hr = Math.round(x.recusados / max * H);
    return `<g><title>${d.rotulo}: ${x.aceitos} aceitos, ${x.recusados} recusados, ${fmtTok(x.tin + x.tout)} tokens</title>
      <rect x="${i * 34 + 6}" y="0" width="22" height="${H}" fill="transparent"/>
      ${x.aceitos ? `<rect x="${i * 34 + 6}" y="${H - h}" width="22" height="${h}" rx="3" fill="var(--accent)"/>` : ''}
      ${x.recusados ? `<rect x="${i * 34 + 6}" y="${Math.max(0, H - h - hr - 2)}" width="22" height="${Math.max(2, hr)}" rx="2" fill="var(--alert)" opacity=".75"/>` : ''}
      <text x="${i * 34 + 17}" y="${H + 13}" text-anchor="middle" class="barras-dia">${esc(d.curto)}</text></g>`;
  }).join('')}</svg>`;
}
/* Administração: a chave própria de cada aluno está funcionando? (pedidos de hoje, último pedido e o modelo que ela usou) */

  const iniG = inicioDiaPT(agora), proxG = iniG + DIA_MS;
  const gem = H.filter(h => h.provedor === 'gemini' && h.origem !== 'chave-propria');   // só a chave da turma

  const limG = Math.max(0, ...diasG.filter(x => x.acabou).map(x => x.aceitos), gEsgotada ? gHoje.aceitos : 0) || null;
  const pctG = gEsgotada ? 0 : limG ? Math.max(0, Math.round((1 - gHoje.aceitos / limG) * 100)) : null;
  // Groq: limite informado pelo próprio Groq (pedidos por dia, do modelo usado por último)
  const groq = H.filter(h => h.provedor === 'groq');
  const qHoje = soma(groq, h => h.t >= agora - DIA_MS);
  const snap = d.groq && agora - Date.parse(d.groq.em) < DIA_MS ? d.groq : null;
  const pctQ = snap ? Math.round(snap.groq_restante / snap.groq_limite * 100) : null;
  const qEsgotada = snap ? snap.groq_restante <= 0 : false;
  // últimos 7 dias (dia daqui do Brasil)
  const dias = [...Array(7)].map((_, i) => {
    const a = hoje0.getTime() - (6 - i) * DIA_MS; const dd = new Date(a);
    return { rotulo: dd.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' }), curto: i === 6 ? 'hoje' : dd.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''),
      gemini: soma(gem, h => h.t >= a && h.t < a + DIA_MS), groq: soma(groq, h => h.t >= a && h.t < a + DIA_MS) };

  const prontos = [...st.values()].filter(r => r.versao === 4);
  const pub3 = prontos.filter(r => Date.parse(r.geradoEm || 0) >= agora - 3 * DIA_MS).length;
  const total = prontos.length + fila.length; const pctFila = total ? Math.round(prontos.length / total * 100) : 100;

  const janela = Math.max(6 * HORA_MS, Math.min(3 * DIA_MS, agora - primeiro));
  const ritmo = pub3 / (janela / DIA_MS);
  const janelaTxt = janela >= 2.5 * DIA_MS ? 'dos últimos 3 dias' : janela >= DIA_MS * 1.2 ? `dos últimos ${Math.round(janela / DIA_MS)} dias` : `das últimas ${Math.round(janela / HORA_MS)} horas`;

    : `Parado desde ${quandoCurto(new Date(ultRobo).toISOString())}${new Date(ultRobo).toDateString() === new Date().toDateString() ? '' : ' às ' + horaCurta(ultRobo)}. Ele confere a fila de hora em hora.`;
  const linha = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
  box.innerHTML = `<div class="cotas">
    <details class="cota"><summary>${anelCota(pctG, gEsgotada ? '0%' : pctG == null ? fmtNum(gHoje.aceitos) : pctG + '%', gEsgotada ? 'esgotada' : '')}

        <span><b>Groq</b><small>${qEsgotada ? 'Cota esgotada por agora' : pctQ == null ? 'pedidos nas últimas 24 h' : 'da cota restante'}</small></span></summary>
      <dl>${linha('Pedidos nas últimas 24 h', `${fmtNum(qHoje.aceitos)} aceitos${qHoje.recusados ? `, ${fmtNum(qHoje.recusados)} recusados` : ''}`)}

        ${linha('Últimos 7 dias', `${fmtNum(semana('groq'))} pedidos, média de ${fmtNum(Math.round(semana('groq') / 7))} por dia`)}</dl>
      <p class="notice" style="margin:4px 0 2px">Faz as questões e as tarefas curtas. A transcrição das aulas usa outra cota do Groq, que não entra aqui. Pedidos por dia:</p>${barras7(dias, 'groq')}

        ${linha('Previsão', previsao)}
        ${capTemas ? linha('No máximo da cota', `cerca de ${plural(capTemas, 'tema', 'temas')} por dia com a cota do Gemini`) : ''}
        ${linha('Robô da IA', robo)}</dl>
    </details>
  </div>
  <div id="chavesAlunos"></div>`;
  montarChavesAlunos(iniG, proxG).catch(e => console.warn(e));
}

/* Mudar um tema de lugar (coleção da Faculdade, Drive ou Residência). Se já existe um tema igual no destino, junta os arquivos nele. */
async function moverTema(m, destino) {
  const st = App.store;
  try { await st.atualizarMateria(m.id, destino); App.matsCache = null; return m.id; }
  catch (e) {
    if (!e.duplicado) throw e;
    const alvo = (await materiasCache(true)).find(x => x.id !== m.id && x.periodo === m.periodo && x.disciplina === m.disciplina && x.materia === m.materia && chaveEscopo(x) === chaveEscopo(destino));
    const pend = (await st.midiasDoTema(m.id).catch(() => [])).filter(x => x.status === 'fila' || x.status === 'processando');
    if (!alvo) throw new Error('Já existe um tema com esse nome no destino, mas não consegui encontrá-lo.');
    if (pend.length) throw new Error('Este tema tem áudio ou vídeo ainda na transcrição. Tente de novo depois que terminar.');
    await st.moverConteudo(m.id, alvo.id); await st.deleteMateria(m.id);   // o tema de destino recebe os arquivos como material novo e a IA o atualiza App.matsCache = null;
    return alvo.id;
  }
}
/* Separa um arquivo em partes, uma por área (cada parte vira um arquivo no tema da sua área, no mesmo acervo).
   A parte da área do tema atual fica nele. Devolve os temas que receberam partes, ou null se não há o que separar. */
/* Análise mais profunda (quando quem envia avisa que o arquivo tem várias áreas, ou no botão "Separar por área"):
   se os títulos não deixam claro, a IA lê o começo de cada página e diz onde cada área da lista começa. */
async function dividirComIA(paginas, espNome) {
  // todas as especialidades: um caderno completo pode juntar várias (Oncologia, Psiquiatria, Urologia...)
  const opcoes = TAXONOMIA.flatMap(e => [...e.areas, { esp: e.nome, area: 'Geral' }]);
  const ps = paginas.slice(0, 1200);
  const r = await IA.chamar(`Um arquivo de estudo de Medicina pode juntar várias áreas da lista oficial da turma. Abaixo está o começo de cada página (número | título e primeiras linhas). Diga em que página começa cada área.
- Use só as áreas da lista, pelo número. Se um trecho é de uma especialidade mas não de uma área específica dela, use a opção "Geral" dela.
- Uma parte nova só começa quando o conteúdo realmente passa para outra área, não por um assunto citado de passagem.
- Capa, sumário e páginas soltas ficam junto da área seguinte.
- Se o arquivo inteiro é de uma área só, responda uma parte só.

ÁREAS
${opcoes.map((a, i) => `${i} | ${a.esp} › ${a.area}`).join('\n')}

PÁGINAS
${ps.map((p, i) => `${i + 1} | ${cabecalhoDaPagina(p).replace(/\s+/g, ' ').slice(0, ps.length > 500 ? 70 : 110)}`).join('\n')}

Responda somente com JSON: {"partes":[{"pagina":1,"area":3}]}`, { maxTokens: 4000, tarefa: 'curta' });
  const ini = (r.partes || []).map(x => ({ de: Number(x.pagina), a: opcoes[Number(x.area)] }))
    .filter(x => Number.isInteger(x.de) && x.de >= 1 && x.de <= ps.length && x.a).sort((a, b) => a.de - b.de);
  if (!ini.length) return null;
  ini[0].de = 1;
  const out = [];
  ini.forEach((x, k) => {
    const ate = k + 1 < ini.length ? ini[k + 1].de - 1 : paginas.length; if (ate < x.de) return;
    const ids = paginas.slice(x.de - 1, ate).map(p => p.id); const ult = out.at(-1);
    if (ult && ult.a === x.a) ult.ids.push(...ids); else out.push({ a: x.a, ids });
  });
  return out.length >= 2 ? out.map(x => ({ esp: x.a.esp, area: x.a.area, ids: x.ids })) : null;
}
async function analisarDivisao(paginas, espNome, profunda) {
  const d = dividirPorArea(paginas, espNome);

async function separarDocumento(doc, paginas, mat, opts = {}) {
  if (/transcri|áudio|vídeo/i.test(doc.tipo || '')) return null;
  const div = opts.div || await analisarDivisao(paginas, mat.periodo, opts.profunda); if (!div) return null;
  const st = App.store; const escopo = { acervo: acervoDe(mat), colecao: colecaoDe(mat) };
  const fica = x => x.esp === mat.periodo && x.area === mat.disciplina;
  // só o administrador apaga temas: para os outros, separa só se uma das partes fica no tema atual
  const admin = await st.admin?.();
  if (!div.some(fica) && !admin) return null;
  const partes = []; const temas = [];
  for (const ps of groupBy(div, x => x.esp + '|' + x.area).values()) {
    const { esp, area } = ps[0];
    const alvo = fica(ps[0]) ? mat : await st.ensureMateria(esp, area, area === 'Geral' ? esp : area, escopo);
    partes.push({ materia_id: alvo.id, nome: `${doc.nome} (${area})`, pageIds: ps.flatMap(x => x.ids) });
    if (!temas.some(t => t.id === alvo.id)) temas.push(alvo);
  }
  await st.dividirDocumento(doc, partes);
  // o tema de onde o arquivo saiu, se ficou sem nenhum arquivo, é apagado (o conteúdo agora está nos temas novos)
  if (admin && !temas.some(t => t.id === mat.id) && !(await st.contarDocsTema(mat.id)) && !(await st.midiasDoTema(mat.id).catch(() => [])).length) {
    await st.deleteMateria(mat.id); temas.apagado = true;
  }
  App.matsCache = null;
  return temas;
}

/* ============================ Reorganizar a biblioteca pela lista oficial ============================ */
async function propostasDeReorganizacao() {
  const mats = await materiasCache(true);
  const out = [];
  for (const m of mats) {
    const c = classificarPelaLista([m.periodo, m.disciplina, m.materia], '');
    if (!c.confiante || !c.esp) continue;
    const area = c.area || m.disciplina;
    if (c.esp === m.periodo && area === m.disciplina) continue;
    out.push({ m, periodo: c.esp, disciplina: area });
  }
  return out;
}
async function aplicarReorganizacao(props, aviso = () => {}) {
  const st = App.store; let mudados = 0, juntados = 0; const pulados = [];
  for (let i = 0; i < props.length; i++) {
    const { m, periodo, disciplina } = props[i]; aviso(`Tema ${i + 1} de ${props.length}: ${m.materia}`);
    try { await st.atualizarMateria(m.id, { periodo, disciplina }); mudados++; }
    catch (e) {
      if (!e.duplicado) { pulados.push(`${m.materia}: ${e.message}`); continue; }
      // já existe um tema igual no lugar novo: junta os arquivos nele (a IA reorganiza o tema junto depois)
      const alvo = (await materiasCache(true)).find(x => x.periodo === periodo && x.disciplina === disciplina && x.materia === m.materia && chaveEscopo(x) === chaveEscopo(m) && x.id !== m.id);
      const pend = (await st.midiasDoTema(m.id).catch(() => [])).filter(x => x.status === 'fila' || x.status === 'processando');
      if (!alvo || pend.length) { pulados.push(`${m.materia}: ${pend.length ? 'tem transcrição em andamento' : 'não achei o tema de destino'}`); continue; }
      await st.moverConteudo(m.id, alvo.id); await st.deleteMateria(m.id); juntados++;
    }
  }
  App.matsCache = null;
  return { mudados, juntados, pulados };
}

document.addEventListener('click', async e => {
  const volta = e.target.closest('a[data-volta]'); if (volta) marcarVolta();
  const img = e.target.closest('.apostila img, .fig img, .pg-orig img, .q-figs img, .foto img, .reading img');
  if (img && img.src) { zoom(img.src, img.alt); return; }
  if (e.target.closest('#voltarBtn')) {
    const v = lerVolta(); sessionStorage.removeItem('voltar');
    if (v) { App.restaurarY = v.y; go(v.hash); } return;
  }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const id = el.dataset.id; const st = App.store;
  try {
    switch (a) {
      case 'reload': render(); break;
      case 'mod-ver': el.classList.toggle('ver'); break;
      case 'mod-liberar': case 'mod-remover': {
        if (a === 'mod-remover' && !confirm('Remover esta imagem do acervo? Ela some de todos os temas onde aparece.')) return;
        el.disabled = true; await st.moderacaoDecidir(el.dataset.ref, a === 'mod-liberar' ? 'liberada' : 'removida');
        toast(a === 'mod-liberar' ? 'Imagem liberada' : 'Imagem removida'); render(); break;
      }
      case 'versao-ver': e.preventDefault(); App.versaoSel[el.dataset.mid] = id || ''; toast(id ? 'Mostrando a versão escolhida' : 'Mostrando a versão oficial'); go(`#/m/${el.dataset.mid}/conteudo`); break;
      case 'versao-oficial':
        if (!confirm('Tornar esta versão a oficial? A turma inteira passa a ver o que ela mudou.')) return;
        el.disabled = true; await promoverVersao(el.dataset.mid, id); App.versaoSel[el.dataset.mid] = ''; toast('Agora esta é a versão oficial'); render(); break;
      case 'versao-apagar':
        if (!confirm('Apagar esta versão?')) return;
        el.disabled = true; await st.apagarVersao(id); if (App.versaoSel[el.dataset.mid] === id) App.versaoSel[el.dataset.mid] = ''; toast('Versão apagada'); render(); break;
      case 'pasta-add': await abrirAdicionarPasta({ tipo: el.dataset.tipo, id, materia_id: el.dataset.mid, titulo: el.dataset.titulo }); break;
      case 'pasta-item-del': {
        const p = (await st.listarPastas()).find(x => x.id === el.dataset.pasta); if (!p) return;
        await st.salvarPasta({ ...p, itens: (p.itens || []).filter(i => !(i.tipo === el.dataset.tipo && i.id === id)) }); render(); break;
      }
      case 'pasta-del': if (!confirm('Apagar esta pasta? Os temas continuam na biblioteca.')) return; await st.apagarPasta(id); toast('Pasta apagada'); go('#/pastas'); break;
      case 'ia-testar': {
        el.disabled = true;
        const stt = $('#iaFilaStatus'); if (stt) stt.textContent = 'Testando as IAs...';
        try {
          const nomes = { gemini: 'Gemini (apostila, resumo e flashcards)', groq: 'Groq (questões e tarefas curtas)' };
          const res = await Promise.all(Object.keys(nomes).map(pv => IA.chamar('Responda somente com a palavra OK.', { formato: 'texto', maxTokens: 50, provedor: pv })
            .then(() => `${nomes[pv]}: funcionando ✓`)
            .catch(e => `${nomes[pv]}: ${e.semChave ? (pv === 'gemini' ? 'falta a chave' : 'falta a chave (GROQ_API_KEY); o Gemini faz no lugar') : e.cota ? 'sem cota agora (volta sozinha)' : 'erro (' + e.message + ')'}`)));
          if (stt) stt.innerHTML = res.map(esc).join('<br>');
        } finally { el.disabled = false; }
        break;
      }
      case 'ia-fila': {
        const ids = App.iaFila || []; el.disabled = true; const stt = () => $('#iaFilaStatus');
        for (let i = 0; i < ids.length; i++) {
          try { await melhorarComIA(ids[i], m => { if (stt()) stt().textContent = `Tema ${i + 1} de ${ids.length}: ${m.replace(/^IA: /, '')}`; }); }
          catch (e2) { console.warn(e2); toast(e2.message); if (e2.cota) break; }
        }
        App.matsCache = null; render(); break;
      }
      case 'reorg-ver': {
        el.disabled = true; App.reorg = await propostasDeReorganizacao(); el.disabled = false;
        const box = $('#reorgLista');
        box.innerHTML = App.reorg.length ? `${tabela(['Tema', 'Hoje', 'Vai para'], App.reorg.map(x => `<tr><td>${esc(x.m.materia)}</td><td>${esc(x.m.periodo)} › ${esc(x.m.disciplina)}</td><td><strong>${esc(x.periodo)} › ${esc(x.disciplina)}</strong></td></tr>`))}
          <button class="btn primary" data-action="reorg-aplicar">Mudar ${plural(App.reorg.length, 'tema', 'temas')} de lugar</button>` : '<p class="notice">Todos os temas já estão de acordo com a lista oficial.</p>';
        break;

      case 'ia-tema': {

        openForm({ title: `Separar “${doc.nome}”`, submit: `Separar em ${div.length} partes`,
          body: `<p class="notice" style="margin-top:0">Encontrei ${plural(div.length, 'área', 'áreas')} neste arquivo. Cada parte vai para o tema da sua área, em ${esc(ondeTema(mat))}:</p>
            <ul>${div.map(x => `<li><strong>${esc(x.esp)} › ${esc(x.area)}</strong> <span class="meta">(${faixa(x)})</span>${x.esp === mat.periodo && x.area === mat.disciplina ? ' <span class="meta">— fica neste tema</span>' : ''}</li>`).join('')}</ul>
            <p class="notice">Os temas que receberem partes voltam para a fila da IA, para a apostila ser refeita.</p>`,
          onSubmit: async () => {
            const temas = await separarDocumento(doc, paginas, mat, { div });
            if (!temas) throw new Error('Nenhuma parte fica neste tema, então ele ficaria vazio: só o administrador pode separar este arquivo.');
            toast(`Arquivo separado em ${plural(temas.length, 'tema', 'temas')}`);
            goOrRender(temas.apagado ? `#/m/${temas[0].id}/original` : `#/m/${mat.id}/original`);
          } });
        break;
      }
      case 'del-doc':
        if (!confirm('Remover este arquivo do tema? O resumo, os flashcards e as questões automáticas serão refeitos.')) return;
        await st.deleteDocumento(id); await gerarConteudo(el.dataset.mid); App.matsCache = null;
        toast('Arquivo removido'); goOrRender(`#/m/${el.dataset.mid}/original`); break;
      case 'ir-ancora': e.preventDefault(); document.getElementById(id)?.scrollIntoView({ block: 'start' }); break;
      case 'ver-foto': {
        const box = el.nextElementSibling;
        if (box.innerHTML) { box.innerHTML = ''; el.textContent = 'Ver foto da página'; break; }
        el.textContent = 'Esconder foto da página';
        box.innerHTML = `<img class="pg-img" data-ref="${esc(el.dataset.ref)}" alt="Foto da página" style="margin-top:10px">`; hydrateImages(box); break;
      }
      case 'fcv-chip': { const g = FCV.f[el.dataset.g]; const v = el.dataset.v; g.has(v) ? g.delete(v) : g.add(v);
        if (el.dataset.g === 'esp' && !FCV.f.esp.size) { FCV.f.area.clear(); FCV.f.tema.clear(); }
        FCV.i = 0; FCV.virado = false; fcvRender(); break; }
      case 'fcv-limpar': Object.values(FCV.f).forEach(s => s.clear()); FCV.busca = ''; FCV.i = 0; FCV.virado = false; fcvRender(); break;
      case 'fcv-emb': FCV.ordem = shuffle(FCV.ordem); FCV.i = 0; FCV.virado = false; fcvRender(); toast('Cards embaralhados'); break;
      case 'fcv-lista': FCV.lista = !FCV.lista; fcvRender(); break;
      case 'fcv-virar': fcvVirar(); break;
      case 'fcv-ant': if (FCV.i > 0) { FCV.i--; FCV.virado = false; fcvRender(); } break;
      case 'fcv-prox': if (FCV.i < fcvFiltrados().length - 1) { FCV.i++; FCV.virado = false; fcvRender(); } break;
      case 'fcv-marca': await fcvMarcar(el.dataset.v); break;
      case 'mover-tema': await abrirMoverTema(id); break;
      case 'col-renomear': await renomearColecao(el.dataset.c); break;
      case 'le-esp-nova': case 'le-esp-renomear': case 'le-esp-del': case 'le-area-renomear': case 'le-area-del': case 'le-tema-del':
      case 'le-desfazer': case 'le-original': case 'le-salvar': await acaoListaEd(el.dataset.action, el); break;
      case 'chave-remover': if (!confirm('Remover a sua chave do Gemini deste aparelho?')) return; Chaves.remover(); toast('Chave removida'); render(); break;
      case 'rev-virar': REV.virado = !REV.virado; revRender(); break;
      case 'rev-nota': await revNota(el.dataset.v); break;
      case 'rev-denovo': Hoje.cache = null; render(); break;
      case 'erradas-refazer': Object.assign(QZ, { mid: el.dataset.mid, filtro: 'todas', sit: 'erradas', i: 0 }); go(`#/m/${el.dataset.mid}/questoes`); break;
      case 'ir-nota': { e.preventDefault(); const cam = $('.notas-camada'); if (cam) window.scrollTo({ top: cam.getBoundingClientRect().top + window.scrollY + Number(el.dataset.y || 0) - 90, behavior: 'smooth' }); break; }
      case 'fc-new': newFlashcard(el.dataset.mid); break;
      case 'fc-del': if (confirm('Apagar este flashcard?')) { await st.remove('flashcards', id); render(); } break;
      case 'q-filter': QZ.filtro = el.dataset.f; QZ.i = 0; renderQuestoes(CTX.body, CTX.mat, CTX.qs); break;
      case 'q-sit': QZ.sit = el.dataset.f; QZ.i = 0; renderQuestoes(CTX.body, CTX.mat, CTX.qs); break;
      case 'q-ans': await answerQuestao(el.dataset.l); break;
      case 'q-nav': QZ.i = Math.max(0, Math.min(CTX.listaQ.length - 1, QZ.i + Number(el.dataset.d))); await showQuestao(); $('#qBox').scrollIntoView({ block: 'nearest' }); break;
      case 'q-new': newQuestao(el.dataset.mid); break;
      case 'q-del': if (confirm('Apagar esta questão?')) { await st.remove('questoes', id); render(); } break;
      case 'report': openReport(el.dataset.alvo, id); break;
      case 'run-pending': if (App.pending) { runImport(App.pending); render(); } break;
      case 'prog-clear': Prog.state = null; render(); break;
      case 'logout': await st.signOut(); Progresso.mapa = null; render(); break;
      case 'login-google': await st.signInGoogle(); break;
      case 'copy-robo': await navigator.clipboard.writeText(await Drive.quem()); toast('E-mail copiado'); break;
      case 'apagar-progresso':
        if (!confirm('Apagar todo o seu histórico de questões e flashcards? Isso não pode ser desfeito.')) return;
        await Progresso.apagar(); toast('Progresso apagado'); break;
      case 'wipe':
        if (!confirm('Apagar todo o acervo guardado neste navegador?')) return;
        await st.wipe(); lsDel('demo_seeded_v3'); await st.progressoApagar(); location.reload(); break;
    }
  } catch (err) { console.error(err); toast(err.message); el.disabled = false; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'docPick') go(`#/m/${t.dataset.mid}/original/d:${t.value}`);
  if (t.id === 'versaoPick') { App.versaoSel[t.dataset.mid] = t.value; render(); }
  if (t.id === 'painelFiltro') go('#/painel' + (t.value ? '?f=' + encodeURIComponent(t.value) : ''));
  if (t.name === 'modo' && t.form?.id === 'driveForm') $('#driveDest').hidden = t.value !== 'unica';
  if (t.id === 'lauto') $('#localDest').hidden = t.checked;
});
document.addEventListener('toggle', e => { if (e.target.id === 'fcvFiltros') FCV.filtrosAbertos = e.target.open; }, true);
let buscaFcTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'fcvBusca') return;
  FCV.busca = e.target.value; clearTimeout(buscaFcTimer);
  buscaFcTimer = setTimeout(() => { FCV.i = 0; FCV.virado = false; const pos = e.target.selectionStart; fcvRender(); const n = $('#fcvBusca'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
});
document.addEventListener('keydown', e => {
  if (!$('#fcvCard') || FCV.lista || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || $('#dlg').open) return;
  if (e.key === ' ') { e.preventDefault(); fcvVirar(); }
  else if (e.key === 'ArrowRight') { if (FCV.i < fcvFiltrados().length - 1) { FCV.i++; FCV.virado = false; fcvRender(); } }
  else if (e.key === 'ArrowLeft') { if (FCV.i > 0) { FCV.i--; FCV.virado = false; fcvRender(); } }
  else if (e.key === '1') fcvMarcar('errei');
  else if (e.key === '2') fcvMarcar('quase');
  else if (e.key === '3') fcvMarcar('acertei');
});
document.addEventListener('keydown', e => {
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (e.key === '/' && !digitando && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#q')?.focus(); return; }
  if (!$('#revCard') || digitando || $('#dlg').open) return;
  if (e.key === ' ') { e.preventDefault(); REV.virado = !REV.virado; revRender(); }
  else if (REV.virado && ['1', '2', '3'].includes(e.key)) revNota({ 1: 'errei', 2: 'quase', 3: 'acertei' }[e.key]);
});
document.addEventListener('submit', async e => {
  const f = e.target;
  const handlers = {
    topSearch: f => { const q = f.elements.q.value.trim(); go('#/busca?q=' + encodeURIComponent(q)); },
    pageSearch: f => { const q = f.elements.q.value.trim(); goOrRender('#/busca?q=' + encodeURIComponent(q)); },
    driveForm: onDriveSubmit, localForm: onLocalSubmit, cfgForm: onCfgSubmit, loginForm: onLoginSubmit, codigoForm: onCodigoSubmit,
    versaoForm: onVersaoSubmit, pastaForm: onPastaSubmit, chaveForm: onChaveSubmit,
  };
  const h = handlers[f.id]; if (!h) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button])'); if (btn) btn.disabled = true;
  try { await h(f); }
  catch (err) {
    console.error(err); toast(err.message);
    if (f.id === 'driveForm' && $('#drivePlan')) $('#drivePlan').innerHTML = `<p class="notice" style="color:var(--alert)">${esc(err.message)}</p>`;
  } finally { if (btn && btn.isConnected) btn.disabled = false; }
});
window.addEventListener('hashchange', async () => {
  window.scrollTo(0, 0); await render();
  if (App.restaurarY != null) { const y = App.restaurarY; App.restaurarY = null; requestAnimationFrame(() => window.scrollTo(0, y)); }
});

async function seedDemo() {
  if (lsGet('demo_seeded_v3', false)) return;
  const st = App.store;
  if ((await st.listMateriasComContagem()).length) { lsSet('demo_seeded_v3', true); return; }
  for (const m of DEMO) {
    const mat = await st.ensureMateria(m.periodo, m.disciplina, m.materia);
    for (const d of m.docs) {
      const docId = uuid();
      const pages = d.paginas.map((p, i) => ({ id: uuid(), documento_id: docId, materia_id: mat.id, n: i + 1, titulo: p.titulo, texto: p.texto,
        texto_norm: norm(p.titulo + ' ' + p.texto), html: null, imagem: null, imagens: [], figuras: [], destaques: [] }));
      await st.addDocumento({ id: docId, materia_id: mat.id, nome: d.nome, tipo: 'Texto', drive_id: null, ordem: ++ordemSeq, criado_por: 'local', criado_em: nowIso() }, pages);
    }
    await gerarConteudo(mat.id);
  }
  lsSet('demo_seeded_v3', true);
}

async function boot() {
  try {
    if (cfg('SUPABASE_URL') && cfg('SUPABASE_ANON_KEY')) {
      App.store = new SupaStore(); await App.store.init();
      if (/access_token=|[?&]code=|error_description=/.test(location.href)) history.replaceState(null, '', location.pathname + '#/');
    } else {
      App.store = new LocalStore(); await App.store.init(); await seedDemo();
    }
  } catch (e) {
    console.error(e);
    App.store = new LocalStore();
    try { await App.store.init(); } catch (e2) { $('#view').innerHTML = `<div class="empty"><h1>Não foi possível iniciar</h1><p>${esc(e2.message)}</p></div>`; return; }
    toast('Não foi possível conectar ao servidor. Usando o modo local.');
  }
  render();
}
