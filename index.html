/* ============================ Flashcards: um por vez, com filtros e busca ============================ */
const FCV = { escopo: null, mid: null, cards: [], meta: new Map(), f: { esp: new Set(), area: new Set(), tema: new Set(), sub: new Set(), sit: new Set() },
  busca: '', ordem: [], i: 0, virado: false, lista: false, raiz: null, filtrosAbertos: null };
function fcvNovoEscopo(escopo, mid, cards, meta) {
  if (FCV.escopo !== escopo || FCV.mid !== mid) {
    Object.assign(FCV, { escopo, mid, busca: '', i: 0, virado: false, lista: false });
    FCV.f = { esp: new Set(), area: new Set(), tema: new Set(), sub: new Set(), sit: new Set() };
    FCV.ordem = cards.map(c => c.id);
  } else {
    const ids = new Set(cards.map(c => c.id));
    FCV.ordem = FCV.ordem.filter(id => ids.has(id)).concat(cards.filter(c => !FCV.ordem.includes(c.id)).map(c => c.id));
  }
  FCV.cards = cards; FCV.meta = meta;
}
function fcvFiltrados() {
  const porId = new Map(FCV.cards.map(c => [c.id, c])); const b = norm(FCV.busca).trim();
  return FCV.ordem.map(id => porId.get(id)).filter(c => {
    if (!c) return false;
    const m = FCV.meta.get(c.materia_id) || {};
    if (FCV.f.esp.size && !FCV.f.esp.has(m.periodo)) return false;
    if (FCV.f.area.size && !FCV.f.area.has(m.disciplina)) return false;
    if (FCV.f.tema.size && !FCV.f.tema.has(c.materia_id)) return false;
    if (FCV.f.sub.size && !FCV.f.sub.has(c.extras?.subtema || '')) return false;
    const est = Progresso.get('fc', c.id)?.estado;
    if (FCV.f.sit.has('rever') && est !== 'rever') return false;
    if (FCV.f.sit.has('novos') && est) return false;
    if (FCV.f.sit.has('turma') && c.origem === 'AUTO') return false;
    if (b && !norm(c.frente + ' ' + c.verso).includes(b)) return false;
    return true;
  });
}
function chipsHtml(grupo, opcoes, sel) {
  return `<div class="chips">${opcoes.map(o => `<button class="chip" data-action="fcv-chip" data-g="${grupo}" data-v="${esc(o.v)}" aria-pressed="${sel.has(o.v)}">${esc(o.l)}<span class="count">${o.n}</span></button>`).join('')}</div>`;
}
function fcvRender() {
  const raiz = FCV.raiz; if (!raiz || !raiz.isConnected) return;
  const lista = fcvFiltrados();
  if (FCV.i >= lista.length) FCV.i = Math.max(0, lista.length - 1);

  let filtros = '';

    const esp = conta(FCV.cards, c => FCV.meta.get(c.materia_id)?.periodo);
    const base1 = FCV.cards.filter(c => !FCV.f.esp.size || FCV.f.esp.has(FCV.meta.get(c.materia_id)?.periodo));
    const area = conta(base1, c => FCV.meta.get(c.materia_id)?.disciplina);
    const base2 = base1.filter(c => !FCV.f.area.size || FCV.f.area.has(FCV.meta.get(c.materia_id)?.disciplina));
    const tema = conta(base2, c => c.materia_id);
    filtros += `<div class="lbl">Especialidade</div>${chipsHtml('esp', [...esp].sort((a, b) => ordemGeralPorUltimo(a[0], b[0])).map(([v, n]) => ({ v, l: v, n })), FCV.f.esp)}`;
    if (FCV.f.esp.size) filtros += `<div class="lbl">Área</div>${chipsHtml('area', [...area].sort((a, b) => ordemGeralPorUltimo(a[0], b[0])).map(([v, n]) => ({ v, l: v, n })), FCV.f.area)}`;
    if (FCV.f.esp.size) filtros += `<div class="lbl">Tema</div>${chipsHtml('tema', [...tema].map(([v, n]) => ({ v, l: FCV.meta.get(v)?.materia || '?', n })).sort((a, b) => cmpNatural(a.l, b.l)), FCV.f.tema)}`;

/* ============================ Questões ============================ */
const QZ = { mid: null, filtro: 'todas', sit: 'todas', i: 0 };

function renderQuestoes(body, mat, qs, extra) {

  if (QZ.sit === 'erradas') lista = lista.filter(q => Progresso.get('q', q.id)?.acertou === false);
  if (QZ.sit === 'novas') lista = lista.filter(q => !Progresso.get('q', q.id));
  if (extra) { const k = lista.findIndex(q => q.id === extra); if (k < 0) { lista = qs; QZ.filtro = 'todas'; QZ.sit = 'todas'; } const k2 = lista.findIndex(q => q.id === extra); if (k2 >= 0) QZ.i = k2; }
  if (QZ.i >= lista.length) QZ.i = 0;
  CTX = { body, mat, qs, listaQ: lista, pages: CTX.mat?.id === mat.id ? CTX.pages : null };

    <div class="row"><div class="chips" style="margin:0">${[['todas', 'Todas'], ['novas', 'Não respondidas'], ['erradas', 'Só as que errei']].map(([k, l]) => `<button class="chip" data-action="q-sit" data-f="${k}" aria-pressed="${k === QZ.sit}">${l}</button>`).join('')}</div>

function linksDaQuestao(q) {

async function answerQuestao(letra) {
  const q = CTX.listaQ[QZ.i]; const btns = $$('#qBox .alt'); btns.forEach(b => { b.disabled = true; });
  const feed = $('#qFeed');
  if (q.gabarito) {
    const ok = letra === q.gabarito;
    btns.forEach(b => { if (b.dataset.l === q.gabarito) b.classList.add('right'); else if (b.dataset.l === letra) b.classList.add('wrong'); });
    const ex = q.extras || {};
    const selo = ex.gabarito_ia ? 'Gabarito sugerido pela IA, porque o material não trazia a resposta. Confira no conteúdo' : q.origem === 'PROVA' || q.origem === 'MATERIAL' ? 'Gabarito do material' : q.origem === 'IA' ? 'Questão criada pela IA a partir do material' : q.origem === 'LACUNA' ? 'Resposta tirada do próprio material' : 'Gabarito de quem criou a questão';
    feed.innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}"><p><strong>${ok ? 'Correto.' : `Incorreto. A resposta é a alternativa ${esc(q.gabarito.toUpperCase())}.`}</strong></p>
      ${q.justificativa ? `<p class="lbl" style="font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 4px">${ex.comentario_ia ? 'Comentário (gerado por IA)' : 'Comentário'}</p><div class="q-coment">${esc(q.justificativa)}</div>` : '<p class="notice">Este material não traz comentário para esta questão.</p>'}
      <p class="selo" style="margin-top:10px">${selo}.</p>${linksDaQuestao(q)}</div>`;
    await Progresso.registrar('q', q.id, q.materia_id, { acertou: ok, resposta: letra });
  } else {
    feed.innerHTML = `<p class="notice">Registrando sua resposta…</p>`;
    try { await App.store.votar(q.id, letra); } catch (e) { toast(e.message); }
    let vs = []; try { vs = await App.store.votos(q.id); } catch { /* sem votos */ }
    const cont = {}; vs.forEach(v => { cont[v.letra] = (cont[v.letra] || 0) + 1; });
    const max = Math.max(0, ...Object.values(cont));
    btns.forEach(b => { const n = cont[b.dataset.l] || 0; if (n) { b.insertAdjacentHTML('beforeend', `<span class="v">${plural(n, 'voto', 'votos')}</span>`); if (n === max) b.classList.add('top'); } });
    feed.innerHTML = `<div class="feedback"><p><strong>Esta questão não tem gabarito no material.</strong></p>
      <p>Você marcou ${esc(letra.toUpperCase())}. Ao lado de cada alternativa aparece quantas pessoas da turma marcaram cada uma. A mais votada não é garantia de acerto.</p>
      ${q.justificativa ? `<div class="q-coment">${esc(q.justificativa)}</div>` : ''}${linksDaQuestao(q)}</div>`;
    await Progresso.registrar('q', q.id, q.materia_id, { acertou: null, resposta: letra });
  }
}

/* ============================ Painel de desempenho ============================ */
async function viewPainel(view, stale, filtro) {
  view.innerHTML = '<p class="notice">Carregando seu desempenho…</p>';
  const desde = new Date(Date.now() - 6 * 86400000); desde.setHours(0, 0, 0, 0);
  const [mats, eventos] = await Promise.all([materiasCache(), App.store.eventosListar(desde.toISOString()).catch(() => []), Progresso.carregar(true)]);
  if (stale()) return;
  const meta = new Map(mats.map(m => [m.id, m]));
  const passa = mid => {
    if (!filtro) return true; const m = meta.get(mid); if (!m) return false;
    const [tipo, valor] = [filtro.slice(0, 2), filtro.slice(2)];
    if (tipo === 'e:') return m.periodo === valor;
    if (tipo === 'a:') return m.periodo + '|' + m.disciplina === valor;
    if (tipo === 't:') return m.id === valor;
    return true;
  };
  const rq = Progresso.todos('q').filter(r => r.acertou != null && passa(r.materia_id));
  const certas = rq.filter(r => r.acertou).length, erradas = rq.length - certas;
  const rf = Progresso.todos('fc').filter(r => passa(r.materia_id));
  const sei = rf.filter(r => r.estado === 'sei').length, rever = rf.filter(r => r.estado === 'rever').length;
  const pct = rq.length ? Math.round(certas / rq.length * 100) : null;
  const dias = [...Array(7)].map((_, i) => { const d = new Date(desde); d.setDate(d.getDate() + i); return d; });
  const ev = eventos.filter(e => passa(e.materia_id));
  const porDia = dias.map(d => { const k = d.toDateString(); const es = ev.filter(e => new Date(e.em).toDateString() === k); return { d, ok: es.filter(e => e.acertou === true).length, erro: es.filter(e => e.acertou === false).length, total: es.length }; });
  const maxDia = Math.max(1, ...porDia.map(x => x.ok + x.erro));
  const DS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const porTema = groupBy(rq, r => r.materia_id);
  const dominio = [...porTema].map(([mid, rs]) => ({ m: meta.get(mid), n: rs.length, p: Math.round(rs.filter(r => r.acertou).length / rs.length * 100) }))
    .filter(x => x.m).sort((a, b) => a.p - b.p || b.n - a.n);
  const cor = p => p >= 80 ? 'var(--ok)' : p >= 60 ? 'var(--accent)' : 'var(--alert)';
  const erradasIds = rq.filter(r => !r.acertou).sort((a, b) => cmpNatural(b.atualizado_em, a.atualizado_em)).slice(0, 25).map(r => r.item_id);
  const qsErr = erradasIds.length ? await App.store.questoesPorIds(erradasIds).catch(() => []) : []; if (stale()) return;
  const porEsp = groupBy(mats, m => m.periodo);
  const opts = `<option value="">Tudo</option>${[...porEsp.keys()].sort(ordemGeralPorUltimo).map(e => `<optgroup label="${esc(e)}">
      <option value="e:${esc(e)}" ${filtro === 'e:' + e ? 'selected' : ''}>${esc(e)}: tudo</option>
      ${[...new Set(porEsp.get(e).map(m => m.disciplina))].sort(ordemGeralPorUltimo).map(a => `<option value="a:${esc(e + '|' + a)}" ${filtro === 'a:' + e + '|' + a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
      ${porEsp.get(e).sort((x, y) => cmpNatural(x.materia, y.materia)).map(m => `<option value="t:${m.id}" ${filtro === 't:' + m.id ? 'selected' : ''}>· ${esc(m.materia)}</option>`).join('')}</optgroup>`).join('')}`;
  view.innerHTML = `<h1>Meu desempenho</h1>
    <div class="field" style="max-width:520px"><label for="painelFiltro">Mostrar</label><select id="painelFiltro">${opts}</select></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${rq.length}</div><div class="l">questões respondidas</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${certas}</div><div class="l">acertos</div></div>
      <div class="kpi"><div class="v" style="color:var(--alert)">${erradas}</div><div class="l">erros</div></div>
      <div class="kpi"><div class="v">${pct == null ? '–' : pct + '%'}</div><div class="l">aproveitamento</div></div>
      <div class="kpi"><div class="v">${sei}</div><div class="l">flashcards que você sabe</div></div>
      <div class="kpi"><div class="v">${rever}</div><div class="l">flashcards para rever</div></div>
    </div>
    <h2>Últimos 7 dias</h2>
    <div class="semana">${porDia.map(x => `<div class="col"><span class="n">${x.total || ''}</span><div class="pilha" style="height:${Math.round((x.ok + x.erro) / maxDia * 90)}px">
      <div class="b" style="flex:${x.ok}"></div><div class="b erro" style="flex:${x.erro}"></div></div><span class="d">${DS[x.d.getDay()]}</span></div>`).join('')}</div>
    <p class="notice">Verde: acertos e flashcards que você sabia. Vermelho: erros. O número em cima conta tudo o que você estudou no dia.</p>
    <h2>Domínio por tema</h2>
    ${dominio.length ? `<ul class="dom-lista">${dominio.map(x => `<li><span><a href="#/m/${x.m.id}/questoes">${esc(x.m.materia)}</a><span class="sub">${esc(x.m.periodo)} › ${esc(x.m.disciplina)}, ${plural(x.n, 'questão', 'questões')}</span></span>
      <span class="bar"><i style="width:${x.p}%;background:${cor(x.p)}"></i></span><span class="pct" style="color:${cor(x.p)}">${x.p}%</span></li>`).join('')}</ul>`

  if (!q.trim()) { results.innerHTML = `<p class="notice" style="margin-top:16px">A busca procura a palavra no texto de todo o material, sem diferenciar acentos, e mostra em que especialidade e tema ela aparece.</p>`; $('#q2').focus(); return; }

  const temas = mats.filter(m => norm(`${m.materia} ${m.disciplina} ${m.periodo}`).includes(qn));
  const grupos = groupBy(hits, h => h.materia_id);

  if (temas.length) html += `<h2>Temas com esse nome</h2><ul class="mat-list">${temas.map(m => `<li class="com-botao"><a href="#/m/${m.id}"><span>${highlight(m.materia, [q])}</span><span class="meta">${esc(m.periodo)} › ${esc(m.disciplina)}</span></a>${botaoPasta('tema', m.id, m.id, m.materia)}</li>`).join('')}</ul>`;
  for (const [mid, hs] of grupos) {
    const m = byId.get(mid); if (!m) continue;
    html += `<section class="hit-group"><p class="crumbs">${esc(m.periodo)} › ${esc(m.disciplina)}</p>
      <h3><a href="#/m/${m.id}">${esc(m.materia)}</a><span class="count">${plural(hs.length, 'trecho', 'trechos')}</span> ${botaoPasta('tema', m.id, m.id, m.materia)}</h3>
      <ul class="hits">${hs.map(h => `<li class="com-botao"><a data-volta href="#/m/${mid}/conteudo/${h.id}"><span class="t">${esc(limparLinha(h.titulo || '') || 'Trecho')}</span><span class="p">página ${h.n}</span><p class="s">${highlight(limparRuido(h.snippet).replace(/\[\[FIG:\d+\]\]/g, ''), [q])}</p></a>${botaoPasta('trecho', h.id, mid, `${limparLinha(h.titulo || '') || limparRuido(h.snippet).slice(0, 60)} (${m.materia}, p. ${h.n})`)}</li>`).join('')}</ul></section>`;
  }
  if (!hits.length && !temas.length) html += `<div class="empty"><p>Nada encontrado. Tente uma palavra mais curta ou um sinônimo.</p></div>`;
  results.innerHTML = html;
}

const Prog = {
  state: null,
  start(total) { this.state = { i: 0, total, nome: '', etapa: '', fase: '', logs: [], prontos: [], esperando: [], done: false, res: null }; this.paint(); },
  fase(t) { if (this.state) { this.state.fase = t; this.paint(); } },
  step(i, total, nome, etapa) { if (!this.state) return; Object.assign(this.state, { i, total, nome, etapa }); this.paint(); },
  log(msg, err) { if (!this.state) return; this.state.logs.unshift({ msg, err }); if (this.state.logs.length > 400) this.state.logs.pop(); this.paint(); },
  pronto(mat) { if (!this.state) return; this.state.prontos.push(mat); this.paint(); },
  espera(mat) { if (!this.state) return; this.state.esperando.push(mat); this.paint(); },
  ia(tema, etapa) { if (!this.state) return; this.state.iaAtivos = this.state.iaAtivos || {}; if (etapa) this.state.iaAtivos[tema] = etapa.replace(/^IA: /, ''); else delete this.state.iaAtivos[tema]; this.paint(); },
  finish(res) { this.state.done = true; this.state.res = res; this.paint(); },
  paint() {
    const el = $('#progress'); if (!el || !this.state) return; const s = this.state;
    const logs = s.logs.length ? `<details style="margin-top:10px"><summary class="notice" style="cursor:pointer">Registro detalhado (${s.logs.length})</summary><ul class="log">${s.logs.map(l => `<li class="${l.err ? 'err' : ''}">${esc(l.msg)}</li>`).join('')}</ul></details>` : '';
    const listaTemas = (titulo, ms) => ms.length ? `<h3 style="margin-top:18px">${titulo}</h3><ul class="mat-list">${ms.map(m => `<li><a href="#/m/${m.id}"><span>${esc(m.materia)}</span><span class="meta">${esc(m.periodo)} › ${esc(m.disciplina)}</span></a></li>`).join('')}</ul>` : '';
    const prontos = listaTemas('Publicados para a turma', s.prontos) + listaTemas('Esperando a IA (ainda não publicados)', s.esperando);
    if (s.done) {
      const r = s.res; const partes = [plural(r.ok, 'arquivo lido', 'arquivos lidos')];
      if (r.midias) partes.push(`${plural(r.midias, 'áudio ou vídeo enviado', 'áudios e vídeos enviados')} para transcrição`);
      if (r.pulados) partes.push(`${r.pulados} já estavam no acervo`); if (r.ignorados) partes.push(`${r.ignorados} sem texto legível`); if (r.erros.length) partes.push(`${r.erros.length} com erro`);
      el.innerHTML = `<section class="panel"><h2>Envio concluído</h2><p>${partes.join(', ')}.</p>
        ${(r.publicados || []).length ? `<p><strong>${plural(r.publicados.length, 'tema publicado', 'temas publicados')} para a turma.</strong></p>` : ''}
        ${(r.aguardando || []).length ? `<p class="notice">${plural(r.aguardando.length, 'tema ainda espera', 'temas ainda esperam')} a IA e não aparece${r.aguardando.length > 1 ? 'm' : ''} para a turma. O administrador termina pelo painel de Administração.</p>` : ''}
        ${r.midias ? `<p class="notice">As transcrições rodam no servidor, primeiro os áudios e depois os vídeos. Quando ficam prontas, a IA atualiza o tema e publica a versão nova. Você já pode fechar o app.</p>` : ''}
        ${r.erros.length ? `<p class="notice" style="color:var(--alert)">Se algum arquivo deu erro por instabilidade, envie a mesma pasta de novo: o que já foi feito é pulado.</p>` : ''}
        ${r.materias.length ? `<ul class="mat-list">${r.materias.map(m => `<li><a href="#/m/${m.id}"><span>${esc(m.materia)}</span><span class="meta">${esc(m.periodo)} › ${esc(m.disciplina)}</span></a></li>`).join('')}</ul>` : ''}
        ${logs}<button class="btn" data-action="prog-clear" style="margin-top:12px">Enviar mais material</button></section>`;
      return;
    }
    const pct = s.total ? Math.round(Math.min(s.i + 1, s.total) / s.total * 100) : 0;
    el.innerHTML = `<section class="panel" aria-live="polite"><h2>${esc(s.fase || 'Processando')}</h2>
      <div class="bar"><i style="width:${pct}%"></i></div><p><strong>${esc(s.nome)}</strong> <span class="notice">(${Math.min(s.i + 1, s.total)} de ${s.total})</span><br><span class="notice">${esc(s.etapa)}</span></p>
      ${Object.keys(s.iaAtivos || {}).length ? `<div class="notice" style="margin-top:8px"><strong>IA trabalhando:</strong><ul style="margin:4px 0 0">${Object.entries(s.iaAtivos).map(([t, e]) => `<li>${esc(t)}: ${esc(e)}</li>`).join('')}</ul></div>` : ''}
      <p class="notice">Deixe esta aba aberta até terminar. Enquanto isso, você pode abrir os temas prontos abaixo: o envio continua.</p>${prontos}${logs}</section>`;
  },
};
async function runImport(items) {
  App.processing = true; App.pending = null; Prog.start(items.length);
  let lock = null; try { lock = await navigator.wakeLock?.request('screen'); } catch { /* sem suporte */ }
  const onUnload = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', onUnload);
  try {
    const r = await processarItens(items, Prog); Prog.finish(r);
    App.store.registrarEnvio?.({ origem: items.some(i => i.driveId) ? 'Google Drive' : 'Arquivos do aparelho', arquivos: items.length, ok: r.ok,
      pulados: r.pulados, erros: r.erros.length, midias: r.midias || 0, temas: (r.materias || []).map(m => m.materia).slice(0, 60) });
  }
  catch (e) { Prog.finish({ ok: 0, pulados: 0, ignorados: 0, erros: [{ nome: 'Envio', msg: e.message }], materias: [] }); }
  finally { App.processing = false; App.matsCache = null; window.removeEventListener('beforeunload', onUnload); try { await lock?.release(); } catch { /* ignore */ } }
}

async function onDriveSubmit(form) {
  const fd = new FormData(form); const id = parseFolderId(fd.get('link')); const plan = $('#drivePlan');
  if (!id) throw new Error('Não encontrei o ID da pasta neste link. Copie o link da barra de endereço do Drive.');
  const modo = fd.get('modo');
  const dest = { periodo: (fd.get('periodo') || '').trim(), disciplina: (fd.get('disciplina') || '').trim(), materia: (fd.get('materia') || '').trim() };
  if (modo === 'unica' && (!dest.periodo || !dest.disciplina || !dest.materia)) throw new Error('Preencha especialidade, área e tema.');
  if (!Drive.disponivel()) throw new Error('A leitura do Drive precisa do servidor.');
  plan.innerHTML = '<p class="notice">Lendo a pasta…</p>';
  await Drive.quem();
  const root = await Drive.meta(id);
  const files = await Drive.walk(id, n => { plan.innerHTML = `<p class="notice">Lendo subpastas: ${plural(n, 'arquivo encontrado', 'arquivos encontrados')}…</p>`; });
  const items = []; let ignorados = 0;
  for (const { file, path } of files) {
    if (!fileKind(file.name, file.mimeType)) { ignorados++; continue; }
    items.push({ nome: file.name, driveId: file.id, mime: file.mimeType, path, destino: modo === 'unica' ? dest : null, getBlob: () => Drive.download(file) });
  }
  App.pending = items;
  const grupos = groupBy(items, it => it.path[0] || '(arquivos soltos)');
  plan.innerHTML = `<h3 style="margin-top:20px">${esc(limparNome(root.name) || root.name)}</h3>
    <p>${plural(items.length, 'arquivo pode', 'arquivos podem')} ser processados${ignorados ? `. ${plural(ignorados, 'outro será ignorado', 'outros serão ignorados')} por formato não suportado` : ''}.
      ${(() => { const n = items.filter(i => ['Áudio', 'Vídeo'].includes(fileKind(i.nome, i.mime))).length; return n ? `<br>${plural(n, 'áudio ou vídeo vai', 'áudios e vídeos vão')} para a transcrição automática no servidor: entram nos temas depois dos textos e das imagens, sem precisar deixar o app aberto.` : ''; })()}</p>
    <div class="scroll-x"><table class="plan-table"><thead><tr><th>Pasta</th><th class="n">Arquivos</th></tr></thead>
    <tbody>${[...grupos].sort((a, b) => cmpNatural(a[0], b[0])).map(([p, v]) => `<tr><td>${esc(limparNome(p) || p)}</td><td class="n">${v.length}</td></tr>`).join('')}</tbody></table></div>
    <p class="notice">${modo === 'auto' ? 'A especialidade, a área e o tema de cada pasta são definidos pelo conteúdo, não só pelo nome.' : `Tudo vai para ${esc(dest.periodo)} › ${esc(dest.disciplina)} › ${esc(dest.materia)}.`} Arquivos que já estão no acervo são pulados.</p>
    <button class="btn primary" data-action="run-pending" ${items.length ? '' : 'disabled'}>Processar ${plural(items.length, 'arquivo', 'arquivos')}</button>`;
}
async function onLocalSubmit(form) {
  const fd = new FormData(form); const auto = !!fd.get('auto');
  const dest = { periodo: (fd.get('periodo') || '').trim(), disciplina: (fd.get('disciplina') || '').trim(), materia: (fd.get('materia') || '').trim() };
  if (!auto && (!dest.periodo || !dest.disciplina || !dest.materia)) throw new Error('Preencha especialidade, área e tema, ou marque “Organizar automaticamente”.');
  const files = [...form.elements.files.files];
  const items = files.filter(f => fileKind(f.name, f.type)).map(f => ({ nome: f.name, driveId: null, path: [], destino: auto ? null : dest, getBlob: async () => ({ blob: f, mime: f.type || mimeFromExt(f.name) }) }));
  if (!items.length) throw new Error('Nenhum arquivo em formato aceito (PDF, Word, PowerPoint, imagem ou texto).');
  runImport(items); render();

-- Painel do administrador: um resumo por pessoa
create or replace function admin_resumo(dias int default 30) returns json
language plpgsql stable security definer set search_path = public as $$
declare desde timestamptz := now() - make_interval(days => dias); r json;
begin
  if not eh_admin() then raise exception 'Apenas o administrador pode ver este painel.'; end if;
  select coalesce(json_agg(x order by x.ultimo_login desc nulls last), '[]') into r from (
    select u.id, u.email::text as email, u.created_at as criado_em, u.last_sign_in_at as ultimo_login,
      exists (select 1 from membros m where lower(m.email) = lower(u.email)) as membro,
      (select coalesce(sum(a.segundos), 0) from acessos a where a.user_id = u.id and a.inicio >= desde) as segundos,
      (select count(distinct (a.inicio at time zone 'America/Sao_Paulo')::date) from acessos a where a.user_id = u.id and a.inicio >= desde) as dias_ativos,
      (select max(a.inicio + make_interval(secs => a.segundos)) from acessos a where a.user_id = u.id) as ultimo_acesso,
      (select count(*) from documentos d where d.criado_por = u.id) as arquivos,
      (select count(*) from envios e where e.user_id = u.id) as envios,
      (select count(*) from progresso p where p.user_id = u.id and p.tipo = 'q') as questoes,
      (select round(100.0 * avg(case when p.acertou then 1 else 0 end)) from progresso p where p.user_id = u.id and p.tipo = 'q' and p.acertou is not null) as acerto,
      (select count(*) from progresso p where p.user_id = u.id and p.tipo = 'fc') as flashcards,
      (select count(*) from flashcards f where f.criado_por = u.id and f.origem = 'ALUNO')
        + (select count(*) from questoes q where q.criado_por = u.id and q.origem = 'ALUNO') as criados
    from auth.users u) x;
  return r;
end $$;
revoke all on function admin_resumo(int) from public, anon;
grant execute on function admin_resumo(int) to authenticated;

-- Painel do administrador: detalhes de uma pessoa
create or replace function admin_usuario(uid uuid, dias int default 30) returns json
language plpgsql stable security definer set search_path = public as $$
declare desde timestamptz := now() - make_interval(days => dias); r json;
begin
  if not eh_admin() then raise exception 'Apenas o administrador pode ver este painel.'; end if;
  select json_build_object(
    'temas', (select coalesce(json_agg(t), '[]') from (
        select a.materia_id, m.materia, m.periodo, sum(a.segundos) as segundos, count(*) as visitas, max(a.inicio) as ultima
        from acessos a left join materias m on m.id = a.materia_id
        where a.user_id = uid and a.inicio >= desde and a.materia_id is not null
        group by a.materia_id, m.materia, m.periodo order by sum(a.segundos) desc limit 40) t),
    'secoes', (select coalesce(json_agg(s), '[]') from (
        select a.aba, sum(a.segundos) as segundos, count(*) as visitas from acessos a
        where a.user_id = uid and a.inicio >= desde group by a.aba order by sum(a.segundos) desc) s),
    'por_dia', (select coalesce(json_agg(d), '[]') from (
        select (a.inicio at time zone 'America/Sao_Paulo')::date as dia, sum(a.segundos) as segundos from acessos a
        where a.user_id = uid and a.inicio >= desde group by 1 order by 1) d),
    'recentes', (select coalesce(json_agg(v), '[]') from (
        select a.inicio, a.segundos, a.aba, a.rota, m.materia from acessos a left join materias m on m.id = a.materia_id
        where a.user_id = uid order by a.inicio desc limit 80) v),
    'envios', (select coalesce(json_agg(e), '[]') from (select * from envios e where e.user_id = uid order by e.em desc limit 40) e),
    'aparelhos', (select coalesce(json_agg(distinct a.aparelho), '[]') from acessos a where a.user_id = uid and a.aparelho is not null)
  ) into r;
  return r;
end $$;
revoke all on function admin_usuario(uuid, int) from public, anon;
grant execute on function admin_usuario(uuid, int) to authenticated;

/* A IA lê o pedido livre do aluno ("o que vai cair na prova") e escolhe os temas publicados que cobrem cada assunto,
   com palavras para achar o trecho exato; a busca do app acha os trechos. */
async function montarPastaComIA(pedido, aviso = () => {}) {
  aviso('A IA está lendo o seu pedido…');
  const [mats, prontos] = await Promise.all([materiasCache(), App.store.temasProntos()]);
  const lista = mats.filter(m => prontos.has(m.id)).sort((a, b) => cmpNatural(a.periodo + a.disciplina + a.materia, b.periodo + b.disciplina + b.materia));
  if (!lista.length) throw new Error('Ainda não há temas publicados no acervo para montar a pasta.');
  const r = await IA.chamar(`Um estudante de Medicina vai fazer uma prova. Abaixo está o que ele disse que vai cair (pode ser a ementa, uma lista de assuntos ou um texto livre) e a lista de temas do acervo da turma.

Para cada assunto que ele citou:
- escolha o tema ou os temas do acervo que cobrem esse assunto, pelo número "i" (prefira os mais específicos; no máximo 3 por assunto);
- em "busca", dê 1 a 3 palavras que certamente aparecem no texto do material sobre esse assunto, para achar o trecho exato (ex.: "lítio", "M-CHAT", "síndrome neuroléptica maligna");
- se nenhum tema do acervo cobrir o assunto, coloque o assunto em "faltando".
Não invente temas nem números. Sugira também um nome curto para a pasta.

Responda somente com JSON: {"nome":"...","assuntos":[{"assunto":"...","temas":[0,3],"busca":"..."}],"faltando":["..."]}

PEDIDO DO ESTUDANTE
${pedido.slice(0, 6000)}

TEMAS DO ACERVO (i | especialidade › área › tema)
${lista.map((m, i) => `${i} | ${m.periodo} › ${m.disciplina} › ${m.materia}`).join('\n').slice(0, 60000)}`, { maxTokens: 6000 });
  const itens = []; const vistos = new Set();
  const add = it => { const k = it.tipo + ':' + it.id; if (!vistos.has(k)) { vistos.add(k); itens.push(it); } };
  const assuntos = (r.assuntos || []).filter(a => a && Array.isArray(a.temas)).slice(0, 30);
  for (let k = 0; k < assuntos.length; k++) {
    const a = assuntos[k];
    const temas = a.temas.map(Number).filter(i => Number.isInteger(i) && lista[i]).slice(0, 3).map(i => lista[i]);
    temas.forEach(m => add({ tipo: 'tema', id: m.id, materia_id: m.id, titulo: m.materia }));
    const busca = String(a.busca || '').trim();
    if (busca && temas.length) {
      aviso(`Procurando os trechos (${k + 1} de ${assuntos.length}): ${a.assunto || busca}`);
      const ids = new Set(temas.map(m => m.id));
      const hits = (await App.store.search(busca).catch(() => [])).filter(h => ids.has(h.materia_id)).slice(0, 2);
      hits.forEach(h => add({ tipo: 'trecho', id: h.id, materia_id: h.materia_id,
        titulo: `${String(a.assunto || busca).slice(0, 60)}: ${limparLinha(h.titulo || '') || limparRuido(h.snippet || '').slice(0, 60)} (${temas.find(m => m.id === h.materia_id)?.materia || ''}, p. ${h.n})` }));
    }
  }
  const faltando = (r.faltando || []).map(String).filter(Boolean).slice(0, 40);
  faltando.forEach(f => add({ tipo: 'faltando', id: norm(f).slice(0, 80), titulo: f.slice(0, 140) }));
  return { itens, faltando: faltando.length, nome: String(r.nome || '').slice(0, 80) };
}

/* ============================ Fila da IA ============================
   Temas com material que ainda não têm a versão oficial (ou que receberam material novo). Um tema só entra
   na fila quando nada dele está carregando (transcrições), para ser publicado completo. */
async function temasParaIA() {
  const [mats, st, docsT, prep] = await Promise.all([materiasCache(true).catch(() => []), App.store.statusIA(), App.store.docsTodos(), App.store.preparo().catch(() => new Map())]);
  const porTema = groupBy(docsT, d => d.materia_id);
  return mats.filter(m => (porTema.get(m.id) || []).length).map(m => {
    const r = st.get(m.id); const ds = porTema.get(m.id);
    return { m, pronto: iaPronto(r), novos: docsSemIA(r, ds), semQuestoes: iaPronto(r) && Number(r.qversao || 0) < QVERSAO, comecou: !!r?.rascunho, ndocs: ds.length, carregando: prep.get(m.id)?.pend || 0 };
  }).filter(x => !x.pronto || x.novos.length || x.semQuestoes);
}

document.addEventListener('click', async e => {
  const volta = e.target.closest('a[data-volta]'); if (volta) marcarVolta();
  const img = e.target.closest('.apostila img, .fig img, .pg-orig img, .q-figs img, .foto img, .reading img');
  if (img && img.src) { zoom(img.src, img.alt); return; }
  if (e.target.closest('#voltarBtn')) {
    const v = lerVolta(); sessionStorage.removeItem('voltar');
    if (v) { App.restaurarY = v.y; go(v.hash); } return;
  }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; const id = el.dataset.id; const st = App.store;
  try {
    switch (a) {
      case 'reload': render(); break;
      case 'mod-ver': el.classList.toggle('ver'); break;
      case 'mod-liberar': case 'mod-remover': {
        if (a === 'mod-remover' && !confirm('Remover esta imagem do acervo? Ela some de todos os temas onde aparece.')) return;
        el.disabled = true; await st.moderacaoDecidir(el.dataset.ref, a === 'mod-liberar' ? 'liberada' : 'removida');
        toast(a === 'mod-liberar' ? 'Imagem liberada' : 'Imagem removida'); render(); break;
      }
      case 'versao-ver': e.preventDefault(); App.versaoSel[el.dataset.mid] = id || ''; toast(id ? 'Mostrando a versão escolhida' : 'Mostrando a versão oficial'); go(`#/m/${el.dataset.mid}/conteudo`); break;
      case 'versao-oficial':
        if (!confirm('Tornar esta versão a oficial? A turma inteira passa a ver o que ela mudou.')) return;
        el.disabled = true; await promoverVersao(el.dataset.mid, id); App.versaoSel[el.dataset.mid] = ''; toast('Agora esta é a versão oficial'); render(); break;
      case 'versao-apagar':
        if (!confirm('Apagar esta versão?')) return;
        el.disabled = true; await st.apagarVersao(id); if (App.versaoSel[el.dataset.mid] === id) App.versaoSel[el.dataset.mid] = ''; toast('Versão apagada'); render(); break;
      case 'pasta-add': await abrirAdicionarPasta({ tipo: el.dataset.tipo, id, materia_id: el.dataset.mid, titulo: el.dataset.titulo }); break;
      case 'pasta-item-del': {
        const p = (await st.listarPastas()).find(x => x.id === el.dataset.pasta); if (!p) return;
        await st.salvarPasta({ ...p, itens: (p.itens || []).filter(i => !(i.tipo === el.dataset.tipo && i.id === id)) }); render(); break;
      }
      case 'pasta-del': if (!confirm('Apagar esta pasta? Os temas continuam na biblioteca.')) return; await st.apagarPasta(id); toast('Pasta apagada'); go('#/pastas'); break;
      case 'ia-testar': {
        el.disabled = true;
        try { const t = await IA.chamar('Responda somente com a palavra OK.', { formato: 'texto', maxTokens: 50 }); toast('A IA está funcionando. Resposta: ' + t.slice(0, 40)); }
        finally { el.disabled = false; }
        break;
      }
      case 'ia-fila': {
        const ids = App.iaFila || []; el.disabled = true; const stt = () => $('#iaFilaStatus');
        for (let i = 0; i < ids.length; i++) {
          try { await melhorarComIA(ids[i], m => { if (stt()) stt().textContent = `Tema ${i + 1} de ${ids.length}: ${m.replace(/^IA: /, '')}`; }); }
          catch (e2) { console.warn(e2); toast(e2.message); if (e2.cota) break; }
        }
        App.matsCache = null; render(); break;
      }
      case 'rep-resolver': el.disabled = true; await st.adminApagarReporte(id); toast('Denúncia resolvida'); render(); break;
      case 'ia-tema': {
        el.disabled = true; const rot = el.textContent;
        try { await melhorarComIA(id, m => { el.textContent = m.replace(/^IA: /, ''); }); toast('Tema organizado com IA'); render(); }
        finally { if (el.isConnected) { el.textContent = rot; el.disabled = false; } }
        break;
      }
      case 'regenerar':
        el.disabled = true; toast('Refazendo a prévia automática e a leitura das questões…');
        await gerarConteudo(id); toast('Pronto: tema atualizado'); render(); break;
      case 'del-materia': {
        const m = await st.getMateria(id);
        if (!confirm(`Excluir “${m?.materia}” com todos os arquivos, flashcards e questões? Isso não pode ser desfeito.`)) return;
        await st.deleteMateria(id); App.matsCache = null; toast('Tema excluído'); go('#/'); break;
      }
      case 'del-doc':
        if (!confirm('Remover este arquivo do tema? O resumo, os flashcards e as questões automáticas serão refeitos.')) return;
        await st.deleteDocumento(id); await gerarConteudo(el.dataset.mid); App.matsCache = null;
        toast('Arquivo removido'); goOrRender(`#/m/${el.dataset.mid}/original`); break;
      case 'ir-ancora': e.preventDefault(); document.getElementById(id)?.scrollIntoView({ block: 'start' }); break;
      case 'ver-foto': {
        const box = el.nextElementSibling;
        if (box.innerHTML) { box.innerHTML = ''; el.textContent = 'Ver foto da página'; break; }
        el.textContent = 'Esconder foto da página';
        box.innerHTML = `<img class="pg-img" data-ref="${esc(el.dataset.ref)}" alt="Foto da página" style="margin-top:10px">`; hydrateImages(box); break;
      }
      case 'fcv-chip': { const g = FCV.f[el.dataset.g]; const v = el.dataset.v; g.has(v) ? g.delete(v) : g.add(v);
        if (el.dataset.g === 'esp' && !FCV.f.esp.size) { FCV.f.area.clear(); FCV.f.tema.clear(); }
        FCV.i = 0; FCV.virado = false; fcvRender(); break; }
      case 'fcv-limpar': Object.values(FCV.f).forEach(s => s.clear()); FCV.busca = ''; FCV.i = 0; FCV.virado = false; fcvRender(); break;
      case 'fcv-emb': FCV.ordem = shuffle(FCV.ordem); FCV.i = 0; FCV.virado = false; fcvRender(); toast('Cards embaralhados'); break;
      case 'fcv-lista': FCV.lista = !FCV.lista; fcvRender(); break;
      case 'fcv-virar': fcvVirar(); break;
      case 'fcv-ant': if (FCV.i > 0) { FCV.i--; FCV.virado = false; fcvRender(); } break;
      case 'fcv-prox': if (FCV.i < fcvFiltrados().length - 1) { FCV.i++; FCV.virado = false; fcvRender(); } break;
      case 'fcv-marca': await fcvMarcar(el.dataset.v); break;
      case 'fc-new': newFlashcard(el.dataset.mid); break;
      case 'fc-del': if (confirm('Apagar este flashcard?')) { await st.remove('flashcards', id); render(); } break;
      case 'q-filter': QZ.filtro = el.dataset.f; QZ.i = 0; renderQuestoes(CTX.body, CTX.mat, CTX.qs); break;
      case 'q-sit': QZ.sit = el.dataset.f; QZ.i = 0; renderQuestoes(CTX.body, CTX.mat, CTX.qs); break;
      case 'q-ans': await answerQuestao(el.dataset.l); break;
      case 'q-nav': QZ.i = Math.max(0, Math.min(CTX.listaQ.length - 1, QZ.i + Number(el.dataset.d))); await showQuestao(); $('#qBox').scrollIntoView({ block: 'nearest' }); break;
      case 'q-new': newQuestao(el.dataset.mid); break;
      case 'q-del': if (confirm('Apagar esta questão?')) { await st.remove('questoes', id); render(); } break;
      case 'report': openReport(el.dataset.alvo, id); break;
      case 'run-pending': if (App.pending) { runImport(App.pending); render(); } break;
      case 'prog-clear': Prog.state = null; render(); break;
      case 'logout': await st.signOut(); Progresso.mapa = null; render(); break;
      case 'login-google': await st.signInGoogle(); break;
      case 'copy-robo': await navigator.clipboard.writeText(await Drive.quem()); toast('E-mail copiado'); break;
      case 'apagar-progresso':
        if (!confirm('Apagar todo o seu histórico de questões e flashcards? Isso não pode ser desfeito.')) return;
        await Progresso.apagar(); toast('Progresso apagado'); break;
      case 'wipe':
        if (!confirm('Apagar todo o acervo guardado neste navegador?')) return;
        await st.wipe(); lsDel('demo_seeded_v3'); await st.progressoApagar(); location.reload(); break;
    }
  } catch (err) { console.error(err); toast(err.message); el.disabled = false; }
});

let buscaFcTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'fcvBusca') return;
  FCV.busca = e.target.value; clearTimeout(buscaFcTimer);
  buscaFcTimer = setTimeout(() => { FCV.i = 0; FCV.virado = false; const pos = e.target.selectionStart; fcvRender(); const n = $('#fcvBusca'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
});
document.addEventListener('keydown', e => {
  if (!$('#fcvCard') || FCV.lista || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || $('#dlg').open) return;
  if (e.key === ' ') { e.preventDefault(); fcvVirar(); }
  else if (e.key === 'ArrowRight') { if (FCV.i < fcvFiltrados().length - 1) { FCV.i++; FCV.virado = false; fcvRender(); } }
  else if (e.key === 'ArrowLeft') { if (FCV.i > 0) { FCV.i--; FCV.virado = false; fcvRender(); } }
  else if (e.key === '1') fcvMarcar('rever');
  else if (e.key === '2') fcvMarcar('sei');
});
document.addEventListener('submit', async e => {

  const h = handlers[f.id]; if (!h) return;

});

async function seedDemo() {
  if (lsGet('demo_seeded_v3', false)) return;
  const st = App.store;
  if ((await st.listMateriasComContagem()).length) { lsSet('demo_seeded_v3', true); return; }
  for (const m of DEMO) {
    const mat = await st.ensureMateria(m.periodo, m.disciplina, m.materia);
    for (const d of m.docs) {
      const docId = uuid();
      const pages = d.paginas.map((p, i) => ({ id: uuid(), documento_id: docId, materia_id: mat.id, n: i + 1, titulo: p.titulo, texto: p.texto,
        texto_norm: norm(p.titulo + ' ' + p.texto), html: null, imagem: null, imagens: [], figuras: [], destaques: [] }));
      await st.addDocumento({ id: docId, materia_id: mat.id, nome: d.nome, tipo: 'Texto', drive_id: null, ordem: ++ordemSeq, criado_por: 'local', criado_em: nowIso() }, pages);
    }
    await gerarConteudo(mat.id);
  }
  lsSet('demo_seeded_v3', true);
}

/* ============================ Início ============================ */
async function boot() {
  try {
    if (cfg('SUPABASE_URL') && cfg('SUPABASE_ANON_KEY')) {
      App.store = new SupaStore(); await App.store.init();
      if (/access_token=|[?&]code=|error_description=/.test(location.href)) history.replaceState(null, '', location.pathname + '#/');
    } else {
      App.store = new LocalStore(); await App.store.init(); await seedDemo();
    }
  } catch (e) {
    console.error(e);
    App.store = new LocalStore();
    try { await App.store.init(); } catch (e2) { $('#view').innerHTML = `<div class="empty"><h1>Não foi possível iniciar</h1><p>${esc(e2.message)}</p></div>`; return; }
    toast('Não foi possível conectar ao servidor. Usando o modo local.');
  }
  render();
}
boot();
