async function extractDocx(blob) {
  await loadLib('mammoth');
  const imgs = [];
  const res = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() }, {
    convertImage: mammoth.images.imgElement(async image => {
      const b64 = await image.read('base64'); const idx = imgs.length;
      imgs.push({ b64, type: image.contentType || 'image/png' }); return { src: `img:${idx}` };
    }),
  });
  const doc = new DOMParser().parseFromString(res.value, 'text/html');
  const sections = []; let cur = { titulo: null, nodes: [] };
  for (const node of [...doc.body.children]) {
    if (/^H[12]$/.test(node.tagName)) {
      if (cur.nodes.length) { sections.push(cur); cur = { titulo: node.textContent.trim(), nodes: [] }; }
      else cur.titulo = node.textContent.trim();
    } else cur.nodes.push(node);
  }
  sections.push(cur);
  return sections.filter(s => s.nodes.length).map(s => {
    const html = s.nodes.map(n => n.outerHTML).join('');
    const tmp = doc.createElement('div'); tmp.innerHTML = html;
    const texto = [...tmp.querySelectorAll('p,li,td,th,h3,h4,h5,h6')].filter(e => !e.querySelector('p,li')).map(e => e.textContent.trim()).filter(Boolean).join('\n');
    const destaques = [...tmp.querySelectorAll('strong,b')].map(e => e.textContent.trim()).filter(t => t.length > 3 && t.length < 120);
    const used = [...new Set([...html.matchAll(/src="img:(\d+)"/g)].map(m => +m[1]))];
    return { titulo: s.titulo, texto, html, imgsDocx: used.map(i => ({ idx: i, ...imgs[i] })), destaques };
  });
}

async function extractPptx(blob) {
  await loadLib('jszip');
  const zip = await JSZip.loadAsync(blob);
  const A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
  const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const num = n => +(n.match(/slide(\d+)\.xml$/) || [0, 0])[1];
  const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  const resolve = (base, rel) => { const parts = (base + rel).split('/'); const st = []; parts.forEach(p => { if (p === '..') st.pop(); else if (p && p !== '.') st.push(p); }); return st.join('/'); };
  const slides = []; const useCount = {};
  for (const sf of slideFiles) {
    const xml = new DOMParser().parseFromString(await zip.file(sf).async('string'), 'application/xml');
    let titulo = null; const bullets = []; const destaques = [];
    for (const sp of xml.getElementsByTagNameNS(P, 'sp')) {
      const ph = sp.getElementsByTagNameNS(P, 'ph')[0];
      const isTitle = ph && /title|ctrTitle/i.test(ph.getAttribute('type') || '');
      const paras = [...sp.getElementsByTagNameNS(A, 'p')].map(p => {
        for (const r of p.getElementsByTagNameNS(A, 'r')) {
          const rpr = r.getElementsByTagNameNS(A, 'rPr')[0];
          if (rpr && rpr.getAttribute('b') === '1') { const t = r.textContent.trim(); if (t.length > 3) destaques.push(t); }
        }
        return [...p.getElementsByTagNameNS(A, 't')].map(t => t.textContent).join('').trim();
      }).filter(Boolean);
      if (isTitle && !titulo) titulo = paras.join(' '); else bullets.push(...paras);
    }
    for (const tr of xml.getElementsByTagNameNS(A, 'tr')) {
      const cells = [...tr.getElementsByTagNameNS(A, 'tc')].map(tc => tc.textContent.trim()).filter(Boolean);
      if (cells.length) bullets.push(cells.join(' | '));
    }
    const paths = [];
    const relPath = sf.replace('ppt/slides/', 'ppt/slides/_rels/') + '.rels';
    if (zip.file(relPath)) {
      const rels = new DOMParser().parseFromString(await zip.file(relPath).async('string'), 'application/xml');
      const map = {}; for (const r of rels.getElementsByTagName('Relationship')) map[r.getAttribute('Id')] = r.getAttribute('Target');
      for (const blip of xml.getElementsByTagNameNS(A, 'blip')) {
        const tgt = map[blip.getAttributeNS(R, 'embed')]; if (!tgt) continue;
        const path = resolve('ppt/slides/', tgt);
        if (/\.(png|jpe?g|gif|webp)$/i.test(path) && !paths.includes(path)) { paths.push(path); useCount[path] = (useCount[path] || 0) + 1; }
      }
    }
    slides.push({ titulo, bullets: [...new Set(bullets)], destaques, paths });
  }
  const limit = Math.max(3, slides.length * 0.4);                     // ignora logos repetidos em todos os slides
  const out = [];
  for (const s of slides) {
    if (!s.titulo && !s.bullets.length && !s.paths.length) continue;
    const blobs = [];
    for (const p of s.paths) if (useCount[p] <= limit) blobs.push(new Blob([await zip.file(p).async('arraybuffer')], { type: mimeFromExt(p) }));
    out.push({ titulo: s.titulo, texto: s.bullets.join('\n'), bullets: s.bullets, imagensBlobs: blobs, destaques: s.destaques });
  }
  return out;
}

const Chaves = {

const IA_PREFERIDA = { apostila: 'gemini', resumo: 'gemini', flashcards: 'gemini', questoes: 'groq', curta: 'groq' };
const IA = {
  // espaço entre pedidos de cada IA: diminui sozinho enquanto ela aceita e aumenta quando ela pede calma
  ritmo: { gemini: { intervalo: 4000, min: 2500, proximo: 0 }, mistral: { intervalo: 1500, min: 1100, proximo: 0 }, groq: { intervalo: 2500, min: 2100, proximo: 0 } },
  quemFaz: {},        // tarefa -> IA que realmente respondeu da última vez (sem a chave de uma, o servidor usa outra)

  modoAjuda: false,   // ligado enquanto a fila da IA roda com a chave própria de um aluno: só a cota dele é usada

    // cada pedido reserva o seu horário: vários pedidos podem estar em andamento, mas começam espaçados
    const vez = async () => { const rt = fila(); const slot = Math.max(Date.now(), rt.proximo); rt.proximo = slot + rt.intervalo; if (slot > Date.now()) await esperar(slot - Date.now()); };
    await vez();
    let ultimoErro = null; const evitar = [];
    for (let t = 0; t < 4; t++) {
      const { data } = await App.store.sb.auth.getSession();
      let r, j;
      try {
        r = await fetch(cfg('SUPABASE_URL').replace(/\/$/, '') + '/functions/v1/ia', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session?.access_token, apikey: cfg('SUPABASE_ANON_KEY') },
          body: JSON.stringify({ prompt, sistema, formato, maxTokens, temperatura, reserva: reserva || t >= 2, tarefa, provedor, evitar, origem: ROBO ? 'robo' : 'app',
            ...(usarPropria ? { chaves: { gemini: propria }, soPropria: !!so } : {}) }) });

        if (usarPropria && j.provedor === 'gemini') Chaves.contar('gemini_pedidos');
        if (j.provedor && !provedor && !usarPropria) this.quemFaz[tarefa] = j.provedor;
        const rt = this.ritmo[j.provedor] || fila(); rt.intervalo = Math.max(rt.min, rt.intervalo * 0.95);
        return formato === 'json' ? lerJsonDaIA(j.texto) : String(j.texto || '').trim();
      }
      ultimoErro = new Error(j.error || `A IA respondeu ${r.status}`);
      if (j.semChave) { ultimoErro.semChave = true; break; }
      if (j.propria && usarPropria) {
        if (j.chave) { ultimoErro.chavePropria = true; if (!chave) Chaves.recusada(); }
        if (!so && !chave && (j.chave || r.status === 429)) { usarPropria = false; continue; }   // fora da ajuda à fila: usa a cota da turma
        if (j.chave) break;
      }
      if (r.status === 504 && j.lento && !provedor) { evitar.push(j.lento); continue; }   // essa IA demorou: tenta logo com outra
      if (r.status === 429) { const rt = fila(); rt.intervalo = Math.min(15000, rt.intervalo * 1.6); }
      if (r.status === 429) { if (t < 2) { await esperar(35000 * (t + 1)); await vez(); continue; } ultimoErro.cota = true; break; }
      if (r.status >= 500) { await esperar(9000 * (t + 1)); continue; }

function lerJsonDaIA(txt) {
  let s = String(txt || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try { return JSON.parse(s); } catch { /* tenta recortar */ }
  const a = Math.min(...['{', '['].map(c => s.indexOf(c)).filter(i => i >= 0));
  const b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (isFinite(a) && b > a) return JSON.parse(s.slice(a, b + 1));
  throw new Error('A IA devolveu uma resposta em formato inesperado.');
}

function htmlParaTexto(html) {
  const doc = new DOMParser().parseFromString(`<div>${sanitize(html)}</div>`, 'text/html');
  const out = [];
  doc.body.firstElementChild.querySelectorAll('h1,h2,h3,h4,p,li,td,img').forEach(e => {
    if (e.tagName === 'IMG') { if (e.dataset.ref) out.push(`[[REF:${e.dataset.ref}]]`); return; }
    if (e.querySelector('p,li')) return;
    const t = e.textContent.trim(); if (!t) return;
    out.push(/^H[1-4]$/.test(e.tagName) ? '## ' + t : e.tagName === 'LI' ? '- ' + t : t);
  });
  return out.join('\n');
}

/* Páginas que a IA jogaria fora (capa, sumário, biografia, propaganda, despedida): não são enviadas, para gastar
   menos pedidos da cota gratuita. As referências bibliográficas continuam indo. Na dúvida, a página vai para a IA. */
function paginaDescartavel(texto, n) {
  const t = String(texto || '').replace(/\[\[(FIG|REF):[^\]]+\]\]/g, '').trim();
  const nt = norm(t);
  const linhas = t.split('\n').map(l => l.trim()).filter(Boolean);
  if (t.length < 80) return 'vazia';
  if (n === 1 && t.length < 400) return 'capa';
  // sumário: título "sumário/índice" com itens numerados, ou quase todas as linhas terminando em número de página
  const comNumero = linhas.filter(l => /\S\s+\.*\s*\d{1,3}$/.test(l) && l.length < 140).length;
  const numerados = linhas.filter(l => /^\d+(\.\d+)+\s/.test(l) && /\s\d{1,3}$/.test(l)).length;   // "2.9.1 SÍNDROME DE RETT 19"
  if ((/^(sumario|indice)\b/m.test(nt) && comNumero >= 3) || (linhas.length >= 6 && comNumero / linhas.length >= 0.6 && numerados >= comNumero * 0.5)) return 'sumário';
  if (RE_PROPAGANDA.test(t) && t.length < 1500) return 'propaganda';
  const bio = ['sou o professor', 'sou a professora', 'me formei', 'minha residencia', 'minha trajetoria', 'minha formacao', 'fui aprovado', 'fui aprovada', 'estrategista e futuro residente']
    .filter(x => nt.includes(x)).length;
  if (bio >= 2) return 'biografia';
  if (/consideracoes finais/.test(nt) && t.length < 900 && /(ate breve|bons estudos|forum|redes sociais|duvidas ou sugestoes)/.test(nt)) return 'despedida';
  return null;
}
/* Página de questões que também tem texto de conteúdo (ex.: um quadro "CAI NA PROVA" no meio da explicação) */
function temConteudoMisto(t) {
  return String(t || '').split('\n').map(l => l.trim()).filter(x => x.length > 40 && !/^\(?[a-eA-E]\s*[).]\s/.test(x)).join(' ').length >= 600;
}
/* Tamanho de cada pedaço da apostila mandado à IA. A cota grátis conta sobretudo o número de pedidos por dia,
   então pedaços maiores (24 mil letras, antes 12 mil) fazem a mesma apostila com metade dos pedidos. */
const TAM_TRECHO = 24000;
function trechosParaIA(pages, docs, tam = TAM_TRECHO) {
  const { conteudo, questoes } = separarConteudo(pages, docs);
  // a IA tira as questões da apostila sozinha, então páginas mistas entram inteiras (o conteúdo delas não se perde)
  const ordem = new Map(docs.map((d, i) => [d.id, i]));
  const segs = [...conteudo, ...questoes.filter(sg => temConteudoMisto(sg.texto))]
    .filter(sg => (sg.pagina.html && !sg.texto) || !paginaDescartavel(sg.texto, sg.pagina.n))
    .sort((a, b) => (ordem.get(a.pagina.documento_id) ?? 0) - (ordem.get(b.pagina.documento_id) ?? 0) || a.pagina.n - b.pagina.n);
  const mapa = [];
  const blocos = segs.map(seg => {
    const idx = mapa.push(seg.pagina.id) - 1;
    const t = seg.pagina.html && !seg.texto ? htmlParaTexto(seg.pagina.html) : seg.texto;
    return `⟦P:${idx}⟧\n` + t.replace(/\[\[FIG:(\d+)\]\]/g, (_, n) => `[[FIG:${idx}.${n}]]`);
  });
  const trechos = []; let atual = '';
  for (const b of blocos) { if (atual && atual.length + b.length > tam) { trechos.push(atual); atual = ''; } atual += (atual ? '\n\n' : '') + b; }
  if (atual) trechos.push(atual);

const QVERSAO = 2;

async function melhorarComIA(mid, aviso = () => {}, { baseFeita = false } = {}) {
  if (IA_RODANDO.has(mid)) throw new Error('A IA já está organizando este tema.');
  IA_RODANDO.add(mid);
  try {
    const store = App.store;
    const mat = await store.getMateria(mid); const tema = mat?.materia || 'tema';
    const antes = await store.getResumo(mid);
    if (temaOcupado(antes)) throw Object.assign(new Error(`Outro aparelho (o robô da IA ou o app aberto em outro lugar) já está organizando “${tema}”.`), { ocupado: true });
    if (iaPronto(antes) && !docsSemIA(antes, await store.listDocumentos(mid)).length) {
      if ((antes.qversao || 0) >= QVERSAO) return;     // já organizado e sem material novo: não gasta a IA de novo
      await store.setResumo(mid, { ...antes, ocupado: marcaIA() });
      return await completarQuestoesIA(mid, tema, antes, aviso);   // tema publicado antes das questões novas: só faz as questões
    }

/* Versões: a oficial é a que a IA publica. Quem pede um ajuste na aba Ajustes cria uma versão nova, com o seu nome;

function dividirMarkdown(md, max = 12000) {
  const blocos = []; let atual = '';
  for (const sec of String(md || '').split(/\n(?=## )/)) {
    if (atual && atual.length + sec.length > max) { blocos.push(atual); atual = ''; }
    atual += (atual ? '\n' : '') + sec;
  }
  if (atual) blocos.push(atual);
  return blocos;
}
function promptAjusteApostila(trecho, instr, tema, k, n) {
  return `Abaixo está o trecho ${k} de ${n} da apostila de Medicina sobre "${tema}", em markdown.
Aplique a INSTRUÇÃO a este trecho. Se a instrução não tiver nada a ver com este trecho, devolva o trecho exatamente como está.

REGRAS
- Não invente informação que não esteja no trecho, a não ser que a instrução peça explicitamente uma correção técnica.
- Mantenha cada marcador ⟦P:n⟧ exatamente como está, em linha própria.
- Mantenha os marcadores de figura [[FIG:x.y]] e [[REF:...]] em linha própria; só apague um se a instrução pedir para tirar aquela figura.
- Mantenha a formatação: "## " e "### " para títulos, "- " para listas, tabelas markdown, "> " para alertas, **negrito** nos termos-chave.
- Responda apenas com o markdown do trecho, sem comentários.

INSTRUÇÃO
${instr}

TRECHO
${trecho}`;
}
async function iaAjustarApostila(apostila, instr, tema, aviso) {

  for (let k = 0; k < blocos.length; k++) {
    aviso(`IA: ajustando a apostila (parte ${k + 1} de ${blocos.length})`);
    let md = (await IA.chamar(promptAjusteApostila(blocos[k], instr, tema, k + 1, blocos.length), { formato: 'texto', maxTokens: 16000 }))
      .replace(/^```(?:markdown|md)?\s*/i, '').replace(/```\s*$/, '').trim();
    if (md.length < blocos[k].length * 0.3) md = blocos[k];      // resposta suspeita (cortada): mantém o trecho
    const faltaP = [...blocos[k].matchAll(/⟦P:\d+⟧/g)].map(m => m[0]).filter(m => !md.includes(m));
    novos.push((faltaP.length ? faltaP.join('\n') + '\n' : '') + md);
  }

  const fecharLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const fecharTabela = () => {
    if (!tabela.length) return;
    const rows = tabela.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    html += `<div class="scroll-x"><table class="tab-md">${rows.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${inlineMd(c)}</th>` : `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    tabela = [];
  };
  const fecharTudo = () => { fecharPara(); fecharLista(); fecharTabela(); };
  for (const bruta of linhas) {
    let l = bruta.trim();
    l = l.replace(/⟦P:(\d+)⟧/g, (_, n) => { const id = ctx.mapa[+n]; if (id) { fecharTudo(); html += `<span class="ancora" id="p-${id}"></span>`; } return ''; }).trim();
    if (!l) { fecharTudo(); continue; }
    const fig = l.match(/^\[\[(FIG:(\d+)\.(\d+)|REF:([^\]]+))\]\]$/);
    if (fig) { fecharTudo(); html += fig[4] ? `<figure class="fig"><img data-ref="${esc(fig[4])}" alt="Figura do material"></figure>` : (ctx.paginas.get(ctx.mapa[+fig[2]]) ? figuraHtml(ctx.paginas.get(ctx.mapa[+fig[2]]), +fig[3]) : ''); continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);

    fecharLista(); para.push(l);

        await store.addDocumento(docRow, pages);
        if (!it.destino && pages.length >= 2) novosDocs.push({ doc: docRow, paginas: pages, mat, profunda: !!it.variasAreas });
        await store.limparFalha?.(mat.id, limparNome(it.nome) || it.nome, it.driveId);
        tocadas.set(mat.id, mat); tocadasGrupo.set(mat.id, mat); res.ok++;
        ui.log(`${limparNome(it.nome) || it.nome} → ${dest.periodo} › ${dest.disciplina} › ${dest.materia}`);
        if (precisaFase2(it.nome, l.got.mime)) fase2.push({ it, mid: mat.id, docId, got: l.got, mime: l.got.mime, pageIds: pages.map(p => p.id) });   // reaproveita o arquivo já baixado
      } catch (e) { console.error(e); ui.log(`Erro em ${it.nome}: ${e.message}`, true); await falhou(it, e.message, mat?.id); }
    }
    for (let j = 0; j < midiasGrupo.length; j++) {
      const it = midiasGrupo[j].it; let mat = null;
      try {
        const dest = destinoDe(it);
        mat = await comRetentativa(() => store.ensureMateria(dest.periodo, dest.disciplina, dest.materia, it.escopo));
        taxonomia.add(`${dest.periodo} › ${dest.disciplina} › ${dest.materia}`);
        temaPorCaminho.set((it.path || []).join('/'), temaPorCaminho.get((it.path || []).join('/')) || mat);
        const tipo = fileKind(it.nome, it.mime || '') === 'Áudio' ? 'audio' : 'video';
        await store.enfileirarMidias([{ materia_id: mat.id, drive_id: it.driveId, nome: limparNome(it.nome) || it.nome, tipo }]);
        await store.limparFalha?.(mat.id, limparNome(it.nome) || it.nome, it.driveId);
        res.midias = (res.midias || 0) + 1;
        if (!tocadas.has(mat.id)) tocadas.set(mat.id, { ...mat, _soMidia: true });
        if (!tocadasGrupo.has(mat.id)) tocadasGrupo.set(mat.id, { ...mat, _soMidia: true });
        ui.log(`${limparNome(it.nome) || it.nome} → transcrição automática (${tipo === 'audio' ? 'áudio' : 'vídeo'}) em ${dest.periodo} › ${dest.materia}`);
      } catch (e) { console.error(e); ui.log(`Erro ao enviar ${it.nome} para transcrição: ${e.message}`, true); await falhou(it, 'Transcrição: ' + e.message, mat?.id); }
    }
    // Arquivos que não puderam ser lidos ficam registrados no tema da mesma pasta, para aparecerem como "não foram"
    for (const f of falhasLeitura) {
      let mat = temaPorCaminho.get((f.it.path || []).join('/')) || [...tocadasGrupo.values()][0] || null;
      const d = destinoDe(f.it);
      if (!mat && d) { try { mat = await store.ensureMateria(d.periodo, d.disciplina, d.materia, f.it.escopo); } catch { /* sem tema */ } }
      await falhou(f.it, f.msg, mat?.id);
    }
    // Imagens e OCR desta pasta
    if (fase2.length) ui.fase(`${rot}: figuras, fotos das páginas e OCR`);
    await emParalelo(fase2, 2, async (job, j) => {
      ui.step(j, fase2.length, job.it.nome, 'extraindo as imagens');
      try {
        const got = job.got || await comRetentativa(() => job.it.getBlob()); job.got = null;
        const raw = await extrairImagens(got.blob, got.mime || job.mime, job.it.nome, e => ui.step(j, fase2.length, job.it.nome, e));
        if (!raw) return;
        const limpas = limparPaginas(raw);
        const n = Math.min(limpas.length, job.pageIds.length);
        // envia as imagens de 4 páginas ao mesmo tempo e grava todas as páginas do arquivo num pedido só
        const linhas = await emParalelo([...Array(n).keys()], 4, async k => {
          const p = limpas[k];
          const imagem = raw[k].imagemBlob ? await store.saveImage(raw[k].imagemBlob) : null;
          const figuras = []; for (const b of raw[k].figBlobs || []) figuras.push(await store.saveImage(b));
          return { id: job.pageIds[k], documento_id: job.docId, materia_id: job.mid, n: k + 1, titulo: p.titulo || null, texto: p.texto,
            texto_norm: norm((p.titulo || '') + ' ' + p.texto), imagem, figuras };
        });
        await store.updatePaginas(linhas);
      } catch (e) { console.error(e); ui.log(`Erro nas imagens de ${job.it.nome}: ${e.message}`, true); await falhou(job.it, 'Imagens não processadas: ' + e.message, job.mid); }
    });
    // Arquivo que cobre várias áreas da lista: cada parte vai para o tema da sua área
    for (const x of novosDocs) {
      try {
        const temas = await separarDocumento(x.doc, x.paginas, x.mat, { profunda: x.profunda && comIA }); if (!temas) continue;
        for (const t of temas) { tocadas.set(t.id, t); tocadasGrupo.set(t.id, t); }
        if (temas.apagado) { tocadas.delete(x.mat.id); tocadasGrupo.delete(x.mat.id); }
        ui.log(`${x.doc.nome}: tinha várias áreas da lista e foi separado em ${plural(temas.length, 'tema', 'temas')} (${temas.map(t => t.disciplina).join(', ')}).`);
      } catch (e) { console.error(e); ui.log(`Não consegui separar ${x.doc.nome} por área: ${e.message}`, true); }
    }
    // Base automática (questões de prova do material) e organização pela IA: o tema é publicado quando a IA termina.
    // A IA trabalha em segundo plano (até 3 temas ao mesmo tempo) enquanto as próximas pastas são lidas.
    const temasTexto = [...tocadasGrupo.entries()].filter(([, m]) => !m._soMidia);
    for (const [mid] of temasTexto) { try { await comRetentativa(() => gerarConteudo(mid), 3); } catch (e) { console.error(e); } }
    // mesmo tema em duas pastas: a segunda rodada espera a primeira (e só faz algo se chegou material novo)
    for (const [mid, mat] of temasTexto) { const t = (iaPorTema.get(mid) || Promise.resolve()).then(() => vagaIA(() => publicarTemaIA(mid, mat))); iaPorTema.set(mid, t); iaTarefas.push(t); }
  }
  async function publicarTemaIA(mid, mat) {
    {
      const carregando = (await store.midiasDoTema(mid).catch(() => [])).filter(m => m.status === 'fila' || m.status === 'processando').length;
      if (carregando) {
        res.aguardando.push(mat); ui.espera?.(mat);
        ui.log(`${mat.materia}: será publicado completo quando ${carregando > 1 ? `as ${carregando} transcrições terminarem` : 'a transcrição terminar'}.`);
      } else if (comIA) {
        try {
          await melhorarComIA(mid, e => ui.ia?.(mat.materia, e), { baseFeita: true });
          res.aguardando = res.aguardando.filter(x => x.id !== mid);
          if (!res.publicados.some(x => x.id === mid)) { res.publicados.push(mat); ui.pronto(mat); ui.log(`Publicado para a turma: ${mat.materia}`); }
        } catch (e) {
          console.error(e); ui.log(`IA em ${mat.materia}: ${e.message}`, true); res.aguardando.push(mat); ui.espera?.(mat);
          if (e.cota) { comIA = false; ui.log('A cota gratuita da IA acabou por agora. As próximas pastas são lidas e guardadas, e a IA termina depois (painel de Administração).', true); }
        }
      } else { res.aguardando.push(mat); ui.espera?.(mat); }
      ui.ia?.(mat.materia, null);
    }
  }
  await stopOcr();
  if (iaTarefas.length) ui.fase('Leitura terminada. A IA está terminando de organizar e publicar os temas…');
  await Promise.all(iaTarefas);
  res.materias = [...tocadas.values()].map(m => { const { _soMidia, ...r } = m; return r; });
  return res;
}

/* ===================== Separação: conteúdo x questões ===================== */
const RE_INICIO_QUESTOES = /^(caderno de exerc[ií]cios|quest[õo]es da apostila|exerc[ií]cios( de fixa[çc][ãa]o)?|quest[õo]es comentadas|banco de quest[õo]es|gabaritos?|coment[áa]rios da equipe)/i;
const RE_CAB_QUESTAO = /^(\d{1,3})\s*[-–—]\s*((?:19|20)\d{2}\b.*)$/;
const RE_FIG = /^\[\[FIG:(\d+)\]\]$/;
const ehTituloCaixaAlta = t => t.length >= 4 && t.length <= 80 && /[A-ZÀ-Ý]{3}/.test(t) && !/[a-zà-ÿ]/.test(t) && !/^[A-E]\)/.test(t) && !RE_FIG.test(t);
function ehPaginaDeQuestoes(p) {
  const t = p.texto || '';
  const alts = (t.match(/^\s*\(?[a-eA-E]\s*[).]\s*/gm) || []).length;
  const cabs = t.split('\n').filter(l => RE_CAB_QUESTAO.test(l.trim())).length;
  return alts >= 3 || cabs >= 2 || RE_INICIO_QUESTOES.test(String(p.titulo || '').trim());
}
function separarConteudo(pages, docs) {
  const ordem = new Map(docs.map((d, i) => [d.id, i]));
  const ord = [...pages].sort((a, b) => (ordem.get(a.documento_id) ?? 0) - (ordem.get(b.documento_id) ?? 0) || a.n - b.n);
  const conteudo = [], questoes = []; const emQuestoes = new Set();
  for (const p of ord) {
    if (p.html && !p.texto) { conteudo.push({ pagina: p, texto: p.texto || '' }); continue; }
    if (emQuestoes.has(p.documento_id)) { questoes.push({ pagina: p, texto: p.texto || '' }); continue; }
    const linhas = String(p.texto || '').split('\n');
    const corte = linhas.findIndex(l => RE_INICIO_QUESTOES.test(l.trim()) && l.trim().length < 60);
    if (corte < 0 && ehPaginaDeQuestoes(p)) { questoes.push({ pagina: p, texto: p.texto || '' }); continue; }
    if (corte >= 0) {
      if (corte > 0) conteudo.push({ pagina: p, texto: linhas.slice(0, corte).join('\n') });
      questoes.push({ pagina: p, texto: linhas.slice(corte).join('\n') });
      emQuestoes.add(p.documento_id);
    } else conteudo.push({ pagina: p, texto: p.texto || '' });
  }
  return { conteudo, questoes };
}

/* ===================== Análise do texto (base para resumo, flashcards e lacunas) ===================== */
const termRe = t => new RegExp('(?<![\\p{L}\\p{N}])' + escRe(t) + '(?![\\p{L}\\p{N}])', 'iu');
const SECOES = [
  ['DEFINIÇÃO', /\b(é definid|são definid|define-se|defini[çc][ãa]o|consiste em|caracteriza-se|corresponde a|denomina-se|conceito|é chamad|s[ãa]o chamad)|^(a|o|as|os)\s+[^,.;:]{3,60}?\s+(é|são)\s+(a|o|as|os|um|uma)\s+(?!mais\b|menos\b|principal|maior|menor|primeir|[úu]nic)/i],
  ['EPIDEMIOLOGIA', /(epidemiolog|incid[êe]ncia|preval[êe]ncia|mais comum|mais frequente|\d+[,.]?\d*\s?%)/i],
  ['ETIOLOGIA E FATORES DE RISCO', /(etiolog|causad[oa]s? (por|pel)|principais causas|fatores? de risco|predisp|desencade)/i],
  ['FISIOPATOLOGIA', /(fisiopatolog|mecanismo|despolariza|repolariza|vetor|condu[çc][ãa]o do est[íi]mulo|potencial de a[çc][ãa]o)/i],
  ['QUADRO CLÍNICO', /(sintoma|sinais cl[íi]nicos|quadro cl[íi]nico|manifesta[çc]|apresenta-se|s[íi]ncope|palpita[çc]|dispneia|dor tor[áa]cica)/i],
  ['CRITÉRIOS DIAGNÓSTICOS', /(crit[ée]rios?)/i],
  ['DIAGNÓSTICO', /(diagn[óo]stic|padr[ãa]o|achados?|reconhec|identific)/i],
  ['CLASSIFICAÇÃO', /(classifica|tipos? de|graus?|est[áa]gios?|subtipos?|primeiro grau|segundo grau|terceiro grau)/i],
  ['EXAMES COMPLEMENTARES', /(exames?|eletrocardiograma|\becg\b|laborat|radiograf|ecocardiograma|dosagem|tomografia|resson[âa]ncia|holter)/i],
  ['COMPLICAÇÕES', /(complica[çc]|evolui para|morte s[úu]bita|sequela)/i],
  ['DIAGNÓSTICOS DIFERENCIAIS', /(diferencia|confund|simula|diferente d[oa]s?)/i],
  ['PROGNÓSTICO', /(progn[óo]stic|mortalidade|sobrevida)/i],
  ['TRATAMENTO', /(tratamento|conduta|terap|droga|medica[çc]|\bdose|cardiovers|marca-?passo|cirurgi|primeira (linha|escolha)|segunda (linha|escolha)|atropina|adrenalina|amiodarona)/i],
  ['QUANDO INTERNAR', /(internar|interna[çc][ãa]o|\buti\b|hospitaliza)/i],
];
function analisar(segs) {
  const N = segs.length || 1; const tf = new Map(), df = new Map(), forms = new Map(); const sents = [];
  segs.forEach((seg, si) => {
    const seen = new Set();
    for (const [k, w] of termKeys((seg.pagina.titulo || '') + '\n' + seg.texto.replace(/\[\[FIG:\d+\]\]/g, ''))) {
      tf.set(k, (tf.get(k) || 0) + 1);
      if (!seen.has(k)) { seen.add(k); df.set(k, (df.get(k) || 0) + 1); }
      if (!forms.has(k)) forms.set(k, new Map());
      forms.get(k).set(w, (forms.get(k).get(w) || 0) + 1);
    }
    const linhas = joinLines(seg.texto).split('\n');
    let subtema = seg.pagina.titulo || null;
    const marcadores = [];
    linhas.forEach((l, li) => { const m = l.trim().match(RE_FIG); if (m) marcadores.push({ li, n: +m[1] }); });
    linhas.forEach((l, li) => {
      const t = l.trim();
      if (ehTituloCaixaAlta(t)) { subtema = t; return; }
      if (RE_FIG.test(t)) return;
      const limpo = t.replace(/^\s*(?:[•●▪◦\-–*]|\d{1,2}[.)])\s+/, '');
      limpo.split(/(?<=[.!?;])\s+(?=[A-ZÀ-Ý0-9“"(])/).forEach(s => {
        s = s.trim();
        if (s.length >= 30 && s.length <= 420) sents.push({ texto: s, pagina: seg.pagina, si, li, subtema, figsPerto: marcadores.filter(m => Math.abs(m.li - li) <= 3) });
      });
    });
  });
  const display = k => [...forms.get(k).entries()].sort((a, b) => b[1] - a[1] || (a[0] === a[0].toLowerCase() ? -1 : 1))[0][0];
  const termos = [...tf.keys()].filter(k => tf.get(k) >= 2)
    .map(k => ({ k, termo: display(k), freq: tf.get(k), df: df.get(k), generico: N >= 3 && df.get(k) / N > 0.6, bigram: k.includes(' '),
      score: tf.get(k) * Math.log(1 + N / df.get(k)) * (k.includes(' ') ? 1.6 : 1) }))
    .sort((a, b) => b.score - a.score).slice(0, 200);
  const termMap = new Map(termos.map(t => [t.k, t]));
  const destaques = new Set(segs.flatMap(s => (s.pagina.destaques || []).map(norm)));
  for (const s of sents) {
    const keys = termKeys(s.texto); let sc = 0; const found = new Map();
    for (const [k] of keys) { const t = termMap.get(k); if (t) { sc += t.score; found.set(k, t); } }
    sc = sc / Math.sqrt(keys.length + 4);
    const sn = norm(s.texto);
    for (const d of destaques) if (d.length > 3 && sn.includes(d)) { sc *= 1.3; break; }
    if (/\d/.test(s.texto)) sc *= 1.1;
    s.secao = (SECOES.find(([, re]) => re.test(s.texto)) || [null])[0];
    if (s.secao) sc *= 1.25;
    s.score = sc; s.termos = [...found.values()].sort((a, b) => b.score - a.score);
  }
  return { sents, termos, segs };
}
function termoParaLacuna(s, evitar = new Set()) {
  return [...s.termos].filter(t => !t.generico && !evitar.has(t.k) && termRe(t.termo).test(s.texto))
    .sort((a, b) => (b.bigram - a.bigram) || b.score - a.score)[0] || null;
}

/* ===================== Resumo estruturado (versão por código) ===================== */
function montarResumo(an) {
  const secoes = [];
  const usados = new Set();
  const porSecao = groupBy(an.sents.filter(s => s.secao), s => s.secao);
  for (const [nome] of SECOES) {
    const lista = porSecao.get(nome) || [];
    const escolhidas = [...lista].sort((a, b) => b.score - a.score)
      .filter((s, i, arr) => arr.findIndex(x => norm(x.texto) === norm(s.texto)) === i).slice(0, 9)
      .sort((a, b) => a.si - b.si || a.li - b.li);
    if (!escolhidas.length) continue;
    escolhidas.forEach(s => usados.add(s));
    const figuras = []; const vistas = new Set();
    for (const s of escolhidas) for (const f of s.figsPerto) {
      const k = s.pagina.id + ':' + f.n; if (vistas.has(k) || figuras.length >= 3) continue;
      vistas.add(k); figuras.push({ pagina_id: s.pagina.id, n: f.n });
    }
    secoes.push({ titulo: nome, pontos: escolhidas.map(s => ({ texto: s.texto, pagina_id: s.pagina.id })), figuras });
  }
  const outros = an.sents.filter(s => !s.secao && !usados.has(s)).sort((a, b) => b.score - a.score)
    .filter((s, i, arr) => arr.findIndex(x => norm(x.texto) === norm(s.texto)) === i).slice(0, 10)
    .sort((a, b) => a.si - b.si || a.li - b.li);
  if (outros.length) secoes.push({ titulo: 'OUTROS PONTOS IMPORTANTES', pontos: outros.map(s => ({ texto: s.texto, pagina_id: s.pagina.id })), figuras: [] });
  return { versao: 3, geradoEm: nowIso(), paginas: new Set(an.segs.map(s => s.pagina.id)).size, secoes };
}

/* ===================== Flashcards (versão por código) ===================== */
const SUJEITO_RUIM = /^(a |o |as |os )?(escolha|conduta|resposta|alternativa|quest[ãa]o|letra|op[çc][ãa]o|melhor|primeira|segunda|mesma|maioria|principal|ideia|isso|isto|este|esta|esse|essa|ele|ela|eles|elas|que|quando|onde|se|n[ãa]o|tamb[ée]m|ainda|j[áa]|aqui|ali|nesse caso|neste caso|o ideal|o objetivo|o importante)\b/i;
const VERSO_RUIM = /\b(letra [a-e]\b|alternativa|incorret|corret[ao]s?\b|quest[ãa]o|gabarito|banca)/i;
const CAB_GENERICO = /^(resumindo|resumo|observa[çc][ãa]o|obs|aten[çc][ãa]o|importante|dica|exemplo|figura|tabela|lembre-se|nota)\b/i;
function gerarFlashcards(an) {
  const cards = []; const seen = new Set();
  const add = (frente, verso, pagina_id, subtema) => {
    frente = frente.replace(/\s+/g, ' ').trim(); verso = verso.replace(/[ \t]+/g, ' ').replace(/[.;]+$/, '').trim();
    const k = norm(frente);
    if (!frente || !verso || seen.has(k) || verso.length < 3 || verso.length > 420 || VERSO_RUIM.test(verso) || VERSO_RUIM.test(frente)) return;
    seen.add(k); cards.push({ frente, verso: verso.charAt(0).toUpperCase() + verso.slice(1), pagina_id, extras: { subtema: subtema || null } });
  };
  const termosBons = new Set(an.termos.filter(t => !t.generico).map(t => t.k));
  // 1) Blocos "título + tópicos" (ex.: "Rotação horária:" seguida de 3 tópicos)
  for (const seg of an.segs) {
    const linhas = joinLines(seg.texto).split('\n').map(l => l.trim()).filter(l => l && !RE_FIG.test(l));
    let subtema = seg.pagina.titulo || null;
    for (let i = 0; i < linhas.length; i++) {
      const l = linhas[i];
      if (ehTituloCaixaAlta(l)) { subtema = l; continue; }
      const bullets = [];
      for (let j = i + 1; j < linhas.length && /^[•●▪◦\-–*]\s+/.test(linhas[j]); j++) bullets.push(linhas[j].replace(/^[•●▪◦\-–*]\s+/, '').replace(/[;.]$/, ''));
      if (bullets.length >= 2 && bullets.length <= 7 && l.length <= 110 && !/^[•●▪◦\-–*]/.test(l) && !CAB_GENERICO.test(l)) {
        const tit = l.replace(/[:.]$/, '').trim();
        add(`Quais são as características de: ${tit}?`, bullets.map(b => '• ' + b).join('\n'), seg.pagina.id, subtema);
        i += bullets.length;
      }
    }
  }
  // 2) Definições ("X é ...", "X consiste em ...")
  const defRe = /^((?:a|o|as|os)\s+)?([A-Za-zÀ-ÿ0-9][^.:;,]{2,60}?)\s+(é|são|consiste em|consistem em|caracteriza-se por|caracterizam-se por|define-se como|corresponde a|correspondem a)\s+(.{8,260})$/i;
  const superlativo = /^(?:(?:a|o|as|os)\s+)?(mais|menos|principal|principais|maior|menor|[úu]nica|[úu]nico)\b/i;
  for (const s of [...an.sents].sort((a, b) => b.score - a.score)) {
    if (s.texto.endsWith('?')) continue;
    const m = s.texto.replace(/[.;]+$/, '').match(defRe); if (!m) continue;
    const art = (m[1] || '').toLowerCase(); const subj = m[2].trim(); const v = m[3]; const resto = m[4].trim();
    if (SUJEITO_RUIM.test(art + subj) || subj.split(/\s+/).length > 6) continue;
    const sk = termKeys(subj).map(([k]) => k);
    if (!sk.some(k => termosBons.has(k)) && !/^[A-ZÀ-Ý]/.test(subj)) continue;
    const S = art + subj.charAt(0).toLowerCase() + subj.slice(1);
    if (/^(é|são)$/i.test(v) && superlativo.test(resto)) {
      const nucleo = subj.split(/\s+/)[0].toLowerCase();
      add(`${v.toLowerCase() === 'são' ? 'Quais' : 'Qual'} ${nucleo} ${v.toLowerCase()} ${resto}?`, subj, s.pagina.id, s.subtema);
    } else {
      const q = /^é$/i.test(v) ? `O que é ${S}?` : /^são$/i.test(v) ? `O que são ${S}?` : /consiste/i.test(v) ? `Em que ${/consistem/i.test(v) ? 'consistem' : 'consiste'} ${S}?`

    for (const line of joinLines(seg.texto).split('\n')) {
      const t = line.trim(); if (ehTituloCaixaAlta(t)) { subtema = t; continue; }
      const m = t.replace(/^[•●▪◦\-–*]\s*/, '').match(/^([^:]{3,48}):\s+(.{6,240})$/); if (!m) continue;
      if (CAB_GENERICO.test(m[1].trim()) || /^(obs|nota|fonte|ref|http|resposta|gabarito)/i.test(m[1].trim())) continue;
      add(`${m[1].trim()}${subtema && !norm(m[1]).includes(norm(subtema)) ? ` (${subtema.slice(0, 50)})` : ''}`, m[2], seg.pagina.id, subtema);

  let lac = 0;
  for (const s of [...an.sents].sort((a, b) => b.score - a.score)) {

    const t = termoParaLacuna(s); if (!t) continue;
    const frente = s.texto.replace(termRe(t.termo), '_____'); if (frente.length < 40) continue;
    const antes = cards.length; add(frente, t.termo, s.pagina.id, s.subtema); if (cards.length > antes) lac++;
  }
  return cards.slice(0, 140);
}

/* ===================== Questões das provas e apostilas ===================== */
function juntarParagrafos(linhas) {

  const porDoc = groupBy(segQ, s => s.pagina.documento_id);

        else if (!cur.alts.length && cur.resp.length) comentarios.push({ ...cur, grade });

      const cab = t.match(RE_CAB_QUESTAO);

      if (cab || (num2 && (!cur || cur.alts.length >= 2 || modo === 'resp' || modo === 'coment'))) {

        if (cab) { const resto = t.split(/[»›]/).slice(1).join(' ').trim(); if (resto) { cur.resp.push(resto); modo = 'coment'; } else modo = 'enun'; }
        else { cur.enun.push(num2[2]); modo = 'enun'; }

      if (ehTituloCaixaAlta(t) || RE_INICIO_QUESTOES.test(t)) {

        if (corte >= 0) { cur.resp.push(txt.slice(corte).replace(/^\s*R\.\s*/, '')); txt = txt.slice(0, corte); modo = 'resp'; } else modo = 'alts';

      if (rm && cur.alts.length >= 2) { cur.resp.push(rm[2]); modo = 'resp'; continue; }
      if (modo === 'enun') cur.enun.push(t);
      else if (modo === 'alts') {
        const last = cur.alts[cur.alts.length - 1];
        const corteR = t.search(/(^|\s+)R\.\s+/);
        if (corteR >= 0) {
          const antes = t.slice(0, corteR).trim();
          if (antes) last.texto = last.texto ? last.texto + ' ' + antes : antes;
          cur.resp.push(t.slice(corteR).replace(/^\s*R\.\s*/, '')); modo = 'resp';
        } else if (!last.texto) last.texto = t;
        else if (t.length < 200 && !/[.?!]$/.test(last.texto)) last.texto += ' ' + t;
        else { cur.resp.push(t); modo = 'resp'; }

    const item = { texto: juntarParagrafos(c.resp), gabarito: g, pid: c.pid };
    mapaCom.set(c.num + '|' + chaveBanca(c.banca), item);
    if (!porNum.has(c.num)) porNum.set(c.num, []); porNum.get(c.num).push(item);

  const termosPag = segConteudo.map(s => ({ id: s.pagina.id, set: new Set(termKeys(s.texto).map(([k]) => k)) }));
  const genericos = new Set(an.termos.filter(t => t.generico).map(t => t.k));

    if (!gab || !just) {
      const c = (q.banca && mapaCom.get(q.num + '|' + chaveBanca(q.banca))) || (!q.banca && porNum.get(q.num)?.length === 1 ? porNum.get(q.num)[0] : null);
      if (c) { just = just || c.texto; gab = gab || c.gabarito; fonteCom = c.pid; }
    }
    if (gab && !q.alts.some(a => a.letra === gab)) gab = null;
    const enunciado = juntarParagrafos(q.enun).trim();
    return {
      enunciado, alternativas: q.alts, gabarito: gab, justificativa: just || '', origem: 'PROVA', pagina_id: q.pid,
      extras: { banca: q.banca, figuras: q.figs, comentario_pagina: fonteCom, conteudo_pagina: melhorConteudo(enunciado + '\n' + just) },
    };
  });
}
function gerarLacunas(an, limite = 15) {
  const out = []; const usados = new Set();
  const pool = an.termos.slice(0, 80);
  for (const s of [...an.sents].sort((a, b) => b.score - a.score)) {
    if (out.length >= limite) break;
    if (s.texto.length < 50 || s.texto.length > 300 || s.texto.endsWith('?') || s.score <= 0 || !s.secao) continue;
    const t = termoParaLacuna(s, usados); if (!t) continue;
    const sn = norm(s.texto); const tw = t.k.split(' ');
    const distr = shuffle(pool.filter(o => o.k !== t.k && !o.generico && o.bigram === t.bigram && !sn.includes(o.k) && !o.k.split(' ').some(w => tw.includes(w))
      && o.termo.length >= t.termo.length * 0.5 && o.termo.length <= t.termo.length * 1.8)).slice(0, 3);
    if (distr.length < 3) continue;
    usados.add(t.k);
    const opts = shuffle([t, ...distr]);
    out.push({ enunciado: `Complete a lacuna de acordo com o material:\n“${s.texto.replace(termRe(t.termo), '_____')}”`,
      alternativas: opts.map((o, i) => ({ letra: 'abcd'[i], texto: o.termo })), gabarito: 'abcd'[opts.indexOf(t)],
      justificativa: `Trecho do material: “${s.texto}”`, origem: 'LACUNA', pagina_id: s.pagina.id,

/* Identificador fixo calculado do conteúdo: o progresso do aluno sobrevive quando o material é gerado de novo */

const unicosPorId = arr => arr.filter((x, i, a) => a.findIndex(y => y.id === x.id) === i);

        ? [...groupBy(xs, colecaoDe)].sort((a, b) => cmpNatural(a[0], b[0])).map(([c, ys]) => no('C:' + c, c, ys.length, () => esps(ys, 'faculdade|' + c))).join('')
        : esps(xs, k + '|'));
    }).join('');
  },
};

/* ============================ Revisão espaçada dos flashcards ============================
   Cada card guarda no progresso quando volta (prox) e o intervalo atual em dias (int), no campo "resposta".
   Errei: volta em 10 minutos. Quase: volta amanhã. Acertei: o intervalo cresce (4 dias, depois cerca de 2,5 vezes).
   Cards marcados antes da revisão espaçada: "sei esse" volta 4 dias depois da marcação; "rever" já está vencido. */
const DIA_MS = 86400000;
const SRS = {
  NOVOS_POR_DIA: 20,
  dados(r) {
    if (!r) return null;
    try { const j = JSON.parse(r.resposta || ''); if (j && j.prox) return { prox: Date.parse(j.prox) || 0, int: Number(j.int) || 0 }; } catch (e) { /* formato antigo */ }
    const t = Date.parse(r.atualizado_em || 0) || 0;
    return r.estado === 'sei' ? { prox: t + 4 * DIA_MS, int: 4 } : { prox: t, int: 0 };
  },
  depois(r, nota) {
    const int0 = this.dados(r)?.int || 0;
    if (nota === 'errei') return { prox: Date.now() + 10 * 60000, int: 0 };
    const int = nota === 'quase' ? (int0 < 2 ? 1 : Math.max(1, Math.round(int0 * 1.2))) : (int0 < 1 ? 4 : Math.min(180, Math.round(int0 * 2.5)));
    return { prox: Date.now() + int * DIA_MS, int };
  },
  rotulo(r, nota) {
    if (nota === 'errei') return 'volta em 10 min';
    const d = this.depois(r, nota).int;
    return d === 1 ? 'volta amanhã' : d < 31 ? `volta em ${d} dias` : `volta em ${Math.round(d / 30)} ${Math.round(d / 30) === 1 ? 'mês' : 'meses'}`;
  },
  vencido(r, agora = Date.now()) { const d = this.dados(r); return !!d && d.prox <= agora; },
  async marcar(card, nota) {
    const r = Progresso.get('fc', card.id); const d = this.depois(r, nota);
    const estado = nota === 'errei' ? 'rever' : nota === 'quase' ? 'quase' : 'sei';
    await Progresso.registrar('fc', card.id, card.materia_id, { estado, acertou: nota === 'errei' ? false : nota === 'acertei' ? true : null,
      resposta: JSON.stringify({ prox: new Date(d.prox).toISOString(), int: d.int }) });
    Hoje.cache = null; atualizarContadores();
  },
  // novos já começados hoje (contam no limite de novos do dia)
  novosHoje() { const hoje = new Date().toDateString(); return Progresso.todos('fc').filter(r => (r.vezes || 1) === 1 && new Date(r.atualizado_em).toDateString() === hoje).length; },
};
const botoesSRS = (r, acao) => [['errei', 'Errei', 'ruim', 1], ['quase', 'Quase', '', 2], ['acertei', 'Acertei', 'bom', 3]].map(([k, l, cls, n]) =>
  `<button class="btn srs ${cls}" data-action="${acao}" data-v="${k}"><b>${l}</b><small>${SRS.rotulo(r, k)}</small><kbd>${n}</kbd></button>`).join('');

/* ============================ Tela Hoje (início) ============================
   Revisão do dia por especialidade, onde a pessoa parou de ler e o que chegou de novo no acervo. */
const Hoje = {
  cache: null,
  // cards de temas publicados, o que vence hoje e o que é novo (com limite por dia)
  async fila(forcar) {
    if (this.cache && !forcar && Date.now() - this.cache.em < 5 * 60000) return this.cache;
    const [cards, mats, prontos] = await Promise.all([App.store.cardsLeves(), materiasCache(), App.store.temasProntos(), Progresso.carregar()]);
    const meta = new Map(mats.map(m => [m.id, m])); const agora = Date.now();
    const pub = cards.filter(c => prontos.has(c.materia_id) && meta.has(c.materia_id));
    const vencidos = pub.filter(c => SRS.vencido(Progresso.get('fc', c.id), agora))
      .sort((a, b) => SRS.dados(Progresso.get('fc', a.id)).prox - SRS.dados(Progresso.get('fc', b.id)).prox);
    const vagas = Math.max(0, SRS.NOVOS_POR_DIA - SRS.novosHoje());
    const novos = pub.filter(c => !Progresso.get('fc', c.id)).slice(0, vagas);
    this.cache = { em: Date.now(), vencidos, novos, meta, prontos, total: pub.length };
    return this.cache;
  },
  async contagem() { try { const f = await this.fila(); return f.vencidos.length + f.novos.length; } catch (e) { return 0; } },
};
function quandoCurto(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const hoje = new Date(); const ontem = new Date(Date.now() - DIA_MS);
  if (d.toDateString() === hoje.toDateString()) return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === ontem.toDateString()) return 'ontem';
  return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' }).replace('.', '').replace(' de ', ' ');
}

  // continuar lendo: onde parou na apostila ou no resumo, e temas com questões começadas

/* Novidades: monta as frases a partir do que o servidor devolve (sem nomes de pessoas) */
function frasesNovidades(d, meta, prontos) {
  const out = []; const link = mid => { const m = meta.get(mid); return m ? `<a href="#/m/${m.id}">${esc(m.materia)}</a>` : null; };
  for (const r of d.publicados) { const l = link(r.materia_id); if (l && r.em) out.push({ em: r.em, html: `${l} foi publicado para a turma.` }); }
  const porTemaDia = groupBy(d.docs, x => x.materia_id + '|' + new Date(x.criado_em).toDateString());
  for (const [k, xs] of porTemaDia) {
    const mid = k.split('|')[0]; const l = link(mid); if (!l) continue;
    out.push({ em: xs.map(x => x.criado_em).sort().at(-1), html: `Chegou ${xs.length > 1 ? `material novo (${xs.length} arquivos)` : 'material novo'} em ${l}${prontos.has(mid) ? '.' : ', ainda sendo preparado.'}` });
  }
  for (const v of d.versoes) { const l = link(v.materia_id); if (l) out.push({ em: v.criado_em, html: `${l} ganhou uma versão nova${v.nome ? `: “${esc(v.nome)}”` : ''}.` }); }
  for (const [tipo, rows] of [['questões', d.questoes], ['flashcards', d.flashcards]]) {
    for (const [k, xs] of groupBy(rows, x => x.materia_id + '|' + new Date(x.criado_em).toDateString())) {
      const l = link(k.split('|')[0]); if (l && prontos.has(k.split('|')[0])) out.push({ em: xs.map(x => x.criado_em).sort().at(-1), html: `A turma criou ${xs.length} ${xs.length === 1 ? tipo.replace('ões', 'ão').replace('flashcards', 'flashcard') : tipo} em ${l}.` });
    }
  }
  return out.sort((a, b) => String(b.em).localeCompare(String(a.em)));
}

/* ============================ Revisar (sessão de flashcards do dia) ============================ */
const REV = { fila: [], i: 0, virado: false, cards: new Map(), meta: new Map(), feitos: { errei: 0, quase: 0, acertei: 0 }, esp: '' };
async function viewRevisar(view, stale, esp) {
  view.innerHTML = '<p class="notice">Preparando a revisão…</p>';
  const f = await Hoje.fila(true); if (stale()) return;
  const espDe = c => f.meta.get(c.materia_id)?.periodo || 'Outros';
  let vencidos = f.vencidos, novos = f.novos;
  if (esp) { vencidos = vencidos.filter(c => espDe(c) === esp); novos = novos.filter(c => espDe(c) === esp); }
  // começa pela especialidade com mais cards vencidos
  const porEsp = groupBy(vencidos, espDe); const ordemEsp = [...porEsp.keys()].sort((a, b) => porEsp.get(b).length - porEsp.get(a).length);
  const fila = [...ordemEsp.flatMap(e => porEsp.get(e)), ...novos];
  const ids = fila.map(c => c.id);
  const completos = new Map((await App.store.flashcardsPorIds(ids.slice(0, 400)).catch(() => [])).map(c => [c.id, c])); if (stale()) return;
  Object.assign(REV, { fila: ids.filter(id => completos.has(id)), i: 0, virado: false, cards: completos, meta: f.meta, feitos: { errei: 0, quase: 0, acertei: 0 }, esp: esp || '' });
  const espTxt = ordemEsp.length ? ` Começando por ${ordemEsp[0]}.` : '';
  view.innerHTML = `<p class="crumbs"><a href="#/">Hoje</a></p><h1>Revisar${esp ? `: ${esc(esp)}` : ''}</h1>
    <p class="lede">${!REV.fila.length ? '' : vencidos.length ? `${plural(vencidos.length, 'card vencido', 'cards vencidos')}${novos.length ? ` e ${plural(novos.length, 'novo', 'novos')}` : ''}${ordemEsp.length > 1 ? ` de ${ordemEsp.length} especialidades` : ''}.${espTxt}`
      : `${plural(novos.length, 'card novo', 'cards novos')} para hoje. Depois de responder, cada card volta no dia certo de revisar.`}</p>
    <div id="revPalco"></div>`;
  revRender();
}
function revRender() {
  const box = $('#revPalco'); if (!box) return;
  if (REV.i >= REV.fila.length) {
    const t = REV.feitos.errei + REV.feitos.quase + REV.feitos.acertei;
    box.innerHTML = `<div class="empty rev-fim"><h2>${t ? 'Fim da revisão' : 'Nada para revisar agora'}</h2>
      ${t ? `<p>${plural(t, 'card revisado', 'cards revisados')}: ${REV.feitos.acertei} acertei, ${REV.feitos.quase} quase, ${REV.feitos.errei} errei.</p>` : `<p>Os cards voltam aqui no dia certo de revisar. Para estudar outros, use <a href="#/flashcards">todos os flashcards</a>.</p>`}
      <div class="row" style="justify-content:center"><button class="btn" data-action="rev-denovo">Revisar de novo</button><a class="btn primary" href="#/erradas">Fazer as questões que errei</a></div></div>`;

/* ============================ Continuar lendo: onde a pessoa parou ============================ */
const Leitura = {
  atual: null, timer: null,
  acompanhar(mat, aba, sumario) {
    this.salvarJa(); this.atual = { mat, aba, sumario: sumario || [], pct: 0, secao: null, secaoId: null, mudou: false };
    if (!App.store?.progressoSalvar) return;
    const art = document.querySelector('#tabBody .apostila, #tabBody .resumo-v3'); if (!art) return;
    this.atual.art = art; this.medir();
  },
  medir() {
    const a = this.atual; if (!a?.art?.isConnected) return;
    const box = a.art.getBoundingClientRect(); const lido = window.innerHeight - box.top;
    const pct = Math.max(0, Math.min(100, Math.round(lido / Math.max(1, box.height) * 100)));
    let sec = null;
    for (const s of a.sumario) { const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top < 140) sec = s; else if (el) break; }
    if (pct > a.pct + 2 || (sec && sec.id !== a.secaoId)) { a.pct = Math.max(a.pct, pct); if (sec) { a.secao = sec.t; a.secaoId = sec.id; } a.mudou = true; this.salvarDepois(); }
    Indice.marcar(sec?.id);
  },
  salvarDepois() { clearTimeout(this.timer); this.timer = setTimeout(() => this.salvarJa(), 6000); },
  salvarJa() {
    clearTimeout(this.timer); const a = this.atual; if (!a?.mudou || a.pct < 3) return; a.mudou = false;
    const ant = Progresso.get('leitura', a.mat.id);
    const row = { tipo: 'leitura', item_id: a.mat.id, materia_id: a.mat.id, acertou: null, estado: a.aba, vezes: (ant?.vezes || 0) + 1, atualizado_em: nowIso(),
      resposta: JSON.stringify({ pct: a.pct, secao: a.secao, secaoId: a.secaoId }) };
    if (Progresso.mapa) Progresso.mapa.set('leitura:' + a.mat.id, row);
    App.store.progressoSalvar(row).catch(e => console.warn(e));
  },
};
let medirAgendado = false;
window.addEventListener('scroll', () => { if (medirAgendado || !Leitura.atual) return; medirAgendado = true; setTimeout(() => { medirAgendado = false; Leitura.medir(); }, 400); }, { passive: true });
window.addEventListener('hashchange', () => { Leitura.salvarJa(); Leitura.atual = null; });
window.addEventListener('pagehide', () => Leitura.salvarJa());

const TABS = [['conteudo', 'Apostila'], ['resumo', 'Resumo'], ['flashcards', 'Flashcards'], ['questoes', 'Questões'], ['original', 'Arquivos enviados'], ['ajustes', 'Ajustes']];

async function paginasLimpas(mid) {

async function viewMateria(view, id, tab, extra, stale, q) {
  const mat = await App.store.getMateria(id); if (stale()) return;
  if (!mat) { view.innerHTML = `<div class="empty"><h1>Tema não encontrado</h1><p>Ele pode ter sido removido ou reorganizado.</p><a class="btn" href="#/biblioteca">Ir para a biblioteca</a></div>`; return; }
  const [docs, cards, qsTodas, resumo] = await Promise.all([App.store.listDocumentos(id), App.store.list('flashcards', id), App.store.list('questoes', id), App.store.getResumo(id)]);
  if (stale()) return;
  await Progresso.carregar();
  const gerencia = App.store.mode === 'local' || App.store.ehAdmin();   // refazer e excluir o tema: só o administrador
  // A turma só vê os estudos depois que a IA publica a versão oficial; o administrador vê a prévia automática
  const pronto = iaPronto(resumo);
  const qsBase = pronto ? qsTodas.filter(q => q.origem !== 'LACUNA') : qsTodas;
  const versoes = pronto ? await App.store.listarVersoes(id).catch(() => []) : [];
  let vsel = versoes.find(v => v.id === App.versaoSel[id]) || null;
  const vDados = vsel ? await App.store.getVersao(vsel.id).catch(() => null) : null;
  if (stale()) return;
  if (vsel && !vDados) vsel = null;
  const { rEf, cardsEf, qsEf: qs } = aplicarVersao(vDados, resumo, cards, qsBase);
  const fechado = !pronto && !gerencia;
  const counts = fechado ? {} : { flashcards: cardsEf.length, questoes: qs.length };

/* Situação de um tema que ainda não foi publicado: o que chegou, o que ainda carrega e o que não entrou */

function figuraHtml(pagina, n, legenda) {

/* Apostila: o conteúdo inteiro, em ordem, com subtítulos, listas e figuras no lugar certo */
function montarApostila(segs, docs, mid) {
  const porDoc = groupBy(segs, s => s.pagina.documento_id);
  let html = ''; const sumario = []; let hc = 0;
  for (const doc of docs) {
    const ss = porDoc.get(doc.id); if (!ss) continue;
    html += `<h2 class="cap" id="cap-${doc.id}">${esc(doc.nome)}</h2>`; sumario.push({ id: 'cap-' + doc.id, t: doc.nome, cap: true });
    let ultimoTitulo = null;
    for (const seg of ss) {
      const p = seg.pagina;
      html += `<span class="ancora" id="p-${p.id}"></span>`;
      if (p.html && !seg.texto) { html += sanitize(limparHtml(p.html)); continue; }
      const linhas = joinLines(seg.texto).split('\n').map(l => l.trim()).filter(Boolean);
      if (p.titulo && norm(p.titulo) !== norm(ultimoTitulo || '') && norm(p.titulo) !== norm(linhas[0] || '')) {
        const id = 'h-' + (hc++); html += `<h3 id="${id}">${esc(p.titulo)}</h3>`; sumario.push({ id, t: p.titulo }); ultimoTitulo = p.titulo;
      }
      let lista = false;
      const fecharLista = () => { if (lista) { html += '</ul>'; lista = false; } };
      for (let i = 0; i < linhas.length; i++) {
        const t = linhas[i];
        const fm = t.match(RE_FIG);
        if (fm) { fecharLista(); const leg = /^figura\s*\d+/i.test(linhas[i + 1] || '') ? linhas[++i] : ''; html += figuraHtml(p, +fm[1], leg); continue; }
        if (ehTituloCaixaAlta(t)) { fecharLista(); if (norm(t) === norm(ultimoTitulo || '')) continue; const id = 'h-' + (hc++); html += `<h3 id="${id}">${esc(t)}</h3>`; sumario.push({ id, t }); ultimoTitulo = t; continue; }
        if (/^[•●▪◦\-–*]\s+/.test(t) || /^\d{1,2}[.)]\s+\S/.test(t) && t.length < 300) {
          if (!lista) { html += '<ul>'; lista = true; }
          html += `<li>${esc(t.replace(/^[•●▪◦\-–*]\s+/, ''))}</li>`; continue;
        }
        fecharLista();
        if (t.length <= 90 && /:$/.test(t)) { html += `<h4>${esc(t.replace(/:$/, ''))}</h4>`; continue; }
        if (/^figura\s*\d+\.?$/i.test(t)) continue;
        html += `<p>${esc(t)}</p>`;
      }
      fecharLista();
    }
  }
  return { html, sumario };
}

      const figs = (p.figuras || []).filter(Boolean);
      const texto = (p.texto || '').replace(/\[\[FIG:\d+\]\]/g, '').trim();
      return `<article class="pg-orig" id="p-${p.id}"><span class="pg-n">Página ${p.n}</span>${p.titulo ? `<h3>${esc(p.titulo)}</h3>` : ''}
        ${p.html && !texto ? `<div class="reading">${sanitize(limparHtml(p.html))}</div>` : `<div class="reading">${texto ? paras(texto) : '<p class="notice">Sem texto nesta página.</p>'}</div>`}
        ${figs.length ? `<div class="figs">${figs.map(r => `<img data-ref="${esc(r)}" alt="Figura da página ${p.n}">`).join('')}</div>` : ''}
        ${p.imagem ? `<button class="btn small" data-action="ver-foto" data-ref="${esc(p.imagem)}">Ver foto da página</button><div class="foto"></div>` : ''}
      </article>`;
    }).join('')}`;
  hydrateImages(body);
  if (focus) requestAnimationFrame(() => document.getElementById('p-' + focus)?.scrollIntoView({ block: 'start' }));
}

/* Resumo na ordem clínica, com figuras e link para o material */
async function renderResumo(body, mat, stale, rDado) {
  let r = rDado || await App.store.getResumo(mat.id);
  if (!r || (r.versao !== 3 && r.versao !== 4)) {
    body.innerHTML = `<p class="notice">Atualizando o resumo para o formato novo…</p>`;
    try { await gerarConteudo(mat.id); r = await App.store.getResumo(mat.id); } catch (e) { console.error(e); }
    if (stale()) return;
  }
  if (!r || !(r.secoes || []).length) {
    body.innerHTML = `<div class="empty"><p>Ainda não há resumo. Ele é montado a partir do texto de conteúdo do tema.</p><button class="btn primary" data-action="regenerar" data-id="${mat.id}">Montar resumo agora</button></div>`;
    return;
  }
  const pages = new Map((await App.store.listPaginas(mat.id)).map(p => [p.id, p])); if (stale()) return;
  const figIA = f => { const m = String(f).match(/^FIG:(\d+)\.(\d+)$/); if (m) { const pg = pages.get((r.mapa || [])[+m[1]]); return pg ? figuraHtml(pg, +m[2]) : ''; } const ref = String(f).replace(/^REF:/, ''); return /^(local|sb):/.test(ref) ? `<figure class="fig"><img data-ref="${esc(ref)}" alt="Figura do material"></figure>` : ''; };
  body.innerHTML = `<p class="notice">${r.versao === 4 ? 'Resumo organizado com IA a partir do material, em ordem lógica de estudo.' : `Resumo montado a partir de ${plural(r.paginas, 'página', 'páginas')} do conteúdo, organizado em ordem clínica. As frases vêm do próprio material.`} Toque em “ver no material” para ler o trecho completo.</p>
    <div class="resumo-v3">${r.secoes.map(s => `<section><h3>${esc(s.titulo)}</h3><ul>${s.pontos.map(p => `<li>${esc(p.texto)}${p.pagina_id ? `<a class="src" data-volta href="#/m/${mat.id}/conteudo/${p.pagina_id}">ver no material</a>` : ''}</li>`).join('')}</ul>
      ${(s.figuras || []).map(f => { const pg = pages.get(f.pagina_id); return pg ? figuraHtml(pg, f.n) : ''; }).join('')}${(s.figurasIA || []).map(figIA).join('')}</section>`).join('')}</div>`;
  hydrateImages(body);
  Leitura.acompanhar(mat, 'resumo', []);
}

/* ============================ Progresso do aluno (salvo no servidor) ============================ */
const Progresso = {
  mapa: null,
  async carregar(forcar) {
    if (this.mapa && !forcar) return;
    try { const rows = await App.store.progressoListar(); this.mapa = new Map(rows.map(r => [r.tipo + ':' + r.item_id, r])); }
    catch (e) { console.warn(e); this.mapa = this.mapa || new Map(); }
  },
  get(tipo, id) { return this.mapa?.get(tipo + ':' + id) || null; },
  todos(tipo) { return [...(this.mapa?.values() || [])].filter(r => r.tipo === tipo); },
  async registrar(tipo, id, materia_id, campos) {
    if (!this.mapa) this.mapa = new Map();
    const ant = this.get(tipo, id);
    const row = { tipo, item_id: id, materia_id, acertou: campos.acertou ?? null, resposta: campos.resposta ?? null, estado: campos.estado ?? null,
      vezes: (ant?.vezes || 0) + 1, atualizado_em: nowIso() };
    this.mapa.set(tipo + ':' + id, row);
    try { await App.store.progressoSalvar(row); await App.store.eventoSalvar({ tipo, item_id: id, materia_id, acertou: row.acertou }); }
    catch (e) { console.warn(e); toast('Não consegui salvar seu progresso agora. Tente de novo em instantes.'); }
  },
  async apagar() { await App.store.progressoApagar(); this.mapa = new Map(); },
};

/* ============================ Flashcards: um por vez, com filtros e busca ============================ */
const FCV = { escopo: null, mid: null, cards: [], meta: new Map(), f: { acv: new Set(), esp: new Set(), area: new Set(), tema: new Set(), sub: new Set(), sit: new Set() },
  busca: '', ordem: [], i: 0, virado: false, lista: false, raiz: null, filtrosAbertos: null };
function fcvNovoEscopo(escopo, mid, cards, meta) {
  if (FCV.escopo !== escopo || FCV.mid !== mid) {
    Object.assign(FCV, { escopo, mid, busca: '', i: 0, virado: false, lista: false });
    FCV.f = { acv: new Set(), esp: new Set(), area: new Set(), tema: new Set(), sub: new Set(), sit: new Set() };
    FCV.ordem = cards.map(c => c.id);
  } else {
    const ids = new Set(cards.map(c => c.id));
    FCV.ordem = FCV.ordem.filter(id => ids.has(id)).concat(cards.filter(c => !FCV.ordem.includes(c.id)).map(c => c.id));
  }
  FCV.cards = cards; FCV.meta = meta;
}
function fcvFiltrados() {
  const porId = new Map(FCV.cards.map(c => [c.id, c])); const b = norm(FCV.busca).trim();
  return FCV.ordem.map(id => porId.get(id)).filter(c => {
    if (!c) return false;
    const m = FCV.meta.get(c.materia_id) || {};
    if (FCV.f.acv.size && !FCV.f.acv.has(chaveEscopo(m))) return false;
    if (FCV.f.esp.size && !FCV.f.esp.has(m.periodo)) return false;
    if (FCV.f.area.size && !FCV.f.area.has(m.disciplina)) return false;
    if (FCV.f.tema.size && !FCV.f.tema.has(c.materia_id)) return false;
    if (FCV.f.sub.size && !FCV.f.sub.has(c.extras?.subtema || '')) return false;
    const est = Progresso.get('fc', c.id)?.estado;
    if (FCV.f.sit.has('rever') && est !== 'rever') return false;
    if (FCV.f.sit.has('novos') && est) return false;
    if (FCV.f.sit.has('hoje') && !SRS.vencido(Progresso.get('fc', c.id))) return false;
    if (FCV.f.sit.has('turma') && c.origem === 'AUTO') return false;
    if (b && !norm(c.frente + ' ' + c.verso).includes(b)) return false;
    return true;
  });
}
function chipsHtml(grupo, opcoes, sel) {
  return `<div class="chips">${opcoes.map(o => `<button class="chip" data-action="fcv-chip" data-g="${grupo}" data-v="${esc(o.v)}" aria-pressed="${sel.has(o.v)}">${esc(o.l)}<span class="count">${o.n}</span></button>`).join('')}</div>`;
}
function fcvRender() {
  const raiz = FCV.raiz; if (!raiz || !raiz.isConnected) return;
  const lista = fcvFiltrados();
  if (FCV.i >= lista.length) FCV.i = Math.max(0, lista.length - 1);
  const conta = (arr, f) => { const m = new Map(); arr.forEach(x => { const k = f(x); if (k) m.set(k, (m.get(k) || 0) + 1); }); return m; };
  let filtros = '';
  if (FCV.escopo === 'global') {
    const acv = conta(FCV.cards, c => FCV.meta.get(c.materia_id) && chaveEscopo(FCV.meta.get(c.materia_id)));
    if (acv.size > 1) filtros += `<div class="lbl">Acervo</div>${chipsHtml('acv', [...acv].sort((a, b) => cmpNatural(a[0], b[0])).map(([v, n]) => ({ v, l: v.startsWith('faculdade') ? 'Faculdade · ' + v.split('|')[1] : NOME_ACERVO[v.split('|')[0]] || v, n })), FCV.f.acv)}`;
    const base0 = FCV.cards.filter(c => !FCV.f.acv.size || FCV.f.acv.has(chaveEscopo(FCV.meta.get(c.materia_id) || {})));
    const esp = conta(base0, c => FCV.meta.get(c.materia_id)?.periodo);
    const base1 = base0.filter(c => !FCV.f.esp.size || FCV.f.esp.has(FCV.meta.get(c.materia_id)?.periodo));
    const area = conta(base1, c => FCV.meta.get(c.materia_id)?.disciplina);
    const base2 = base1.filter(c => !FCV.f.area.size || FCV.f.area.has(FCV.meta.get(c.materia_id)?.disciplina));
    const tema = conta(base2, c => c.materia_id);
    filtros += `<div class="lbl">Especialidade</div>${chipsHtml('esp', [...esp].sort((a, b) => ordemGeralPorUltimo(a[0], b[0])).map(([v, n]) => ({ v, l: v, n })), FCV.f.esp)}`;
    if (FCV.f.esp.size) filtros += `<div class="lbl">Área</div>${chipsHtml('area', [...area].sort((a, b) => ordemGeralPorUltimo(a[0], b[0])).map(([v, n]) => ({ v, l: v, n })), FCV.f.area)}`;
    if (FCV.f.esp.size) filtros += `<div class="lbl">Tema</div>${chipsHtml('tema', [...tema].map(([v, n]) => ({ v, l: FCV.meta.get(v)?.materia || '?', n })).sort((a, b) => cmpNatural(a.l, b.l)), FCV.f.tema)}`;
  } else {
    const sub = conta(FCV.cards, c => c.extras?.subtema);
    if (sub.size > 1) filtros += `<div class="lbl">Subtema</div>${chipsHtml('sub', [...sub].sort((a, b) => b[1] - a[1]).slice(0, 30).map(([v, n]) => ({ v, l: v.length > 48 ? v.slice(0, 46) + '…' : v, n })), FCV.f.sub)}`;
  }
  const nRever = FCV.cards.filter(c => Progresso.get('fc', c.id)?.estado === 'rever').length;
  const nSei = FCV.cards.filter(c => Progresso.get('fc', c.id)?.estado === 'sei').length;
  const nNovos = FCV.cards.filter(c => !Progresso.get('fc', c.id)).length;
  const nTurma = FCV.cards.filter(c => c.origem !== 'AUTO').length;
  const nHoje = FCV.cards.filter(c => SRS.vencido(Progresso.get('fc', c.id))).length;
  filtros += `<div class="lbl">Situação</div>${chipsHtml('sit', [{ v: 'hoje', l: 'Para revisar hoje', n: nHoje }, { v: 'rever', l: 'Só os que errei', n: nRever }, { v: 'novos', l: 'Ainda não vistos', n: nNovos }, { v: 'turma', l: 'Criados pela turma', n: nTurma }], FCV.f.sit)}`;
  const c = lista[FCV.i];
  const m = c ? FCV.meta.get(c.materia_id) || {} : {};
  const est = c ? Progresso.get('fc', c.id)?.estado : null;
  const palco = !lista.length ? `<div class="empty"><p>Nenhum card neste filtro.</p></div>`
    : FCV.lista ? `<ul class="fc-list">${lista.map(x => `<li><div class="q">${esc(x.frente)}</div><div class="a">${esc(x.verso)}</div>
        <div class="row">${x.origem === 'AUTO' ? 'Automático' : 'Da turma'}<span class="spacer"></span>
        <button class="btn ghost small" data-action="report" data-alvo="flashcard" data-id="${x.id}">Reportar</button>
        ${App.store.podeApagar(x) ? `<button class="btn ghost small danger" data-action="fc-del" data-id="${x.id}">Apagar</button>` : ''}</div></li>`).join('')}</ul>`
    : `<div class="fcv-barra"><i style="width:${Math.round((FCV.i + 1) / lista.length * 100)}%"></i></div>
      <div class="fcv-cont">Card ${FCV.i + 1} de ${lista.length}</div>
      <div class="fcv-card" id="fcvCard" tabindex="0" role="button" aria-label="Virar o card" data-action="fcv-virar">
        <div class="fcv-topo">${FCV.escopo === 'global' ? `<span class="tag esp">${esc(m.periodo || '')}</span><span class="tag">${esc(m.materia || '')}</span>` : ''}
          ${c.extras?.subtema ? `<span class="tag">${esc(c.extras.subtema.slice(0, 50))}</span>` : ''}
          ${c.origem !== 'AUTO' ? '<span class="tag">Da turma</span>' : ''}${est === 'rever' ? '<span class="tag prova">Errei</span>' : est === 'quase' ? '<span class="tag">Quase</span>' : est === 'sei' ? '<span class="tag esp">Acertei</span>' : ''}${SRS.vencido(Progresso.get('fc', c.id)) ? '<span class="tag">Para revisar hoje</span>' : ''}</div>
        <div class="fcv-corpo"><div class="fcv-frente">${esc(c.frente)}</div>
          ${FCV.virado ? `<div class="fcv-verso">${esc(c.verso)}</div>${c.pagina_id ? `<p style="margin:12px 0 0"><a class="src" data-volta href="#/m/${c.materia_id}/conteudo/${c.pagina_id}">ver no material</a></p>` : ''}`
            : `<div class="fcv-dica">Toque no card ou aperte espaço para ver a resposta.</div>`}</div>
      </div>
      <div class="fcv-ctrl"><button class="btn" data-action="fcv-ant" ${FCV.i === 0 ? 'disabled' : ''}>◀ Anterior</button>
        <button class="btn primary" data-action="fcv-virar">${FCV.virado ? 'Esconder resposta' : 'Virar (espaço)'}</button>
        <button class="btn" data-action="fcv-prox" ${FCV.i >= lista.length - 1 ? 'disabled' : ''}>Próximo ▶</button></div>
      <div class="srs-botoes">${botoesSRS(Progresso.get('fc', c.id), 'fcv-marca')}</div>
      <p class="kbd-dica">Atalhos no computador: espaço vira, → próximo, ← anterior, 1 errei, 2 quase, 3 acertei.</p>`;
  if (FCV.filtrosAbertos === null) FCV.filtrosAbertos = window.innerWidth >= 760;
  const ativos = FCV.f.acv.size + FCV.f.esp.size + FCV.f.area.size + FCV.f.tema.size + FCV.f.sub.size + FCV.f.sit.size;
  raiz.innerHTML = `<section class="painel-f"><details id="fcvFiltros" ${FCV.filtrosAbertos ? 'open' : ''}><summary style="cursor:pointer;font-weight:700">Filtros${ativos ? ` (${ativos} ativos)` : ''}</summary>${filtros}</details>
      <div class="lbl">Buscar</div><input class="busca" id="fcvBusca" type="search" value="${esc(FCV.busca)}" placeholder="Buscar palavra na pergunta ou na resposta…" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)">
      <div class="contagem"><span><b>${lista.length}</b> no filtro</span><span><b>${nSei}</b> acertei</span><span><b>${nRever}</b> para rever</span>
        <span class="spacer"></span>
        <button class="btn small" data-action="fcv-limpar">Limpar filtros</button><button class="btn small" data-action="fcv-emb">🔀 Embaralhar</button>
        <button class="btn small ${FCV.lista ? 'on' : ''}" data-action="fcv-lista">${FCV.lista ? 'Estudar um por vez' : 'Ver lista'}</button>
        ${FCV.escopo === 'tema' ? `<button class="btn small" data-action="fc-new" data-mid="${FCV.mid}">Criar flashcard</button>` : ''}</div>
    </section><section id="fcvPalco">${palco}</section>`;
}
function fcvVirar() {
  const card = $('#fcvCard'); if (!card) return;
  card.classList.add('virando');
  setTimeout(() => { FCV.virado = !FCV.virado; fcvRender(); }, 170);
}
async function fcvMarcar(nota) {
  const lista = fcvFiltrados(); const c = lista[FCV.i]; if (!c) return;
  await SRS.marcar(c, nota);
  const restante = fcvFiltrados();
  if (!restante.find(x => x.id === c.id)) FCV.i = Math.min(FCV.i, Math.max(0, restante.length - 1)); else if (FCV.i < restante.length - 1) FCV.i++;

}
function renderFlashcardsTema(body, mat, cards, pronto) {

/* ============================ Questões ============================ */
const QZ = { mid: null, filtro: 'todas', sit: 'todas', i: 0 };
const ORIGEM_Q = { PROVA: 'Prova / apostila', MATERIAL: 'Do material', IA: 'Criada pela IA', LACUNA: 'Gerada do material', ALUNO: 'Criada pela turma' };
function renderQuestoes(body, mat, qs, extra) {
  if (QZ.mid !== mat.id) Object.assign(QZ, { mid: mat.id, filtro: 'todas', sit: 'todas', i: 0 });
  let lista = qs.filter(q => QZ.filtro === 'todas' || (QZ.filtro === 'prova' && (q.origem === 'PROVA' || q.origem === 'MATERIAL')) || (QZ.filtro === 'ia' && q.origem === 'IA') || (QZ.filtro === 'lacuna' && q.origem === 'LACUNA') || (QZ.filtro === 'turma' && q.origem === 'ALUNO'));
  if (QZ.sit === 'erradas') lista = lista.filter(q => Progresso.get('q', q.id)?.acertou === false);
  if (QZ.sit === 'novas') lista = lista.filter(q => !Progresso.get('q', q.id));
  if (extra) { const k = lista.findIndex(q => q.id === extra); if (k < 0) { lista = qs; QZ.filtro = 'todas'; QZ.sit = 'todas'; } const k2 = lista.findIndex(q => q.id === extra); if (k2 >= 0) QZ.i = k2; }
  if (QZ.i >= lista.length) QZ.i = 0;
  CTX = { body, mat, qs, listaQ: lista, pages: CTX.mat?.id === mat.id ? CTX.pages : null };
  const resp = qs.filter(q => Progresso.get('q', q.id)?.acertou != null);
  const certas = resp.filter(q => Progresso.get('q', q.id).acertou).length;
  body.innerHTML = `
    <div class="chips">${[['todas', 'Todas'], ['prova', 'Provas e apostila'], ['ia', 'Criadas pela IA'], ['lacuna', 'Geradas do material'], ['turma', 'Da turma']].filter(([k]) => k === 'todas' || qs.some(q => ({ prova: ['PROVA', 'MATERIAL'], ia: ['IA'], lacuna: ['LACUNA'], turma: ['ALUNO'] }[k] || []).includes(q.origem))).map(([k, l]) => `<button class="chip" data-action="q-filter" data-f="${k}" aria-pressed="${k === QZ.filtro}">${l}</button>`).join('')}</div>
    <div class="row"><div class="chips" style="margin:0">${[['todas', 'Todas'], ['novas', 'Não respondidas'], ['erradas', 'Só as que errei']].map(([k, l]) => `<button class="chip" data-action="q-sit" data-f="${k}" aria-pressed="${k === QZ.sit}">${l}</button>`).join('')}</div>
      <span class="spacer"></span><button class="btn small" data-action="q-new" data-mid="${mat.id}">Criar questão</button></div>
    <p class="notice">${plural(lista.length, 'questão', 'questões')} neste filtro. Você respondeu ${resp.length} deste tema e acertou ${certas}.</p>
    <div id="qBox"></div>`;
  showQuestao();
}
async function showQuestao() {
  const box = $('#qBox'); const lista = CTX.listaQ;
  if (!lista.length) { box.innerHTML = `<div class="empty"><p>${QZ.sit === 'erradas' ? 'Nenhuma questão errada neste filtro.' : 'Nenhuma questão neste filtro.'}</p></div>`; return; }

  if ((ex.figuras || []).length && !CTX.pages) CTX.pages = new Map((await App.store.listPaginas(CTX.mat.id)).map(p => [p.id, p]));
  const figs = (ex.figuras || []).map(f => CTX.pages?.get(f.pagina_id)?.figuras?.[f.n]).filter(Boolean);
  const ant = Progresso.get('q', q.id);
  box.innerHTML = `<article class="q-card">
    <div class="q-meta"><span class="tag">Questão ${QZ.i + 1} de ${lista.length}</span>${ex.banca ? `<span class="tag prova">${esc(ex.banca)}</span>` : ''}<span class="tag">${ORIGEM_Q[q.origem] || ''}</span>
      ${ex.gabarito_ia ? '<span class="tag ia">Gabarito sugerido pela IA</span>' : ''}
      ${ant?.acertou === true ? '<span class="tag esp">Você acertou</span>' : ant?.acertou === false ? '<span class="tag prova">Você errou</span>' : ''}</div>
    <div class="q-enun">${String(q.enunciado || '').split(/\n+/).filter(Boolean).map(l => `<p>${esc(l)}</p>`).join('')}</div>

function linksDaQuestao(q) {

  if (q.pagina_id) out.push(`<a class="btn small" data-volta href="#/m/${mid}/original/${q.pagina_id}">Ver a questão no arquivo</a>`);
  if (ex.comentario_pagina) out.push(`<a class="btn small" data-volta href="#/m/${mid}/original/${ex.comentario_pagina}">Ver o comentário no arquivo</a>`);

  return out.length ? `<div class="q-links">${out.join('')}</div>` : '';
}
async function answerQuestao(letra) {
  const q = CTX.listaQ[QZ.i]; const btns = $$('#qBox .alt'); btns.forEach(b => { b.disabled = true; });
  const feed = $('#qFeed');
  if (q.gabarito) {
    const ok = letra === q.gabarito;
    btns.forEach(b => { if (b.dataset.l === q.gabarito) b.classList.add('right'); else if (b.dataset.l === letra) b.classList.add('wrong'); });
    const ex = q.extras || {};
    const selo = ex.gabarito_ia ? 'Gabarito sugerido pela IA, porque o material não trazia a resposta. Confira no conteúdo' : q.origem === 'PROVA' || q.origem === 'MATERIAL' ? 'Gabarito do material' : q.origem === 'IA' ? 'Questão criada pela IA a partir do material' : q.origem === 'LACUNA' ? 'Resposta tirada do próprio material' : 'Gabarito de quem criou a questão';
    feed.innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}"><p><strong>${ok ? 'Correto.' : `Incorreto. A resposta é a alternativa ${esc(q.gabarito.toUpperCase())}.`}</strong></p>
      ${q.justificativa ? `<p class="lbl" style="font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:10px 0 4px">${ex.comentario_ia ? 'Comentário (gerado por IA)' : 'Comentário'}</p><div class="q-coment">${esc(q.justificativa)}</div>` : '<p class="notice">Este material não traz comentário para esta questão.</p>'}
      <p class="selo" style="margin-top:10px">${selo}.</p>${linksDaQuestao(q)}</div>`;
    await Progresso.registrar('q', q.id, q.materia_id, { acertou: ok, resposta: letra });
  } else {
    feed.innerHTML = `<p class="notice">Registrando sua resposta…</p>`;
    try { await App.store.votar(q.id, letra); } catch (e) { toast(e.message); }
    let vs = []; try { vs = await App.store.votos(q.id); } catch { /* sem votos */ }
    const cont = {}; vs.forEach(v => { cont[v.letra] = (cont[v.letra] || 0) + 1; });
    const max = Math.max(0, ...Object.values(cont));
    btns.forEach(b => { const n = cont[b.dataset.l] || 0; if (n) { b.insertAdjacentHTML('beforeend', `<span class="v">${plural(n, 'voto', 'votos')}</span>`); if (n === max) b.classList.add('top'); } });
    feed.innerHTML = `<div class="feedback"><p><strong>Esta questão não tem gabarito no material.</strong></p>

      ${q.justificativa ? `<div class="q-coment">${esc(q.justificativa)}</div>` : ''}${linksDaQuestao(q)}</div>`;
    await Progresso.registrar('q', q.id, q.materia_id, { acertou: null, resposta: letra });
  }
}

async function viewPainel(view, stale, filtro) {
  view.innerHTML = '<p class="notice">Carregando seu desempenho…</p>';

  const [mats, eventos] = await Promise.all([materiasCache(), App.store.eventosListar(desde.toISOString()).catch(() => []), Progresso.carregar(true)]);
  if (stale()) return;
  const meta = new Map(mats.map(m => [m.id, m]));
  const passa = mid => {
    if (!filtro) return true; const m = meta.get(mid); if (!m) return false;
    const [tipo, valor] = [filtro.slice(0, 2), filtro.slice(2)];
    if (tipo === 'e:') return m.periodo === valor;
    if (tipo === 'a:') return m.periodo + '|' + m.disciplina === valor;
    if (tipo === 't:') return m.id === valor;
    return true;
  };
  const rq = Progresso.todos('q').filter(r => r.acertou != null && passa(r.materia_id));
  const certas = rq.filter(r => r.acertou).length, erradas = rq.length - certas;
  const rf = Progresso.todos('fc').filter(r => passa(r.materia_id));
  const sei = rf.filter(r => r.estado === 'sei').length, rever = rf.filter(r => r.estado === 'rever').length;
  const pct = rq.length ? Math.round(certas / rq.length * 100) : null;
  const dias = [...Array(7)].map((_, i) => { const d = new Date(desde); d.setDate(d.getDate() + i); return d; });
  const ev = eventos.filter(e => passa(e.materia_id));
  const porDia = dias.map(d => { const k = d.toDateString(); const es = ev.filter(e => new Date(e.em).toDateString() === k); return { d, ok: es.filter(e => e.acertou === true).length, erro: es.filter(e => e.acertou === false).length, total: es.length }; });
  const maxDia = Math.max(1, ...porDia.map(x => x.ok + x.erro));

      <option value="e:${esc(e)}" ${filtro === 'e:' + e ? 'selected' : ''}>${esc(e)}: tudo</option>
      ${[...new Set(porEsp.get(e).map(m => m.disciplina))].sort(ordemGeralPorUltimo).map(a => `<option value="a:${esc(e + '|' + a)}" ${filtro === 'a:' + e + '|' + a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
      ${porEsp.get(e).sort((x, y) => cmpNatural(x.materia, y.materia)).map(m => `<option value="t:${m.id}" ${filtro === 't:' + m.id ? 'selected' : ''}>· ${esc(m.materia)}</option>`).join('')}</optgroup>`).join('')}`;
  view.innerHTML = `<h1>Meu desempenho</h1>
    <div class="field" style="max-width:520px"><label for="painelFiltro">Mostrar</label><select id="painelFiltro">${opts}</select></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${rq.length}</div><div class="l">questões respondidas</div></div>
      <div class="kpi"><div class="v" style="color:var(--ok)">${certas}</div><div class="l">acertos</div></div>
      <div class="kpi"><div class="v" style="color:var(--alert)">${erradas}</div><div class="l">erros</div></div>
      <div class="kpi"><div class="v">${pct == null ? '–' : pct + '%'}</div><div class="l">aproveitamento</div></div>
      <div class="kpi"><div class="v">${sei}</div><div class="l">flashcards que você sabe</div></div>
      <div class="kpi"><div class="v">${rever}</div><div class="l">flashcards para rever</div></div>
    </div>
    <h2>Últimos 7 dias</h2>
    <div class="semana">${porDia.map(x => `<div class="col"><span class="n">${x.total || ''}</span><div class="pilha" style="height:${Math.round((x.ok + x.erro) / maxDia * 90)}px">
      <div class="b" style="flex:${x.ok}"></div><div class="b erro" style="flex:${x.erro}"></div></div><span class="d">${DS[x.d.getDay()]}</span></div>`).join('')}</div>
    <p class="notice">Verde: acertos e flashcards que você sabia. Vermelho: erros. O número em cima conta tudo o que você estudou no dia.</p>
    <h2>Domínio por tema</h2>
    ${dominio.length ? `<ul class="dom-lista">${dominio.map(x => `<li><span><a href="#/m/${x.m.id}/questoes">${esc(x.m.materia)}</a><span class="sub">${esc(x.m.periodo)} › ${esc(x.m.disciplina)}, ${plural(x.n, 'questão', 'questões')}</span></span>
      <span class="bar"><i style="width:${x.p}%;background:${cor(x.p)}"></i></span><span class="pct" style="color:${cor(x.p)}">${x.p}%</span></li>`).join('')}</ul>`
      : '<p class="notice">Responda algumas questões para ver seu domínio por tema.</p>'}

      return `<li><div class="t">${esc(m ? m.periodo + ' › ' + m.materia : '')}</div><div class="s"><strong>O que você precisava saber:</strong> ${esc(saber)}</div>

    <div class="lib-acoes" style="margin-top:20px"><a class="btn primary" href="#/flashcards">Estudar flashcards</a></div>`;
}
