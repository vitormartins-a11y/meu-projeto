<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECF1EE">
<title>Acervo da Turma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
/* ===================== Tokens ===================== */
:root{
  --paper:#ECF1EE; --surface:#F8FBF9; --sunk:#E1E9E5;
  --ink:#12332D; --ink-2:#4B655E; --line:#C9D7D1;
  --accent:#1D6F63; --accent-ink:#FFFFFF; --accent-soft:#D3E8E2;
  --mark:#F4E37C; --mark-ink:#12332D;
  --alert:#A9412C; --ok:#2C7A4B; --card-rule:#D9776A; --card-line:#C7DCEA;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1917; --surface:#15231F; --sunk:#1B2C27;
    --ink:#E3EEEA; --ink-2:#9AB2AA; --line:#2B3E38;
    --accent:#62C3B1; --accent-ink:#0B1513; --accent-soft:#1E3A34;
    --mark:#6B5E14; --mark-ink:#FFF8D6;
    --alert:#E4846F; --ok:#73C795; --card-rule:#B5584C; --card-line:#24384A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1917; --surface:#15231F; --sunk:#1B2C27;
  --ink:#E3EEEA; --ink-2:#9AB2AA; --line:#2B3E38;
  --accent:#62C3B1; --accent-ink:#0B1513; --accent-soft:#1E3A34;
  --mark:#6B5E14; --mark-ink:#FFF8D6;
  --alert:#E4846F; --ok:#73C795; --card-rule:#B5584C; --card-line:#24384A;
  color-scheme:dark;
}

/* ===================== Base ===================== */
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100%}
a{color:var(--accent);text-underline-offset:2px}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--read);line-height:1.2;margin:0 0 .4em}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600;margin-top:1.6em}
h3{font-size:1.08rem;font-weight:600}
p{margin:0 0 .8em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lede{color:var(--ink-2);max-width:62ch}
.notice{color:var(--ink-2);font-size:.9rem;max-width:68ch}
.crumbs{color:var(--ink-2);font-size:.9rem;margin:0 0 6px}
.crumbs a{color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.scroll-x{overflow-x:auto;max-width:100%}

/* ===================== Shell ===================== */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;gap:12px;align-items:center}
.brand{font-family:var(--read);font-weight:700;font-size:1.08rem;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px;flex:none}
.search{flex:1;display:flex;max-width:560px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);min-width:0}
main{max-width:860px;margin:0 auto;padding:22px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;font-size:.78rem;color:var(--ink-2);text-decoration:none}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}
@media (max-width:520px){ .brand span{display:none} .tabs{gap:0;margin-left:-16px;margin-right:-16px;padding:0 8px} .tabs a{padding:10px 9px;font-size:.92rem} .tabs .count{display:none} }
@media (min-width:960px){
  .nav{top:0;bottom:0;right:auto;width:208px;grid-template-columns:1fr;align-content:start;
    padding-top:calc(env(safe-area-inset-top,0px) + 80px);border-top:0;border-right:1px solid var(--line)}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 24px;font-size:.95rem}
  .topbar{padding-left:24px}
  .shell{padding-left:208px}
  main{padding-bottom:64px}
}

/* ===================== Controls ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-m);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:8px;padding-right:8px}
.btn.danger{color:var(--alert)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:12px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;
  text-decoration:none;color:var(--ink);font-size:.92rem}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .count{opacity:.7}
.count{font-size:.82rem;color:var(--ink-2);margin-left:4px;font-weight:400}
.field{display:grid;gap:4px;margin:14px 0}
.field label,.field legend{font-weight:700;font-size:.95rem}
fieldset.field{border:0;padding:0}
.hint{display:block;color:var(--ink-2);font-size:.85rem;font-weight:400}
input[type=text],input[type=url],input[type=email],input[type=search],textarea,select{
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);width:100%}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-weight:400 !important}
.opt input{margin-top:5px}
.grid3{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:640px){ .grid3{grid-template-columns:repeat(3,1fr)} }
.panel{border-top:1px solid var(--line);padding-top:8px;margin-top:28px}
pre{overflow:auto;background:var(--sunk);padding:12px;border-radius:var(--r-s);font-size:.78rem;line-height:1.45;max-height:340px}

/* ===================== Biblioteca ===================== */
.disc{margin:26px 0 8px}
.disc h3{display:flex;align-items:baseline;gap:8px;padding-left:12px;border-left:4px solid var(--accent)}
.mat-list{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.mat-list a{display:flex;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mat-list a:hover{background:var(--sunk)}
.mat-list .meta{color:var(--ink-2);font-size:.88rem;white-space:nowrap}
.empty{padding:28px 0}

/* ===================== Matéria ===================== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin:18px 0 20px}
.tabs a{padding:10px 10px;text-decoration:none;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent);font-weight:700}
.doc-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 0}
.doc-head h2{margin:0}
.doc-head .meta{color:var(--ink-2);font-size:.9rem}
.pg{margin:26px 0;padding-top:18px;border-top:1px solid var(--line)}
.pg-head{margin-bottom:10px}
.pg-n{display:block;font-size:.84rem;color:var(--ink-2)}
.reading{font-family:var(--read);font-size:1.04rem;line-height:1.72;max-width:68ch}
.reading img{display:block;margin:12px 0;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;cursor:zoom-in;height:auto}
.reading table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-family:var(--ui);font-size:.9rem}
.reading td,.reading th{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.pg-img{width:100%;height:auto;border-radius:var(--r-s);border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block;min-height:120px}
.pg-text{margin-top:10px}
.pg-text summary{cursor:pointer;color:var(--accent);font-size:.92rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.gallery img{width:100%;height:120px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);cursor:zoom-in}

/* Marca-texto: a assinatura visual do app */
mark{background:var(--mark);color:var(--mark-ink);padding:.04em .22em;margin:0 -.04em;
  border-radius:.35em .7em .45em .6em / .6em .35em .7em .4em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ===================== Resumo ===================== */
.points{padding-left:1.1em;margin:8px 0 0}
.points li{margin:0 0 12px;font-family:var(--read);line-height:1.65;max-width:68ch}
.points .src{font-family:var(--ui);font-size:.84rem;margin-left:4px}
.cat{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--accent);margin-right:6px}
.cat-atencao{color:var(--alert)}
.cat-h{font-family:var(--ui);font-size:1rem;margin-top:22px}
.cat-h.cat-atencao{color:var(--alert)}
details.sec{border-top:1px solid var(--line);padding:12px 0}
details.sec summary{cursor:pointer;font-weight:700}
details.sec .points{margin-top:10px}

/* ===================== Flashcards ===================== */
.fc-stage{perspective:1200px;margin:16px 0}
.fc{position:relative;min-height:260px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:56px 28px 28px;text-align:center;border-radius:var(--r-m);border:1px solid var(--line);font-family:var(--read);font-size:1.22rem;line-height:1.45;
  background-color:var(--surface);
  background-image:linear-gradient(var(--card-rule),var(--card-rule)),repeating-linear-gradient(to bottom,transparent 0 31px,var(--card-line) 31px 32px);
  background-size:100% 2px,100% 100%;background-position:0 40px,0 40px;background-repeat:no-repeat,no-repeat;overflow:auto}
.fc-back{transform:rotateY(180deg)}
.fc-tag{position:absolute;top:12px;left:16px;font-family:var(--ui);font-size:.8rem;color:var(--ink-2)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-list{list-style:none;padding:0;margin:0}
.fc-list li{border-bottom:1px solid var(--line);padding:14px 0}
.fc-list .q{font-weight:700}
.fc-list .a{font-family:var(--read);margin-top:4px}
.fc-list .row{margin-top:6px;font-size:.85rem;color:var(--ink-2)}

/* ===================== Questões ===================== */
.q-card{margin-top:8px}
.q-top{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:.88rem;margin-bottom:10px}
.q-text{font-family:var(--read);font-size:1.06rem;line-height:1.65;white-space:pre-line}
.alts{list-style:none;padding:0;margin:14px 0}
.alt{display:flex;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--surface);margin:8px 0;cursor:pointer;line-height:1.45}
.alt:hover{border-color:var(--ink-2)}
.alt .l{font-weight:700;min-width:1.3em}
.alt .v{margin-left:auto;font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.alt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.alt.wrong{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 11%,var(--surface))}
.alt.top{border-color:var(--accent)}
.alt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:14px 16px;border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 var(--r-m) var(--r-m) 0}
.feedback.ok{border-color:var(--ok)}
.feedback.bad{border-color:var(--alert)}
.selo{font-size:.85rem;color:var(--ink-2)}

/* ===================== Busca ===================== */
.hit-group{margin:24px 0}
.hits{list-style:none;padding:0;margin:6px 0 0}
.hits a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hits a:hover{background:var(--sunk)}
.hits .t{font-weight:700}
.hits .p{color:var(--ink-2);font-size:.85rem;margin-left:6px}
.hits .s{font-family:var(--read);margin:4px 0 0;color:var(--ink);font-size:.96rem}

/* ===================== Envio ===================== */
.plan-table{width:100%;border-collapse:collapse;font-size:.92rem}
.plan-table th,.plan-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table td.n{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.log{list-style:none;padding:0;margin:8px 0;font-size:.86rem;color:var(--ink-2);max-height:240px;overflow:auto}
.log li{padding:3px 0;border-bottom:1px dashed var(--line)}
.log .err{color:var(--alert)}

/* ===================== Overlays ===================== */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r-m);z-index:60;max-width:92vw;font-size:.95rem}
@media (min-width:960px){ .toast{bottom:24px} }
dialog{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);color:var(--ink);width:min(580px,94vw);padding:20px;max-height:90vh}
dialog::backdrop{background:rgb(0 0 0 / .5)}
dialog.lightbox{width:98vw;max-width:1400px;padding:8px;background:#111}
dialog.lightbox img{display:block;width:100%;height:auto;background:#fff}
dialog.lightbox .row{padding:4px}

/* ===================== v3: Biblioteca em 3 níveis ===================== */
.lib-acoes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.esp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:8px}
.esp-tile{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px 20px;border:1px solid var(--line);border-radius:var(--r-l);
  background:var(--surface);text-decoration:none;color:var(--ink);position:relative;overflow:hidden;min-height:104px}
.esp-tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--hue,var(--accent))}
.esp-tile:hover{border-color:var(--ink-2)}
.esp-tile .nome{font-family:var(--read);font-weight:700;font-size:1.12rem;line-height:1.2}
.esp-tile .meta{color:var(--ink-2);font-size:.86rem;margin-top:auto}
.area{margin:22px 0 4px}
.area h2{font-family:var(--ui);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}

/* ===================== v3: Apostila ===================== */
.apostila{font-family:var(--read);font-size:1.06rem;line-height:1.75;max-width:70ch}
.apostila h2.cap{font-size:1.45rem;margin:1.8em 0 .6em;padding-top:.6em;border-top:2px solid var(--line)}
.apostila h2.cap:first-of-type{border-top:0;margin-top:.4em}
.apostila h3{font-family:var(--ui);font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:1.7em 0 .5em}
.apostila h4{font-family:var(--ui);font-size:1rem;margin:1.2em 0 .3em}
.apostila p{margin:0 0 .85em}
.apostila ul{margin:.2em 0 1em;padding-left:1.2em}
.apostila li{margin:.25em 0}
.apostila .ancora{display:block;height:0;scroll-margin-top:90px}
.fig{margin:1.1em 0;padding:10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.fig img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:var(--r-s);background:#fff;cursor:zoom-in}
.fig figcaption{font-family:var(--ui);font-size:.84rem;color:var(--ink-2);margin-top:6px;text-align:center}
.fig.pendente{color:var(--ink-2);font-family:var(--ui);font-size:.88rem;text-align:center;padding:22px;border-style:dashed}
.sumario{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;background:var(--surface);margin:6px 0 18px}
.sumario summary{cursor:pointer;font-weight:700}
.sumario ol{margin:8px 0 2px;padding-left:1.2em;columns:2;column-gap:24px;font-size:.92rem}
@media (max-width:640px){.sumario ol{columns:1}}
.sumario a{color:var(--ink)}
.pg-orig{margin:22px 0;padding-top:14px;border-top:1px solid var(--line)}
.pg-orig .figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.pg-orig .figs img{width:100%;height:140px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:var(--r-s);cursor:zoom-in}

/* ===================== v3: Resumo estruturado ===================== */
.resumo-v3{max-width:70ch}
.resumo-v3 section{margin:0 0 26px}
.resumo-v3 h3{font-family:var(--ui);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.resumo-v3 ul{list-style:none;margin:0;padding:0}
.resumo-v3 li{font-family:var(--read);line-height:1.7;margin:0 0 10px;padding-left:16px;position:relative}
.resumo-v3 li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--ink-2);opacity:.55}
.resumo-v3 .src{font-family:var(--ui);font-size:.78rem;margin-left:6px;white-space:nowrap;opacity:.8}

/* ===================== v3: Flashcards (um por vez) ===================== */
.painel-f{border:1px solid var(--line);border-radius:var(--r-l);padding:12px 14px;background:var(--surface);margin-bottom:14px}
.painel-f .lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 6px;font-weight:700}
.painel-f .lbl:first-child{margin-top:0}
.painel-f .chips{margin:0;flex-wrap:wrap}
.painel-f .chip{font-size:.84rem;padding:5px 11px}
.contagem{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--ink-2);margin-top:12px}
.contagem b{color:var(--ink);font-size:1rem}
.fcv-barra{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fcv-barra i{display:block;height:100%;background:var(--accent);transition:width .25s}
.fcv-cont{font-size:.86rem;color:var(--ink-2);margin:8px 0}
.fcv-card{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;cursor:pointer;
  box-shadow:0 8px 22px rgb(0 0 0 / .12);transition:transform .18s ease}
.fcv-card.virando{transform:rotateX(90deg)}
.fcv-topo{display:flex;flex-wrap:wrap;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.tag{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);font-weight:700}
.tag.esp{color:var(--accent);border-color:var(--accent)}
.tag.prova{color:var(--alert);border-color:var(--alert)}
.fcv-corpo{padding:22px 20px 24px;min-height:220px}
.fcv-frente{font-family:var(--read);font-size:1.22rem;line-height:1.5;font-weight:600}
.fcv-verso{font-family:var(--read);font-size:1.05rem;line-height:1.65;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);white-space:pre-line}

/* Junta linhas quebradas no meio da frase (comum em PDF) */
function joinLines(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim());
  const out = []; let buf = '';
  const isBullet = l => /^([•●▪◦\-–*]|\d{1,3}[.)]|[a-eA-E][.)])\s/.test(l);
  for (const l of lines) {
    if (!l) { if (buf) { out.push(buf); buf = ''; } continue; }
    if (!buf) { buf = l; continue; }
    const endsSentence = /[.!?:;]$/.test(buf);
    const startsLower = /^[a-zà-ÿ(,]/.test(l);
    if (buf.endsWith('-') && startsLower) buf = buf.slice(0, -1) + l;
    else if (!endsSentence && startsLower && !isBullet(l)) buf += ' ' + l;
    else { out.push(buf); buf = l; }
  }
  if (buf) out.push(buf);

function splitSentences(text) {
  const out = [];
  joinLines(text).split('\n').forEach(line => {
    line = line.replace(/^\s*(?:[•●▪◦\-–*]|\d{1,2}[.)])\s+/, '').trim();
    if (!line) return;

  if (/^\[\[FIG:\d+\]\]$/.test(linha.trim())) return linha.trim();
  if (RE_PAGINA.test(linha) || RE_VIDEO.test(linha)) return '';
  const n = norm(linha);
  if (linha.length <= 80 && MARCAS_AMBIGUAS.some(t => new RegExp('(^|[^a-z])' + t + '([^a-z]|$)').test(n))) return '';

/* Linhas que se repetem em muitas páginas do mesmo arquivo (cabeçalhos e rodapés) */
function removerRepetidas(pages) {
  if (pages.length < 3) return pages;
  const cont = new Map();
  for (const p of pages) {
    const vistas = new Set();
    for (const l of String(p.texto || '').split('\n')) {
      const k = norm(l).replace(/\d+/g, '#').trim();
      if (k.length < 4 || k.length > 120 || k.startsWith('[[fig') || vistas.has(k)) continue;
      vistas.add(k); cont.set(k, (cont.get(k) || 0) + 1);

  const rep = new Set([...cont].filter(([, n]) => n >= lim).map(([k]) => k));
  if (!rep.size) return pages;
  return pages.map(p => ({ ...p, texto: String(p.texto || '').split('\n').filter(l => !rep.has(norm(l).replace(/\d+/g, '#').trim())).join('\n') }));
}
function limparHtml(html) {
  if (!html) return html;
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html');
  const root = doc.body.firstElementChild;
  const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(t => { const c = cortarTermos(t.nodeValue, MARCAS); if (c !== t.nodeValue.trim()) t.nodeValue = c ? ' ' + c + ' ' : ''; });

function pontuar(texto, chaves) {
  let s = 0;
  for (const c of chaves) { let i = 0, n = 0; while ((i = texto.indexOf(c, i)) !== -1 && n < 25) { n++; i += c.length; } s += n; }
  return s;
}
/* Recebe nomes (pastas + arquivo, com peso maior) e texto; devolve { especialidade, area } */
function classificarConteudo(nomes, texto) {
  const tn = ' ' + norm(nomes.join(' ')) + ' ';
  const tt = ' ' + norm(String(texto || '').slice(0, 20000)) + ' ';
  let melhor = null, melhorPts = 0;
  for (const e of ESPECIALIDADES) {
    const pts = pontuar(tn, e.chaves) * 8 + pontuar(tt, e.chaves);
    if (pts > melhorPts) { melhor = e; melhorPts = pts; }
  }
  if (!melhor || melhorPts < 3) return { especialidade: 'Outros', area: 'Geral' };
  let area = null, areaPts = 0;
  for (const a of melhor.areas) {
    const pts = pontuar(tn, a.chaves) * 8 + pontuar(tt, a.chaves);
    if (pts > areaPts) { area = a; areaPts = pts; }
  }
  return { especialidade: melhor.nome, area: area && areaPts >= 2 ? area.nome : 'Geral' };
}
/* Tema: a pasta mais específica que não seja genérica; se não houver, o nome do arquivo */
function escolherTema(caminho, nomeArquivo) {
  for (let i = caminho.length - 1; i >= 0; i--) { if (!ehGenerica(caminho[i])) { const t = limparNome(caminho[i]); if (t) return t; } }
  return limparNome(nomeArquivo) || 'Geral';
}

/* Limpa o HTML vindo de documentos antes de mostrar (segurança) */
const ALLOWED_TAGS = new Set(['P','H1','H2','H3','H4','H5','H6','UL','OL','LI','STRONG','B','EM','I','U','TABLE','THEAD','TBODY','TR','TD','TH','BR','IMG','SUP','SUB','BLOCKQUOTE','SPAN']);
const DROP_TAGS = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','LINK','META','svg','SVG','MATH','FORM','INPUT','BUTTON']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  const root = doc.body.firstElementChild;
  (function walk(node) {
    for (const c of [...node.childNodes]) {
      if (c.nodeType === 1) {
        if (DROP_TAGS.has(c.tagName)) { c.remove(); continue; }
        walk(c);
        if (!ALLOWED_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); continue; }
        for (const a of [...c.attributes]) {
          const okRef = c.tagName === 'IMG' && a.name === 'data-ref' && /^(local|sb):[\w/.-]+$/.test(a.value);
          const okSpan = (c.tagName === 'TD' || c.tagName === 'TH') && /^(colspan|rowspan)$/.test(a.name) && /^\d+$/.test(a.value);
          if (!okRef && !okSpan) c.removeAttribute(a.name);
        }
        if (c.tagName === 'IMG') { if (!c.hasAttribute('data-ref')) c.remove(); else c.setAttribute('alt', 'Imagem do material'); }
      } else if (c.nodeType !== 3) c.remove();
    }
  })(root);
  return root.innerHTML;
}

      const r = indexedDB.open('acervo-turma', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        const mk = (name, key, idx = []) => { const s = d.createObjectStore(name, { keyPath: key }); idx.forEach(i => s.createIndex(i, i)); };
        mk('materias', 'id'); mk('documentos', 'id', ['materia_id']); mk('paginas', 'id', ['materia_id', 'documento_id']);
        mk('resumos', 'materia_id'); mk('flashcards', 'id', ['materia_id']); mk('questoes', 'id', ['materia_id']);
        mk('votos', 'k', ['questao_id']); mk('reportes', 'id'); mk('blobs', 'id');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('O navegador bloqueou o armazenamento local.'));
    });
  }
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  _os(store, mode = 'readonly') { return this.db.transaction(store, mode).objectStore(store); }

  _get(store, k) { return this._req(this._os(store).get(k)); }
  _put(store, o) { return this._req(this._os(store, 'readwrite').put(o)); }

  remove(table, id) { return this._del(table, id); }
  async replaceAuto(table, mid, origens, rows) {
    for (const r of await this._by(table, 'materia_id', mid)) if (origens.includes(r.origem)) await this._del(table, r.id);
    await this.add(table, rows);
  }
  votar(qid, letra) { return this._put('votos', { k: qid + ':local', questao_id: qid, user_id: 'local', letra }); }
  votos(qid) { return this._by('votos', 'questao_id', qid); }
  reportar(alvo, alvo_id, texto) { return this._put('reportes', { id: uuid(), alvo, alvo_id, texto, criado_em: nowIso() }); }
  async search(q) {
    const qn = norm(q).trim(); if (qn.length < 2) return [];
    const pages = await this._all('paginas');
    return pages.filter(p => (p.texto_norm || '').includes(qn)).slice(0, 80)
      .map(p => ({ id: p.id, materia_id: p.materia_id, documento_id: p.documento_id, n: p.n, titulo: p.titulo, snippet: snippet(p.texto, qn) }));
  }
  async saveImage(blob) { const id = uuid(); await this._put('blobs', { id, blob }); return 'local:' + id; }
  async imageUrls(refs) {
    const out = new Map();
    for (const r of refs) {
      if (this.urlCache.has(r)) { out.set(r, this.urlCache.get(r)); continue; }
      if (!r.startsWith('local:')) continue;
      const rec = await this._get('blobs', r.slice(6));
      if (rec?.blob) { const u = URL.createObjectURL(rec.blob); this.urlCache.set(r, u); out.set(r, u); }
    }
    return out;
  }
  async wipe() { this.db.close(); await new Promise(res => { const r = indexedDB.deleteDatabase('acervo-turma'); r.onsuccess = r.onerror = r.onblocked = () => res(); }); }
}

/* ============ Armazenamento NA NUVEM (Supabase, plano gratuito) ============ */
class SupaStore {

    return out;
  }
  async progressoSalvar(row) {
    await comRetentativa(async () => { const r = await this.sb.from('progresso').upsert({ ...row, user_id: this.user().id }, { onConflict: 'user_id,tipo,item_id' }); if (r.error) throw new Error(r.error.message); }, 3);

  async eventoSalvar(ev) { const r = await this.sb.from('eventos').insert({ ...ev, user_id: this.user().id }); if (r.error) throw new Error(r.error.message); }
  async eventosListar(desde) { return this._ok(await this.sb.from('eventos').select('tipo,item_id,materia_id,acertou,em').gte('em', desde).order('em').limit(10000)); }
  async midiaExiste(driveId) { return this._ok(await this.sb.from('midias').select('id').eq('drive_id', driveId).limit(1)).length > 0; }
  async enfileirarMidias(rows) {

  async progressoApagar() {

  async signInEmail(email) { const { error } = await this.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: this.redirectUrl(), shouldCreateUser: true } }); if (error) throw new Error(error.message); }
  async signOut() { this._membro = undefined; await this.sb.auth.signOut(); }

  async listMateriasComContagem() {

  async getMateria(id) { return this._ok(await this.sb.from('materias').select('*').eq('id', id).maybeSingle()); }
  async ensureMateria(p, d, m) {
    const find = async () => this._ok(await this.sb.from('materias').select('*').eq('periodo', p).eq('disciplina', d).eq('materia', m).maybeSingle());
    let r = await find(); if (r) return r;
    const ins = await this.sb.from('materias').insert({ id: uuid(), periodo: p, disciplina: d, materia: m }).select().single();
    if (ins.error) { r = await find(); if (r) return r; throw new Error(ins.error.message); }

  async hasDocumento(mid, driveId) { return this._ok(await this.sb.from('documentos').select('id').eq('materia_id', mid).eq('drive_id', driveId).limit(1)).length > 0; }
  async addDocumento(doc, pages) {
    // Primeiro o arquivo (as páginas apontam para ele), depois as páginas.
    // Se as páginas falharem no meio, o arquivo é apagado: assim ele não fica marcado como enviado e pode ser reenviado inteiro.
    await comRetentativa(async () => {
      const r = await this.sb.from('documentos').upsert(doc, { onConflict: 'id', ignoreDuplicates: true });
      if (r.error) throw new Error(r.error.message);
    });
    // Confere se o arquivo foi mesmo gravado antes de enviar as páginas (senão o erro aparece como "foreign key constraint").
    const gravado = this._ok(await this.sb.from('documentos').select('id').eq('id', doc.id).limit(1));
    if (!gravado.length) throw new Error('O banco aceitou o envio do arquivo mas não o gravou na tabela "documentos". A configuração do Supabase está diferente da esperada (veja gatilhos e políticas da tabela "documentos").');
    try {
      for (let i = 0; i < pages.length; i += 30) {
        const lote = pages.slice(i, i + 30);
        await comRetentativa(async () => {
          const r = await this.sb.from('paginas').upsert(lote, { onConflict: 'id', ignoreDuplicates: true });
          if (r.error) throw new Error(r.error.message);
        });
      }
    } catch (e) {
      await this.sb.from('documentos').delete().eq('id', doc.id);
      throw e;
    }
  }
  async listDocumentos(mid) { return this._ok(await this.sb.from('documentos').select('*').eq('materia_id', mid).order('ordem')); }
  async listPaginas(mid) {
    let out = [], from = 0;
    for (;;) {
      const d = this._ok(await this.sb.from('paginas').select('*').eq('materia_id', mid).order('n').range(from, from + 499));
      out = out.concat(d); if (d.length < 500) break; from += 500;
    }
    return out;
  }
  async deleteDocumento(id) { this._ok(await this.sb.from('documentos').delete().eq('id', id)); }
  async deleteMateria(id) { this._ok(await this.sb.from('materias').delete().eq('id', id)); }
  async getResumo(mid) { return this._ok(await this.sb.from('resumos').select('dados').eq('materia_id', mid).maybeSingle())?.dados || null; }
  async setResumo(mid, dados) { this._ok(await this.sb.from('resumos').upsert({ materia_id: mid, dados, atualizado_em: nowIso() })); }
  async list(table, mid) { return this._ok(await this.sb.from(table).select('*').eq('materia_id', mid).order('criado_em')); }
  async add(table, rows) { for (let i = 0; i < rows.length; i += 100) this._ok(await this.sb.from(table).insert(rows.slice(i, i + 100))); }
  async remove(table, id) { this._ok(await this.sb.from(table).delete().eq('id', id)); }
  async replaceAuto(table, mid, origens, rows) {
    this._ok(await this.sb.from(table).delete().eq('materia_id', mid).in('origem', origens));
    await this.add(table, rows);
  }
  async votar(qid, letra) { this._ok(await this.sb.from('votos').upsert({ questao_id: qid, user_id: this.user().id, letra }, { onConflict: 'questao_id,user_id' })); }
  async votos(qid) { return this._ok(await this.sb.from('votos').select('letra,user_id').eq('questao_id', qid)); }
  async reportar(alvo, alvo_id, texto) { this._ok(await this.sb.from('reportes').insert({ alvo, alvo_id, texto })); }
  async search(q) {
    const qn = norm(q).trim().replace(/[%_,()*]/g, ' ').trim(); if (qn.length < 2) return [];
    const d = this._ok(await this.sb.from('paginas').select('id,materia_id,documento_id,n,titulo,texto').ilike('texto_norm', `%${qn}%`).limit(80));
    return d.map(p => ({ ...p, snippet: snippet(p.texto, qn) }));
  }
  async saveImage(blob) {
    // O nome do arquivo é a "impressão digital" do conteúdo: a mesma imagem (logo, capa, figura repetida
    // em vários PDFs) é guardada uma vez só, mesmo que apareça em centenas de páginas.
    const ext = (blob.type.split('/')[1] || 'bin').replace('jpeg', 'jpg');
    const hash = crypto.subtle ? [...new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()))].map(b => b.toString(16).padStart(2, '0')).join('') : uuid();
    const path = `img/${hash}.${ext}`;
    await comRetentativa(async () => {
      const r = await this.sb.storage.from('paginas').upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
      if (r.error && !/exist|duplicate/i.test(r.error.message)) throw new Error(r.error.message);
    });
    return 'sb:' + path;
  }
  async imageUrls(refs) {
    const out = new Map(); const need = [];
    for (const r of refs) { if (this.urlCache.has(r)) out.set(r, this.urlCache.get(r)); else if (r.startsWith('sb:')) need.push(r); }
    for (let i = 0; i < need.length; i += 100) {
      const chunk = need.slice(i, i + 100);
      const d = this._ok(await this.sb.storage.from('paginas').createSignedUrls(chunk.map(r => r.slice(3)), 60 * 60 * 6));
      d.forEach((x, j) => { if (x.signedUrl) { this.urlCache.set(chunk[j], x.signedUrl); out.set(chunk[j], x.signedUrl); } });
    }
    return out;
  }
}

/* ============================ Google Drive ============================
   O app não usa a conta Google de ninguém. Quem envia material compartilha a pasta
   com o "e-mail robô" do projeto (conta de serviço do Google). A função "drive" do
   Supabase lê a pasta com esse robô e repassa os arquivos para este aparelho, que faz
   a extração de texto, imagens e OCR. A chave do robô fica só no servidor. */
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const Drive = {
  robo: null,
  disponivel() { return App.store?.mode === 'supabase'; },
  async api(acao, params = {}, asBlob = false, retry = 2) {
    const { data } = await App.store.sb.auth.getSession();
    const token = data.session?.access_token;
    if (!token) throw new Error('Faça login de novo para enviar material.');
    const u = new URL(cfg('SUPABASE_URL').replace(/\/$/, '') + '/functions/v1/drive');
    u.searchParams.set('acao', acao);
    Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u, { headers: { Authorization: 'Bearer ' + token, apikey: cfg('SUPABASE_ANON_KEY') } });
    if ((r.status === 429 || r.status >= 500) && retry > 0) { await new Promise(res => setTimeout(res, 1500)); return this.api(acao, params, asBlob, retry - 1); }
    if (!r.ok) {
      let msg = ''; try { msg = (await r.json()).error || ''; } catch { /* sem corpo */ }
      if (r.status === 404) throw new Error(`Não consegui abrir. Confira se a pasta foi compartilhada com ${this.robo || 'o e-mail do app'}.`);
      throw new Error(msg || `O servidor respondeu ${r.status}.`);
    }
    return asBlob ? r.blob() : r.json();
  },
  async quem() { if (!this.robo) this.robo = (await this.api('quem')).email; return this.robo; },
  meta(id) { return this.api('meta', { id }); },
  async children(id) {
    let out = [], pageToken = '';
    do {
      const j = await this.api('listar', pageToken ? { id, pageToken } : { id });
      out = out.concat(j.files || []); pageToken = j.nextPageToken || '';
    } while (pageToken);
    return out;
  },
  async walk(rootId, onProgress) {
    const out = []; const stack = [{ id: rootId, path: [] }];
    while (stack.length) {
      const { id, path } = stack.pop();
      for (const k of await this.children(id)) {
        if (k.mimeType === FOLDER_MIME) stack.push({ id: k.id, path: [...path, k.name] });
        else if (k.mimeType !== 'application/vnd.google-apps.shortcut') out.push({ file: k, path });
      }
      onProgress && onProgress(out.length);
    }
    return out;
  },
  async download(f) {
    const exportMap = {
      'application/vnd.google-apps.document': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'application/vnd.google-apps.presentation': 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
      'application/vnd.google-apps.spreadsheet': 'text/csv',
    };
    if (f.mimeType.startsWith('application/vnd.google-apps.')) {
      const m = exportMap[f.mimeType]; if (!m) return null;
      return { blob: await this.api('baixar', { id: f.id, exportar: m }, true), mime: m };
    }
    return { blob: await this.api('baixar', { id: f.id }, true), mime: f.mimeType };
  },
};
function parseFolderId(link) {
  const s = String(link || '').trim();
  const m = s.match(/folders\/([\w-]{10,})/) || s.match(/[?&]id=([\w-]{10,})/);
  if (m) return m[1];
  return /^[\w-]{10,}$/.test(s) ? s : null;
}

/* ============================ Extração por tipo ============================ */
function fileKind(name, mime = '') {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (mime === 'application/pdf' || ext === 'pdf') return 'PDF';
  if (mime.includes('wordprocessingml') || mime === 'application/vnd.google-apps.document' || ext === 'docx') return 'Word';
  if (mime.includes('presentationml') || mime === 'application/vnd.google-apps.presentation' || ext === 'pptx') return 'Slides';
  if (mime.startsWith('image/') || ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].includes(ext)) return 'Imagem';
  if (mime === 'application/vnd.google-apps.spreadsheet' || mime.startsWith('text/') || ['txt', 'md', 'csv'].includes(ext)) return 'Texto';
  if (mime.startsWith('audio/') || ['mp3', 'm4a', 'wav', 'ogg', 'aac', 'opus', 'wma', 'flac'].includes(ext)) return 'Áudio';
  if (mime.startsWith('video/') || ['mp4', 'mov', 'mkv', 'webm', 'avi', 'm4v', 'wmv', '3gp'].includes(ext)) return 'Vídeo';
  return null;
}

let ocrWorker = null;
async function ocr(canvas) {
  try {
    await loadLib('tesseract');
    if (!ocrWorker) ocrWorker = await Tesseract.createWorker('por');
    const { data } = await ocrWorker.recognize(canvas);
    return (data.text || '').trim();
  } catch (e) { console.warn('OCR falhou', e); return ''; }
}
async function stopOcr() { if (ocrWorker) { try { await ocrWorker.terminate(); } catch { /* ignore */ } ocrWorker = null; } }

function groupPdfLines(items, vp) {
  const rows = [];
  const sorted = items.map(it => {
    const [vx, vy] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
    return { str: it.str, x: vx, y: vy, size: Math.hypot(it.transform[2], it.transform[3]) || it.height || 10 };
  }).sort((a, b) => a.y - b.y || a.x - b.x);
  for (const it of sorted) {
    const row = rows.find(r => Math.abs(r.y - it.y) < Math.max(2, it.size * 0.45));
    if (row) { row.items.push(it); row.size = Math.max(row.size, it.size); } else rows.push({ y: it.y, size: it.size, items: [it] });
  }
  return rows.sort((a, b) => a.y - b.y)
    .map(r => ({ y: r.y, size: r.size, text: r.items.sort((a, b) => a.x - b.x).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim() }))
    .filter(r => r.text);
}

/* Onde estão as imagens dentro da página (ECGs, fotos, esquemas), em coordenadas da página */
async function caixasDeFiguras(pg, vp) {
  const O = pdfjsLib.OPS, U = pdfjsLib.Util;
  const ops = await pg.getOperatorList();
  let ctm = [1, 0, 0, 1, 0, 0]; const pilha = []; const caixas = [];
  const pinta = new Set([O.paintImageXObject, O.paintInlineImageXObject, O.paintImageMaskXObject, O.paintJpegXObject].filter(v => v !== undefined));
  for (let i = 0; i < ops.fnArray.length; i++) {
    const fn = ops.fnArray[i], a = ops.argsArray[i];
    if (fn === O.save) pilha.push(ctm.slice());
    else if (fn === O.restore) ctm = pilha.pop() || [1, 0, 0, 1, 0, 0];
    else if (fn === O.transform) ctm = U.transform(ctm, a);
    else if (fn === O.paintFormXObjectBegin) { pilha.push(ctm.slice()); if (Array.isArray(a?.[0]) && a[0].length === 6) ctm = U.transform(ctm, a[0]); }
    else if (fn === O.paintFormXObjectEnd) ctm = pilha.pop() || [1, 0, 0, 1, 0, 0];
    else if (pinta.has(fn)) {
      const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => vp.convertToViewportPoint(...U.applyTransform(p, ctm)));
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      caixas.push({ x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys) });
    }
  }
  const W = vp.width, H = vp.height;
  let bs = caixas.map(b => { const x = Math.max(0, b.x), y = Math.max(0, b.y); return { x, y, w: Math.min(W, b.x + b.w) - x, h: Math.min(H, b.y + b.h) - y }; })
    .filter(b => b.w >= 50 && b.h >= 40 && b.w / b.h < 8 && b.h / b.w < 8);
  const escaneada = bs.some(b => b.w * b.h >= 0.8 * W * H);
  bs = bs.filter(b => b.w * b.h < 0.8 * W * H);
  // junta pedaços da mesma figura (imagens fatiadas ou coladas lado a lado)
  let mudou = true;
  while (mudou) {
    mudou = false;
    outer: for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], b = bs[j], g = 6;
      if (a.x - g < b.x + b.w && b.x - g < a.x + a.w && a.y - g < b.y + b.h && b.y - g < a.y + a.h) {
        const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
        bs[i] = { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
        bs.splice(j, 1); mudou = true; break outer;
      }
    }
  }
  return { caixas: bs.sort((a, b) => a.y - b.y), escaneada };
}

/* Lê uma página. Sem imagens: só texto (rápido). Com imagens: texto com marcadores [[FIG:n]] no lugar
   de cada figura, recortes das figuras, foto da página e OCR quando a página é escaneada. */
async function lerPaginaPdf(pg, comImagens, onStep) {
  const vp1 = pg.getViewport({ scale: 1 });
  const tc = await pg.getTextContent();
  const linhas = groupPdfLines(tc.items.filter(it => it.str && it.str.trim()), vp1);
  const sizes = linhas.map(l => l.size).sort((a, b) => a - b);
  const med = sizes[Math.floor(sizes.length / 2)] || 0;
  const grandes = linhas.filter(l => med && l.size >= med * 1.25 && l.text.length > 3 && l.text.length < 100);
  const out = { titulo: grandes[0]?.text || null, destaques: grandes.slice(1, 8).map(l => l.text), figBoxes: [] };
  if (!comImagens) { out.texto = linhas.map(l => l.text).join('\n'); return out; }
  const { caixas, escaneada } = await caixasDeFiguras(pg, vp1);
  const entradas = linhas.map(l => ({ y: l.y, t: l.text }));
  caixas.forEach((c, i) => entradas.push({ y: c.y + 1, t: `[[FIG:${i}]]` }));
  entradas.sort((a, b) => a.y - b.y);
  out.texto = entradas.map(e => e.t).join('\n');
  out.figBoxes = caixas.map(c => ({ x: c.x / vp1.width, y: c.y / vp1.height, w: c.w / vp1.width, h: c.h / vp1.height }));
  const s = Math.min(2.2, 1400 / vp1.width);
  const vp = pg.getViewport({ scale: s });
  const canvas = document.createElement('canvas'); canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await pg.render({ canvasContext: ctx, viewport: vp }).promise;
  out.figBlobs = [];
  for (const c of caixas) {
    const pad = 4;
    const sx = Math.max(0, Math.floor(c.x * s) - pad), sy = Math.max(0, Math.floor(c.y * s) - pad);
    const sw = Math.min(canvas.width - sx, Math.ceil(c.w * s) + pad * 2), sh = Math.min(canvas.height - sy, Math.ceil(c.h * s) + pad * 2);
    const k = document.createElement('canvas'); k.width = sw; k.height = sh;
    k.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    out.figBlobs.push(await blobCompacto(k, 1000, 0.72));
    k.width = k.height = 0;
  }
  const nLetras = linhas.map(l => l.text).join('').replace(/\s/g, '').length;
  if (nLetras < 40 || escaneada && linhas.length < 5) {
    onStep && onStep('lendo página escaneada (OCR)');
    const t = await ocr(canvas);
    if (t) { out.texto = t; out.ocr = true; }
  }
  // Foto da página só quando o texto não basta (escaneada, mapa mental, esquema). Páginas de texto comum
  // já ficam inteiras no app, e a foto delas seria a maior parte do espaço ocupado no Supabase.
  if (out.ocr || nLetras < 300) out.imagemBlob = await blobCompacto(canvas, 1200, 0.62);
  canvas.width = canvas.height = 0;
  return out;
}

async function extractPdf(blob, onStep, comImagens) {

async function extractDocx(blob) {
  await loadLib('mammoth');
  const imgs = [];
  const res = await mammoth.convertToHtml({ arrayBuffer: await blob.arrayBuffer() }, {
    convertImage: mammoth.images.imgElement(async image => {
      const b64 = await image.read('base64'); const idx = imgs.length;
      imgs.push({ b64, type: image.contentType || 'image/png' }); return { src: `img:${idx}` };
    }),
  });
  const doc = new DOMParser().parseFromString(res.value, 'text/html');
  const sections = []; let cur = { titulo: null, nodes: [] };
  for (const node of [...doc.body.children]) {
    if (/^H[12]$/.test(node.tagName)) {
      if (cur.nodes.length) { sections.push(cur); cur = { titulo: node.textContent.trim(), nodes: [] }; }
      else cur.titulo = node.textContent.trim();
    } else cur.nodes.push(node);
  }
  sections.push(cur);
  return sections.filter(s => s.nodes.length).map(s => {
    const html = s.nodes.map(n => n.outerHTML).join('');
    const tmp = doc.createElement('div'); tmp.innerHTML = html;
    const texto = [...tmp.querySelectorAll('p,li,td,th,h3,h4,h5,h6')].filter(e => !e.querySelector('p,li')).map(e => e.textContent.trim()).filter(Boolean).join('\n');
    const destaques = [...tmp.querySelectorAll('strong,b')].map(e => e.textContent.trim()).filter(t => t.length > 3 && t.length < 120);
    const used = [...new Set([...html.matchAll(/src="img:(\d+)"/g)].map(m => +m[1]))];
    return { titulo: s.titulo, texto, html, imgsDocx: used.map(i => ({ idx: i, ...imgs[i] })), destaques };
  });
}

async function extractPptx(blob) {
  await loadLib('jszip');
  const zip = await JSZip.loadAsync(blob);
  const A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const P = 'http://schemas.openxmlformats.org/presentationml/2006/main';
  const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const num = n => +(n.match(/slide(\d+)\.xml$/) || [0, 0])[1];
  const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => num(a) - num(b));
  const resolve = (base, rel) => { const parts = (base + rel).split('/'); const st = []; parts.forEach(p => { if (p === '..') st.pop(); else if (p && p !== '.') st.push(p); }); return st.join('/'); };
  const slides = []; const useCount = {};
  for (const sf of slideFiles) {
    const xml = new DOMParser().parseFromString(await zip.file(sf).async('string'), 'application/xml');
    let titulo = null; const bullets = []; const destaques = [];
    for (const sp of xml.getElementsByTagNameNS(P, 'sp')) {
      const ph = sp.getElementsByTagNameNS(P, 'ph')[0];
      const isTitle = ph && /title|ctrTitle/i.test(ph.getAttribute('type') || '');
      const paras = [...sp.getElementsByTagNameNS(A, 'p')].map(p => {
        for (const r of p.getElementsByTagNameNS(A, 'r')) {
          const rpr = r.getElementsByTagNameNS(A, 'rPr')[0];
          if (rpr && rpr.getAttribute('b') === '1') { const t = r.textContent.trim(); if (t.length > 3) destaques.push(t); }
        }
        return [...p.getElementsByTagNameNS(A, 't')].map(t => t.textContent).join('').trim();
      }).filter(Boolean);
      if (isTitle && !titulo) titulo = paras.join(' '); else bullets.push(...paras);
    }
    for (const tr of xml.getElementsByTagNameNS(A, 'tr')) {
      const cells = [...tr.getElementsByTagNameNS(A, 'tc')].map(tc => tc.textContent.trim()).filter(Boolean);
      if (cells.length) bullets.push(cells.join(' | '));
    }
    const paths = [];
    const relPath = sf.replace('ppt/slides/', 'ppt/slides/_rels/') + '.rels';
    if (zip.file(relPath)) {
      const rels = new DOMParser().parseFromString(await zip.file(relPath).async('string'), 'application/xml');
      const map = {}; for (const r of rels.getElementsByTagName('Relationship')) map[r.getAttribute('Id')] = r.getAttribute('Target');
      for (const blip of xml.getElementsByTagNameNS(A, 'blip')) {
        const tgt = map[blip.getAttributeNS(R, 'embed')]; if (!tgt) continue;
        const path = resolve('ppt/slides/', tgt);
        if (/\.(png|jpe?g|gif|webp)$/i.test(path) && !paths.includes(path)) { paths.push(path); useCount[path] = (useCount[path] || 0) + 1; }
      }
    }
    slides.push({ titulo, bullets: [...new Set(bullets)], destaques, paths });
  }
  const limit = Math.max(3, slides.length * 0.4);                     // ignora logos repetidos em todos os slides
  const out = [];
  for (const s of slides) {
    if (!s.titulo && !s.bullets.length && !s.paths.length) continue;
    const blobs = [];
    for (const p of s.paths) if (useCount[p] <= limit) blobs.push(new Blob([await zip.file(p).async('arraybuffer')], { type: mimeFromExt(p) }));
    out.push({ titulo: s.titulo, texto: s.bullets.join('\n'), bullets: s.bullets, imagensBlobs: blobs, destaques: s.destaques });
  }
  return out;
}

/* ============================ Etapa 2: IA (Gemini, via função "ia" do servidor) ============================
   O código faz o trabalho braçal (ler, limpar, recortar figuras, separar questões). A IA recebe o texto já limpo
   e devolve: classificação, apostila organizada, resumo estruturado, flashcards e comentários das questões.
   O ritmo é controlado para caber no limite gratuito (poucos pedidos por minuto). */
const esperar = ms => new Promise(r => setTimeout(r, ms));
const IA = {
  ultimo: 0, intervalo: 6500,
  disponivel() { return App.store?.mode === 'supabase'; },
  async chamar(prompt, { sistema = IA_SISTEMA, formato = 'json', maxTokens = 24000, temperatura = 0.2, reserva = false } = {}) {
    const espera = this.ultimo + this.intervalo - Date.now(); if (espera > 0) await esperar(espera);
    let ultimoErro = null;
    for (let t = 0; t < 4; t++) {
      this.ultimo = Date.now();
      const { data } = await App.store.sb.auth.getSession();
      let r, j;
      try {
        r = await fetch(cfg('SUPABASE_URL').replace(/\/$/, '') + '/functions/v1/ia', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session?.access_token, apikey: cfg('SUPABASE_ANON_KEY') },
          body: JSON.stringify({ prompt, sistema, formato, maxTokens, temperatura, reserva: reserva || t >= 2 }) });
        j = await r.json().catch(() => ({}));
      } catch (e) { ultimoErro = e; await esperar(5000 * (t + 1)); continue; }
      if (r.ok) return formato === 'json' ? lerJsonDaIA(j.texto) : String(j.texto || '').trim();
      ultimoErro = new Error(j.error || `A IA respondeu ${r.status}`);
      if (r.status === 429) { if (t < 2) { await esperar(35000 * (t + 1)); continue; } ultimoErro.cota = true; break; }
      if (r.status >= 500) { await esperar(9000 * (t + 1)); continue; }
      break;
    }
    if (ultimoErro?.cota) ultimoErro.message = 'O limite gratuito do Gemini foi atingido por agora. O material continua disponível na versão automática; use “Organizar com IA” mais tarde.';
    throw ultimoErro || new Error('A IA não respondeu.');
  },
};
function lerJsonDaIA(txt) {
  let s = String(txt || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try { return JSON.parse(s); } catch { /* tenta recortar */ }
  const a = Math.min(...['{', '['].map(c => s.indexOf(c)).filter(i => i >= 0));
  const b = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (isFinite(a) && b > a) return JSON.parse(s.slice(a, b + 1));
  throw new Error('A IA devolveu uma resposta em formato inesperado.');
}
const IA_SISTEMA = `Você é um editor de material didático de Medicina para estudantes de graduação no Brasil.
Escreva sempre em português do Brasil, com rigor técnico e linguagem clara.
Nunca invente informação que não esteja no material recebido, a não ser quando a tarefa pedir explicitamente.

/* Texto de páginas de Word/PowerPoint (HTML) com as imagens viradas marcadores */
function htmlParaTexto(html) {
  const doc = new DOMParser().parseFromString(`<div>${sanitize(html)}</div>`, 'text/html');
  const out = [];
  doc.body.firstElementChild.querySelectorAll('h1,h2,h3,h4,p,li,td,img').forEach(e => {
    if (e.tagName === 'IMG') { if (e.dataset.ref) out.push(`[[REF:${e.dataset.ref}]]`); return; }
    if (e.querySelector('p,li')) return;
    const t = e.textContent.trim(); if (!t) return;
    out.push(/^H[1-4]$/.test(e.tagName) ? '## ' + t : e.tagName === 'LI' ? '- ' + t : t);
  });
  return out.join('\n');
}

      titulo: String(s.titulo).toUpperCase().slice(0, 80),
      pontos: s.itens.filter(i => i?.texto).map(i => ({ texto: String(i.texto), pagina_id: pg(Number(i.pagina)) })),
      figurasIA: (s.figuras || []).map(String).slice(0, 2),

      const lote = faltando.slice(i, i + 8).map(q => ({ id: q.id, enunciado: q.enunciado.slice(0, 2500),

      const x = atualizadas.get(q.id); if (!x) return q;
      const ex = { ...(q.extras || {}) }; const out = { ...q };
      const letra = String(x.gabarito || '').toLowerCase();
      if (!q.gabarito && letra && (q.alternativas || []).some(a => a.letra === letra)) { out.gabarito = letra; ex.gabarito_ia = true; }
      if (!(q.justificativa || '').trim() && x.comentario) { out.justificativa = String(x.comentario); ex.comentario_ia = true; }

    await store.replaceAuto('questoes', mid, ['PROVA', 'LACUNA'], [...novas, ...lacunas]);
  }
}

/* Markdown da IA -> HTML da apostila (títulos, listas, tabelas, alertas, figuras e âncoras de página) */
function inlineMd(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>'); }
function mdParaHtml(md, ctx) {
  const linhas = String(md || '').split('\n'); let html = ''; const sumario = []; let hc = 0;
  let lista = null, tabela = [], para = [];
  const fecharPara = () => { if (para.length) { html += `<p>${inlineMd(para.join(' '))}</p>`; para = []; } };
  const fecharLista = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const fecharTabela = () => {
    if (!tabela.length) return;
    const rows = tabela.filter(r => !/^\|?\s*:?-{2,}/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
    html += `<div class="scroll-x"><table class="tab-md">${rows.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${inlineMd(c)}</th>` : `<td>${inlineMd(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    tabela = [];
  };
  const fecharTudo = () => { fecharPara(); fecharLista(); fecharTabela(); };
  for (const bruta of linhas) {
    let l = bruta.trim();
    l = l.replace(/⟦P:(\d+)⟧/g, (_, n) => { const id = ctx.mapa[+n]; if (id) { fecharTudo(); html += `<span class="ancora" id="p-${id}"></span>`; } return ''; }).trim();
    if (!l) { fecharTudo(); continue; }
    const fig = l.match(/^\[\[(FIG:(\d+)\.(\d+)|REF:([^\]]+))\]\]$/);
    if (fig) { fecharTudo(); html += fig[4] ? `<figure class="fig"><img data-ref="${esc(fig[4])}" alt="Figura do material"></figure>` : (ctx.paginas.get(ctx.mapa[+fig[2]]) ? figuraHtml(ctx.paginas.get(ctx.mapa[+fig[2]]), +fig[3]) : ''); continue; }
    if (/^\|/.test(l)) { fecharPara(); fecharLista(); tabela.push(l); continue; } else fecharTabela();
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { fecharTudo(); const id = 'h-' + (hc++); const tag = h[1].length <= 2 ? 'h3' : 'h4'; html += `<${tag} id="${id}">${inlineMd(h[2])}</${tag}>`; if (tag === 'h3') sumario.push({ id, t: h[2].replace(/\*\*/g, '') }); continue; }
    if (/^>\s?/.test(l)) { fecharTudo(); html += `<div class="alerta">${inlineMd(l.replace(/^>\s?/, ''))}</div>`; continue; }
    const ul = l.match(/^[-*•]\s+(.*)$/), ol = l.match(/^\d+[.)]\s+(.*)$/);
    if (ul || ol) { fecharPara(); const tipo = ul ? 'ul' : 'ol'; if (lista !== tipo) { fecharLista(); html += `<${tipo}>`; lista = tipo; } html += `<li>${inlineMd((ul || ol)[1])}</li>`; continue; }
    fecharLista(); para.push(l);
  }
  fecharTudo();
  return { html, sumario };
}

/* ============================ Pipeline de envio (2 fases) ============================
   Fase 1: só texto de todos os arquivos (rápido). O conteúdo já fica legível no app.
   Fase 2: figuras recortadas, foto de cada página e OCR das páginas escaneadas. */
let ordemSeq = Date.now();

function limparPaginas(raw) {
  const limpas = removerRepetidas(raw.map(p => ({ ...p, texto: semNulos(p.texto || ''), titulo: semNulos(p.titulo), html: semNulos(p.html),
    destaques: p.destaques?.map(semNulos), bullets: p.bullets?.map(semNulos) })));
  return limpas.map(p => ({
    ...p,
    titulo: p.titulo ? (limparLinha(p.titulo) || null) : null,
    texto: limparRuido(p.texto),
    destaques: (p.destaques || []).map(limparLinha).filter(Boolean),

}
async function processarItens(items, ui) {

      const texto = lidos.map(l => l.pages.slice(0, 6).map(p => (p.titulo || '') + '\n' + p.texto).join('\n')).join('\n').slice(0, 60000);
      base = classificarConteudo(nomes, texto);
    }

    if (!grupo[0].destino && IA.disponivel()) {
      try { ui.step(feitos - 1, total, (lidos[0] || midiasGrupo[0]).it.nome, 'IA: identificando especialidade, área e tema'); porIA = await classificarComIA([...lidos, ...midiasGrupo], [...taxonomia]); }
      catch (e) { ui.log('Classificação pela IA indisponível agora; usando a automática. ' + e.message, true); }
    }

      try {
        const dest = it.destino || porIA[lidos.indexOf(l)] || { periodo: base.especialidade, disciplina: base.area, materia: escolherTema(it.path || [], it.nome) };

        res.midias = (res.midias || 0) + 1;

/* ===================== Separação: conteúdo x questões ===================== */
const RE_INICIO_QUESTOES = /^(caderno de exerc[ií]cios|quest[õo]es da apostila|exerc[ií]cios( de fixa[çc][ãa]o)?|quest[õo]es comentadas|banco de quest[õo]es|gabaritos?|coment[áa]rios da equipe)/i;
const RE_CAB_QUESTAO = /^(\d{1,3})\s*[-–—]\s*((?:19|20)\d{2}\b.*)$/;
const RE_FIG = /^\[\[FIG:(\d+)\]\]$/;
const ehTituloCaixaAlta = t => t.length >= 4 && t.length <= 80 && /[A-ZÀ-Ý]{3}/.test(t) && !/[a-zà-ÿ]/.test(t) && !/^[A-E]\)/.test(t) && !RE_FIG.test(t);
function ehPaginaDeQuestoes(p) {
  const t = p.texto || '';
  const alts = (t.match(/^\s*\(?[a-eA-E]\s*[).]\s*/gm) || []).length;
  const cabs = t.split('\n').filter(l => RE_CAB_QUESTAO.test(l.trim())).length;
  return alts >= 3 || cabs >= 2 || RE_INICIO_QUESTOES.test(String(p.titulo || '').trim());
}
function separarConteudo(pages, docs) {
  const ordem = new Map(docs.map((d, i) => [d.id, i]));
  const ord = [...pages].sort((a, b) => (ordem.get(a.documento_id) ?? 0) - (ordem.get(b.documento_id) ?? 0) || a.n - b.n);
  const conteudo = [], questoes = []; const emQuestoes = new Set();
  for (const p of ord) {
    if (p.html && !p.texto) { conteudo.push({ pagina: p, texto: p.texto || '' }); continue; }
    if (emQuestoes.has(p.documento_id)) { questoes.push({ pagina: p, texto: p.texto || '' }); continue; }
    const linhas = String(p.texto || '').split('\n');
    const corte = linhas.findIndex(l => RE_INICIO_QUESTOES.test(l.trim()) && l.trim().length < 60);
    if (corte < 0 && ehPaginaDeQuestoes(p)) { questoes.push({ pagina: p, texto: p.texto || '' }); continue; }
    if (corte >= 0) {
      if (corte > 0) conteudo.push({ pagina: p, texto: linhas.slice(0, corte).join('\n') });
      questoes.push({ pagina: p, texto: linhas.slice(corte).join('\n') });
      emQuestoes.add(p.documento_id);
    } else conteudo.push({ pagina: p, texto: p.texto || '' });
  }
  return { conteudo, questoes };
}

/* ===================== Análise do texto (base para resumo, flashcards e lacunas) ===================== */
const termRe = t => new RegExp('(?<![\\p{L}\\p{N}])' + escRe(t) + '(?![\\p{L}\\p{N}])', 'iu');
const SECOES = [

  ['EPIDEMIOLOGIA', /(epidemiolog|incid[êe]ncia|preval[êe]ncia|mais comum|mais frequente|\d+[,.]?\d*\s?%)/i],
  ['ETIOLOGIA E FATORES DE RISCO', /(etiolog|causad[oa]s? (por|pel)|principais causas|fatores? de risco|predisp|desencade)/i],
  ['FISIOPATOLOGIA', /(fisiopatolog|mecanismo|despolariza|repolariza|vetor|condu[çc][ãa]o do est[íi]mulo|potencial de a[çc][ãa]o)/i],
  ['QUADRO CLÍNICO', /(sintoma|sinais cl[íi]nicos|quadro cl[íi]nico|manifesta[çc]|apresenta-se|s[íi]ncope|palpita[çc]|dispneia|dor tor[áa]cica)/i],
  ['CRITÉRIOS DIAGNÓSTICOS', /(crit[ée]rios?)/i],
  ['DIAGNÓSTICO', /(diagn[óo]stic|padr[ãa]o|achados?|reconhec|identific)/i],
  ['CLASSIFICAÇÃO', /(classifica|tipos? de|graus?|est[áa]gios?|subtipos?|primeiro grau|segundo grau|terceiro grau)/i],
  ['EXAMES COMPLEMENTARES', /(exames?|eletrocardiograma|\becg\b|laborat|radiograf|ecocardiograma|dosagem|tomografia|resson[âa]ncia|holter)/i],
  ['COMPLICAÇÕES', /(complica[çc]|evolui para|morte s[úu]bita|sequela)/i],
  ['DIAGNÓSTICOS DIFERENCIAIS', /(diferencia|confund|simula|diferente d[oa]s?)/i],
  ['PROGNÓSTICO', /(progn[óo]stic|mortalidade|sobrevida)/i],
  ['TRATAMENTO', /(tratamento|conduta|terap|droga|medica[çc]|\bdose|cardiovers|marca-?passo|cirurgi|primeira (linha|escolha)|segunda (linha|escolha)|atropina|adrenalina|amiodarona)/i],

function analisar(segs) {
  const N = segs.length || 1; const tf = new Map(), df = new Map(), forms = new Map(); const sents = [];
  segs.forEach((seg, si) => {
    const seen = new Set();

/* ===================== Flashcards (versão por código) ===================== */
const SUJEITO_RUIM = /^(a |o |as |os )?(escolha|conduta|resposta|alternativa|quest[ãa]o|letra|op[çc][ãa]o|melhor|primeira|segunda|mesma|maioria|principal|ideia|isso|isto|este|esta|esse|essa|ele|ela|eles|elas|que|quando|onde|se|n[ãa]o|tamb[ée]m|ainda|j[áa]|aqui|ali|nesse caso|neste caso|o ideal|o objetivo|o importante)\b/i;

    let subtema = seg.pagina.titulo || null;
    for (let i = 0; i < linhas.length; i++) {

async function materiasCache(forcar) { if (!App.matsCache || forcar) App.matsCache = await App.store.listMateriasComContagem(); return App.matsCache; }

/* Botão "voltar para onde estava" depois de "ver no material" */
function rotuloAtual() {
  const { parts } = parseRoute();
  if (parts[0] === 'm') return ({ resumo: 'o resumo', flashcards: 'os flashcards', questoes: 'a questão', conteudo: 'o conteúdo', original: 'o original' })[parts[2] || 'conteudo'] || 'onde estava';
  return ({ painel: 'o painel', flashcards: 'os flashcards', busca: 'a busca' })[parts[0]] || 'onde estava';
}
function marcarVolta() { try { sessionStorage.setItem('voltar', JSON.stringify({ hash: location.hash || '#/', y: window.scrollY, rotulo: rotuloAtual() })); } catch { /* sem sessão */ } }
function lerVolta() { try { return JSON.parse(sessionStorage.getItem('voltar') || 'null'); } catch { return null; } }
function atualizarVoltar() {
  const b = $('#voltarBtn'); const v = lerVolta(); const h = location.hash || '#/';
  const destino = /^#\/m\/[^/]+\/(conteudo|original)/.test(h);
  if (!v || h === v.hash || !destino) { b.hidden = true; if (v && !destino) sessionStorage.removeItem('voltar'); return; }
  b.hidden = false; b.textContent = `← Voltar para ${v.rotulo}`;
}

async function render() {
  const seq = ++renderSeq; const stale = () => seq !== renderSeq;
  const { parts, q } = parseRoute(); const view = $('#view'); const sec = parts[0] || '';
  const navKey = { '': 'biblioteca', esp: 'biblioteca', m: 'biblioteca', flashcards: 'painel', painel: 'painel', busca: 'busca', enviar: 'enviar', conta: 'conta' }[sec] || 'biblioteca';
  $$('.nav a').forEach(a => a.dataset.nav === navKey ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (sec !== 'busca') $('#q').value = '';
  atualizarVoltar();
  if (!App.store) return;
  try {
    if (App.store.mode === 'supabase' && sec !== 'conta') {
      if (!App.store.user()) return viewLogin(view);
      if (!(await App.store.membro())) return viewCodigo(view);
    }
    if (sec === 'm') await viewMateria(view, parts[1], parts[2] || 'conteudo', parts[3], stale, q);
    else if (sec === 'esp') await viewEspecialidade(view, parts[1], stale);
    else if (sec === 'flashcards') await viewFlashcardsGlobal(view, stale);
    else if (sec === 'painel') await viewPainel(view, stale, q.get('f') || '');
    else if (sec === 'busca') await viewBusca(view, q.get('q') || '', stale);
    else if (sec === 'enviar') await viewEnviar(view);

}

/* ============================ Biblioteca: Especialidade › Área › Tema ============================ */
const HUES = ['#1D6F63', '#7A4FB5', '#B4532A', '#2F6DB5', '#A23B6B', '#5F7D1F', '#AD7B12', '#2E8B8B', '#8A5A44', '#4B5DA8'];
const corDe = nome => HUES[[...norm(nome)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % HUES.length];
const ordemGeralPorUltimo = (a, b) => (a === 'Geral') - (b === 'Geral') || (a === 'Outros') - (b === 'Outros') || cmpNatural(a, b);
async function viewBiblioteca(view, stale) {
  const mats = await materiasCache(true); if (stale()) return;
  if (!mats.length) {
    view.innerHTML = `<section class="empty"><h1>A biblioteca está vazia</h1><p class="lede">Envie uma pasta do Google Drive. O app separa o material por especialidade, área e tema, e monta conteúdo, resumo, flashcards e questões.</p><a class="btn primary" href="#/enviar">Enviar material</a></section>`;

    <div class="lib-acoes"><a class="btn primary" href="#/flashcards">Estudar flashcards</a><a class="btn" href="#/painel">Meu desempenho</a></div>
    <div class="esp-grid">${esps.map(e => {
      const ms = porEsp.get(e); const areas = new Set(ms.map(m => m.disciplina)).size;
      return `<a class="esp-tile" style="--hue:${corDe(e)}" href="#/esp/${encodeURIComponent(e)}"><span class="nome">${esc(e)}</span>
        <span class="meta">${plural(areas, 'área', 'áreas')}, ${plural(ms.length, 'tema', 'temas')}</span></a>`;
    }).join('')}</div>
    ${App.store.mode === 'local' ? `<p class="notice" style="margin-top:28px">Modo local: este acervo está só neste aparelho.</p>` : ''}`;
}

}

/* ============================ Tema (matéria) ============================ */

/* Transcrições em andamento e reorganização automática quando novos materiais chegam */
App.reorganizando = new Set();
async function avisosDoTema(mat, docs, stale) {
  const el = () => document.getElementById('bannerTema');
  try {
    const [mids, r] = await Promise.all([App.store.midiasDoTema(mat.id), App.store.getResumo(mat.id)]);
    if (stale() || !el()) return;
    const pend = mids.filter(m => m.status === 'fila' || m.status === 'processando');
    const erros = mids.filter(m => m.status === 'erro');
    let html = '';
    if (pend.length) {
      const a = pend.filter(m => m.tipo === 'audio').length, v = pend.length - a;
      html += `<p class="notice" style="margin:10px 0 0">Transcrição em andamento: ${[a ? plural(a, 'áudio', 'áudios') : '', v ? plural(v, 'vídeo', 'vídeos') : ''].filter(Boolean).join(' e ')}. Entram neste tema sozinhos quando ficarem prontos.</p>`;
    }
    if (erros.length) html += `<p class="notice" style="margin:6px 0 0;color:var(--alert)">Não foi possível transcrever: ${erros.map(m => esc(m.nome)).join(', ')}.</p>`;
    const novos = docs.some(d => r?.geradoEm && d.criado_em > r.geradoEm);
    if (novos && !App.reorganizando.has(mat.id)) {
      App.reorganizando.add(mat.id);
      html += `<p class="notice" id="reorgAviso" style="margin:6px 0 0">Chegou material novo (aulas transcritas). Reorganizando o tema…</p>`;
      (async () => {
        const aviso = t => { const a = document.getElementById('reorgAviso'); if (a) a.textContent = t; };
        try {
          await gerarConteudo(mat.id);
          if (IA.disponivel()) await melhorarComIA(mat.id, m => aviso('Reorganizando com as aulas novas: ' + m.replace(/^IA: /, '')));
          toast('Tema atualizado com o material novo');
        } catch (e) { console.warn(e); aviso(e.cota ? e.message : 'Não foi possível reorganizar agora. Tente “Organizar com IA” mais tarde.'); }
        finally { App.reorganizando.delete(mat.id); if (location.hash.includes(mat.id)) render(); }
      })();
    } else if (App.reorganizando.has(mat.id)) html += `<p class="notice" id="reorgAviso" style="margin:6px 0 0">Reorganizando o tema com o material novo…</p>`;
    el().innerHTML = html;
  } catch (e) { console.warn(e); }
}
async function hydrateImages(root) {
  const imgs = $$('img[data-ref]', root); if (!imgs.length) return;
  try {
    const urls = await App.store.imageUrls([...new Set(imgs.map(i => i.dataset.ref))]);
    imgs.forEach(i => { const u = urls.get(i.dataset.ref); i.loading = 'lazy'; if (u) i.src = u; else i.alt = 'Imagem indisponível'; });
  } catch (e) { console.warn(e); }
}
function figuraHtml(pagina, n, legenda) {
  const ref = (pagina.figuras || [])[n];
  if (ref) return `<figure class="fig"><img data-ref="${esc(ref)}" alt="Figura do material">${legenda ? `<figcaption>${esc(legenda)}</figcaption>` : ''}</figure>`;
  if (!pagina.imagem) return `<figure class="fig pendente">Figura sendo processada. Ela aparece aqui quando o envio terminar.</figure>`;
  return '';
}

/* Apostila: o conteúdo inteiro, em ordem, com subtítulos, listas e figuras no lugar certo */
function montarApostila(segs, docs, mid) {
  const porDoc = groupBy(segs, s => s.pagina.documento_id);
  let html = ''; const sumario = []; let hc = 0;
  for (const doc of docs) {
    const ss = porDoc.get(doc.id); if (!ss) continue;
    html += `<h2 class="cap" id="cap-${doc.id}">${esc(doc.nome)}</h2>`; sumario.push({ id: 'cap-' + doc.id, t: doc.nome, cap: true });
    let ultimoTitulo = null;
    for (const seg of ss) {
      const p = seg.pagina;
      html += `<span class="ancora" id="p-${p.id}"></span>`;
      if (p.html && !seg.texto) { html += sanitize(limparHtml(p.html)); continue; }
      const linhas = joinLines(seg.texto).split('\n').map(l => l.trim()).filter(Boolean);
      if (p.titulo && norm(p.titulo) !== norm(ultimoTitulo || '') && norm(p.titulo) !== norm(linhas[0] || '')) {
        const id = 'h-' + (hc++); html += `<h3 id="${id}">${esc(p.titulo)}</h3>`; sumario.push({ id, t: p.titulo }); ultimoTitulo = p.titulo;
      }
      let lista = false;
      const fecharLista = () => { if (lista) { html += '</ul>'; lista = false; } };
      for (let i = 0; i < linhas.length; i++) {
        const t = linhas[i];
        const fm = t.match(RE_FIG);
        if (fm) { fecharLista(); const leg = /^figura\s*\d+/i.test(linhas[i + 1] || '') ? linhas[++i] : ''; html += figuraHtml(p, +fm[1], leg); continue; }
        if (ehTituloCaixaAlta(t)) { fecharLista(); if (norm(t) === norm(ultimoTitulo || '')) continue; const id = 'h-' + (hc++); html += `<h3 id="${id}">${esc(t)}</h3>`; sumario.push({ id, t }); ultimoTitulo = t; continue; }
        if (/^[•●▪◦\-–*]\s+/.test(t) || /^\d{1,2}[.)]\s+\S/.test(t) && t.length < 300) {
          if (!lista) { html += '<ul>'; lista = true; }
          html += `<li>${esc(t.replace(/^[•●▪◦\-–*]\s+/, ''))}</li>`; continue;
        }
        fecharLista();
        if (t.length <= 90 && /:$/.test(t)) { html += `<h4>${esc(t.replace(/:$/, ''))}</h4>`; continue; }
        if (/^figura\s*\d+\.?$/i.test(t)) continue;
        html += `<p>${esc(t)}</p>`;
      }
      fecharLista();
    }
  }
  return { html, sumario };
}
async function renderConteudo(body, mat, docs, extra, stale) {
  if (!docs.length) { body.innerHTML = `<div class="empty"><p>Nenhum arquivo neste tema ainda.</p><a class="btn primary" href="#/enviar">Enviar material</a></div>`; return; }
  const pages = await paginasLimpas(mat.id); if (stale()) return;
  const rIA = await App.store.getResumo(mat.id); if (stale()) return;
  if (rIA?.versao === 4 && rIA.apostila) {
    const { html, sumario } = mdParaHtml(rIA.apostila, { mapa: rIA.mapa || [], paginas: new Map(pages.map(p => [p.id, p])) });
    body.innerHTML = `<p class="notice">Apostila organizada com IA a partir do material. Na dúvida, confira a aba <a href="#/m/${mat.id}/original">Original</a>.</p>
      ${sumario.length > 3 ? `<details class="sumario"><summary>Sumário (${sumario.length} seções)</summary><ol>${sumario.map(s => `<li><a href="#" data-action="ir-ancora" data-id="${s.id}">${esc(s.t)}</a></li>`).join('')}</ol></details>` : ''}
      <article class="apostila">${html}</article>`;
    hydrateImages(body);
    if (extra) { const alvo = document.getElementById('p-' + extra) || document.getElementById(extra); if (alvo) requestAnimationFrame(() => alvo.scrollIntoView({ block: 'start' })); }
    return;
  }
  const { conteudo } = separarConteudo(pages, docs);
  if (!conteudo.length) { body.innerHTML = `<div class="empty"><p>Este tema só tem questões e gabaritos, sem texto de conteúdo. Veja a aba <a href="#/m/${mat.id}/questoes">Questões</a>.</p></div>`; return; }
  const { html, sumario } = montarApostila(conteudo, docs, mat.id);
  body.innerHTML = `${sumario.length > 3 ? `<details class="sumario"><summary>Sumário (${sumario.length} seções)</summary><ol>${sumario.map(s => `<li${s.cap ? ' style="font-weight:700"' : ''}><a href="#" data-action="ir-ancora" data-id="${s.id}">${esc(s.t)}</a></li>`).join('')}</ol></details>` : ''}
    <article class="apostila">${html}</article>`;
  hydrateImages(body);
  if (extra) {
    const alvo = document.getElementById('p-' + extra) || document.getElementById(extra);
    if (alvo) requestAnimationFrame(() => alvo.scrollIntoView({ block: 'start' }));
  }
}
/* Original: página por página, texto e figuras separados; foto da página só se pedir */
async function renderOriginal(body, mat, docs, extra, stale) {
  if (!docs.length) { body.innerHTML = `<div class="empty"><p>Nenhum arquivo neste tema ainda.</p></div>`; return; }
  const pages = await paginasLimpas(mat.id); if (stale()) return;
  let doc = docs[0]; let focus = null;
  if (extra && extra.startsWith('d:')) doc = docs.find(d => d.id === extra.slice(2)) || doc;
  else if (extra) { const p = pages.find(x => x.id === extra); if (p) { doc = docs.find(d => d.id === p.documento_id) || doc; focus = p.id; } }
  const dp = pages.filter(p => p.documento_id === doc.id).sort((a, b) => a.n - b.n);
  body.innerHTML = `
    ${docs.length > 1 ? `<div class="field"><label for="docPick">Arquivo (${docs.length} neste tema)</label><select id="docPick" data-mid="${mat.id}">${docs.map(d => `<option value="${d.id}" ${d.id === doc.id ? 'selected' : ''}>${esc(d.nome)}</option>`).join('')}</select></div>` : ''}
    <div class="doc-head"><h2>${esc(doc.nome)}</h2><span class="meta">${esc(doc.tipo || 'Arquivo')}, ${plural(dp.length, 'página', 'páginas')}</span><span class="spacer"></span>
      ${App.store.podeApagar(doc) ? `<button class="btn ghost small danger" data-action="del-doc" data-id="${doc.id}" data-mid="${mat.id}">Remover arquivo</button>` : ''}</div>
    ${dp.map(p => {
      const figs = (p.figuras || []).filter(Boolean);
      const texto = (p.texto || '').replace(/\[\[FIG:\d+\]\]/g, '').trim();
      return `<article class="pg-orig" id="p-${p.id}"><span class="pg-n">Página ${p.n}</span>${p.titulo ? `<h3>${esc(p.titulo)}</h3>` : ''}
        ${p.html && !texto ? `<div class="reading">${sanitize(limparHtml(p.html))}</div>` : `<div class="reading">${texto ? paras(texto) : '<p class="notice">Sem texto nesta página.</p>'}</div>`}
        ${figs.length ? `<div class="figs">${figs.map(r => `<img data-ref="${esc(r)}" alt="Figura da página ${p.n}">`).join('')}</div>` : ''}
        ${p.imagem ? `<button class="btn small" data-action="ver-foto" data-ref="${esc(p.imagem)}">Ver foto da página</button><div class="foto"></div>` : ''}
      </article>`;
    }).join('')}`;
  hydrateImages(body);
  if (focus) requestAnimationFrame(() => document.getElementById('p-' + focus)?.scrollIntoView({ block: 'start' }));
}

/* Resumo na ordem clínica, com figuras e link para o material */
async function renderResumo(body, mat, stale) {
  let r = await App.store.getResumo(mat.id);
  if (!r || (r.versao !== 3 && r.versao !== 4)) {
    body.innerHTML = `<p class="notice">Atualizando o resumo para o formato novo…</p>`;
    try { await gerarConteudo(mat.id); r = await App.store.getResumo(mat.id); } catch (e) { console.error(e); }
    if (stale()) return;
  }
  if (!r || !(r.secoes || []).length) {
    body.innerHTML = `<div class="empty"><p>Ainda não há resumo. Ele é montado a partir do texto de conteúdo do tema.</p><button class="btn primary" data-action="regenerar" data-id="${mat.id}">Montar resumo agora</button></div>`;
    return;
  }
  const pages = new Map((await App.store.listPaginas(mat.id)).map(p => [p.id, p])); if (stale()) return;
  const figIA = f => { const m = String(f).match(/^FIG:(\d+)\.(\d+)$/); if (m) { const pg = pages.get((r.mapa || [])[+m[1]]); return pg ? figuraHtml(pg, +m[2]) : ''; } const ref = String(f).replace(/^REF:/, ''); return /^(local|sb):/.test(ref) ? `<figure class="fig"><img data-ref="${esc(ref)}" alt="Figura do material"></figure>` : ''; };
  body.innerHTML = `<p class="notice">${r.versao === 4 ? 'Resumo organizado com IA a partir do material, em ordem lógica de estudo.' : `Resumo montado a partir de ${plural(r.paginas, 'página', 'páginas')} do conteúdo, organizado em ordem clínica. As frases vêm do próprio material.`} Toque em “ver no material” para ler o trecho completo.</p>
    <div class="resumo-v3">${r.secoes.map(s => `<section><h3>${esc(s.titulo)}</h3><ul>${s.pontos.map(p => `<li>${esc(p.texto)}${p.pagina_id ? `<a class="src" data-volta href="#/m/${mat.id}/conteudo/${p.pagina_id}">ver no material</a>` : ''}</li>`).join('')}</ul>
      ${(s.figuras || []).map(f => { const pg = pages.get(f.pagina_id); return pg ? figuraHtml(pg, f.n) : ''; }).join('')}${(s.figurasIA || []).map(figIA).join('')}</section>`).join('')}</div>`;
  hydrateImages(body);
}

/* ============================ Progresso do aluno (salvo no servidor) ============================ */
const Progresso = {
  mapa: null,
  async carregar(forcar) {
    if (this.mapa && !forcar) return;
    try { const rows = await App.store.progressoListar(); this.mapa = new Map(rows.map(r => [r.tipo + ':' + r.item_id, r])); }
    catch (e) { console.warn(e); this.mapa = this.mapa || new Map(); }
  },
  get(tipo, id) { return this.mapa?.get(tipo + ':' + id) || null; },
  todos(tipo) { return [...(this.mapa?.values() || [])].filter(r => r.tipo === tipo); },
  async registrar(tipo, id, materia_id, campos) {
    if (!this.mapa) this.mapa = new Map();
    const ant = this.get(tipo, id);
    const row = { tipo, item_id: id, materia_id, acertou: campos.acertou ?? null, resposta: campos.resposta ?? null, estado: campos.estado ?? null,
      vezes: (ant?.vezes || 0) + 1, atualizado_em: nowIso() };
    this.mapa.set(tipo + ':' + id, row);
    try { await App.store.progressoSalvar(row); await App.store.eventoSalvar({ tipo, item_id: id, materia_id, acertou: row.acertou }); }
